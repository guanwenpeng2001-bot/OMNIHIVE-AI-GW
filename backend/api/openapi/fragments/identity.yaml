paths:
  /api/v2/me/scopes:
    get:
      operationId: identityScopes
      summary: List accessible workspaces and projects
      parameters:
      - $ref: '#/components/parameters/IdentityLimit'
      - $ref: '#/components/parameters/IdentityCursor'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityWorkspacePage'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/workspaces/{workspace_id}/projects:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    get:
      operationId: identityProjects
      summary: List visible projects
      parameters:
      - $ref: '#/components/parameters/IdentityLimit'
      - $ref: '#/components/parameters/IdentityCursor'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityProjectPage'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
    post:
      operationId: identityCreateProject
      summary: Create a project
      parameters:
      - $ref: '#/components/parameters/IdentityIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityName'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityProject'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityProjectID'
    get:
      operationId: identityProject
      summary: Read project metadata
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityProject'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
    patch:
      operationId: identityRenameProject
      summary: Rename a project
      parameters:
      - $ref: '#/components/parameters/IdentityVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityName'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityProject'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
    delete:
      operationId: identityArchiveProject
      summary: Archive a project
      parameters:
      - $ref: '#/components/parameters/IdentityVersion'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityProject'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/access:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityProjectID'
    get:
      operationId: identityAccess
      summary: Read current actions in project
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityAccess'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/key-groups:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityProjectID'
    get:
      operationId: identityKeyGroups
      summary: List groups eligible for key issuance by the current actor
      parameters:
      - $ref: '#/components/parameters/IdentityLimit'
      - $ref: '#/components/parameters/IdentityCursor'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityKeyGroupPage'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/groups/{id}:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityProjectID'
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    put:
      operationId: identityBindGroup
      summary: Assign an unused default-project group to this project
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityGroupBinding'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
    delete:
      operationId: identityUnbindGroup
      summary: Return an unused project group to the workspace default project
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityGroupBinding'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/keys:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityProjectID'
    get:
      operationId: identityKeys
      summary: List safe project key metadata
      parameters:
      - $ref: '#/components/parameters/IdentityLimit'
      - $ref: '#/components/parameters/IdentityCursor'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityKeyPage'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
    post:
      operationId: identityCreateKey
      summary: Issue a restricted project credential
      parameters:
      - $ref: '#/components/parameters/IdentityIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityKeyInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityKey'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/workspaces/{workspace_id}/members:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    get:
      operationId: identityMembers
      summary: List workspace members for grant administration
      parameters:
      - $ref: '#/components/parameters/IdentityLimit'
      - $ref: '#/components/parameters/IdentityCursor'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityMemberPage'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/workspaces/{workspace_id}/members/{id}/grants:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityMemberID'
    get:
      operationId: identityMemberGrants
      summary: Read the current project grants for a member
      parameters: []
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted current grant version for If-Match
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityMemberGrants'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
    put:
      operationId: identitySetGrants
      summary: Replace member project grants
      parameters:
      - $ref: '#/components/parameters/IdentityVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityGrantInput'
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted updated grant version for If-Match
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityGrantVersion'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/workspaces/{workspace_id}/operations/{id}:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityOperationID'
    get:
      operationId: identityOperation
      summary: Read authorized operation status
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityOperation'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/workspaces/{workspace_id}/access:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    get:
      operationId: identityWorkspaceAccess
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityWorkspaceAccess'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/workspaces/{workspace_id}/access-requests:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    get:
      operationId: identityAccessRequests
      parameters:
      - $ref: '#/components/parameters/IdentityCursor'
      - $ref: '#/components/parameters/IdentityLimit'
      - name: view
        in: query
        schema: {type: string, enum: [mine, review], default: mine}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityRequestPage'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
    post:
      operationId: identityRequestAccess
      parameters:
      - $ref: '#/components/parameters/IdentityIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityRequestInput'
      responses:
        '201':
          description: Success
          headers:
            ETag:
              description: Quoted request version
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityAccessRequest'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/workspaces/{workspace_id}/access-requests/{id}/decision:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityRequestID'
    post:
      operationId: identityDecideAccess
      parameters:
      - $ref: '#/components/parameters/IdentityVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityDecisionInput'
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted request version
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityAccessRequest'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
components:
  parameters:
    IdentityWorkspaceID:
      name: workspace_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    IdentityProjectID:
      name: project_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    IdentityMemberID:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    IdentityRequestID:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/IdentityID'}
    IdentityOperationID:
      name: id
      in: path
      required: true
      schema:
        type: string
    IdentityIdempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IdentityVersion:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    IdentityCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    IdentityLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  schemas:
    IdentityID:
      type: string
      pattern: ^[1-9][0-9]*$
    IdentityName:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    IdentityProject:
      type: object
      required:
      - id
      - workspace_id
      - name
      - is_default
      - version
      properties:
        id:
          $ref: '#/components/schemas/IdentityID'
        workspace_id:
          $ref: '#/components/schemas/IdentityID'
        is_default: {type: boolean}
        name:
          type: string
        version:
          $ref: '#/components/schemas/IdentityID'
    IdentityWorkspace:
      type: object
      required:
      - workspace_id
      - name
      - is_default
      - projects
      - projects_next_cursor
      properties:
        workspace_id:
          $ref: '#/components/schemas/IdentityID'
        is_default: {type: boolean}
        name:
          type: string
        projects:
          type: array
          items:
            type: object
            required:
            - id
            - name
            - is_default
            properties:
              id:
                $ref: '#/components/schemas/IdentityID'
              is_default: {type: boolean}
              name:
                type: string
        projects_next_cursor:
          type:
          - string
          - 'null'
    IdentityWorkspaceAccess:
      type: object
      required:
      - actor_id
      - workspace_id
      - project_id
      - effective_admin
      - actions
      - scope_version
      - expires_at
      properties:
        actor_id:
          $ref: '#/components/schemas/IdentityID'
        workspace_id:
          $ref: '#/components/schemas/IdentityID'
        project_id: {type: 'null'}
        membership_role: {type: string, enum: [admin, member]}
        role_source: {type: string, enum: [inherited, delegated]}
        effective_admin: {type: boolean}
        grantable_actions: {type: array, items: {type: string}}
        actions:
          type: array
          items:
            type: string
        scope_version:
          $ref: '#/components/schemas/IdentityID'
        expires_at:
          type: string
          format: date-time
    IdentityAccess:
      type: object
      required:
      - actor_id
      - workspace_id
      - project_id
      - issuable_key_actions
      - actions
      - scope_version
      - expires_at
      properties:
        actor_id:
          $ref: '#/components/schemas/IdentityID'
        workspace_id:
          $ref: '#/components/schemas/IdentityID'
        project_id:
          $ref: '#/components/schemas/IdentityID'
        issuable_key_actions: {type: array, items: {type: string}}
        actions:
          type: array
          items:
            type: string
        scope_version:
          $ref: '#/components/schemas/IdentityID'
        expires_at:
          type: string
          format: date-time
    IdentityKey:
      type: object
      required:
      - id
      - name
      - prefix
      - owner_id
      - version
      - credential
      properties:
        id:
          $ref: '#/components/schemas/IdentityID'
        name:
          type: string
        prefix:
          type: string
        owner_id:
          $ref: '#/components/schemas/IdentityID'
        version:
          $ref: '#/components/schemas/IdentityID'
        credential:
          type:
          - string
          - 'null'
    IdentityKeyInput:
      type: object
      required:
      - name
      - model_access
      - actions
      - expires_at
      properties:
        group_id:
          $ref: '#/components/schemas/IdentityID'
        name:
          type: string
          minLength: 1
          maxLength: 100
        model_access:
          type: object
          required:
          - mode
          - ids
          properties:
            mode:
              type: string
              enum:
              - allow_list
              - inherit
              - deny_all
            ids:
              type: array
              items:
                type: string
        actions:
          type: array
          items:
            type: string
            enum:
            - models.read
            - text.chat
            - text.embeddings
            - image.generate
            - usage.read
            - tasks.read
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
    IdentityProjectGrant:
      type: object
      additionalProperties: false
      required: [project_id, actions]
      properties:
        project_id: {$ref: '#/components/schemas/IdentityID'}
        actions: {type: array, items: {type: string}}
    IdentityGrantInput:
      oneOf:
      - type: object
        additionalProperties: false
        required: [project_grants]
        properties:
          project_grants: {type: array, items: {$ref: '#/components/schemas/IdentityProjectGrant'}}
      - type: object
        additionalProperties: false
        required: [project_ids, actions]
        properties:
          project_ids: {type: array, items: {$ref: '#/components/schemas/IdentityID'}}
          actions: {type: array, items: {type: string}}
    IdentityGrantVersion:
      type: object
      required:
      - member_id
      - version
      - effective_at
      properties:
        member_id:
          $ref: '#/components/schemas/IdentityID'
        version:
          $ref: '#/components/schemas/IdentityID'
        effective_at:
          type: string
          format: date-time
    IdentityMemberGrants:
      allOf:
      - $ref: '#/components/schemas/IdentityGrantVersion'
      - type: object
        required: [project_ids, actions, project_grants]
        properties:
          project_ids: {type: array, items: {$ref: '#/components/schemas/IdentityID'}}
          actions: {type: array, items: {type: string}}
          project_grants: {type: array, items: {$ref: '#/components/schemas/IdentityProjectGrant'}}
    IdentityMember:
      type: object
      required: [id, user_id, email, username, role, role_source, status, version]
      properties:
        id:
          $ref: '#/components/schemas/IdentityID'
        user_id:
          $ref: '#/components/schemas/IdentityID'
        email:
          type: string
        username:
          type: string
        role_source: {type: string, enum: [inherited, delegated]}
        role:
          type: string
          enum: [admin, member]
        status:
          type: string
        version:
          $ref: '#/components/schemas/IdentityID'
    IdentityOperation:
      type: object
      required:
      - operation_id
      - state
      - status_url
      - resource_id
      - result
      - error
      properties:
        operation_id:
          type: string
        state:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - unknown
        status_url:
          type: string
        resource_id:
          type:
          - string
          - 'null'
        result:
          type:
          - object
          - 'null'
        error:
          type:
          - object
          - 'null'
    IdentityError:
      type: object
      required:
      - code
      - message
      - reason
      - metadata
      - data
      properties:
        code:
          type: integer
        message:
          type: string
        reason:
          type: string
        metadata:
          type: object
        data:
          type: 'null'
    IdentityProjectPage:
      type: object
      required:
      - items
      - next_cursor
      - as_of
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IdentityProject'
        next_cursor:
          type:
          - string
          - 'null'
        as_of:
          type: string
          format: date-time
    IdentityMemberPage:
      type: object
      required:
      - items
      - next_cursor
      - as_of
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IdentityMember'
        next_cursor:
          type:
          - string
          - 'null'
        as_of:
          type: string
          format: date-time
    IdentityKeyGroupPage:
      type: object
      required:
      - items
      - next_cursor
      - as_of
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IdentityKeyGroup'
        next_cursor:
          type:
          - string
          - 'null'
        as_of:
          type: string
