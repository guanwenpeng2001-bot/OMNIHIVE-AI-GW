paths:
  /api/v2/public/models:
    get:
      operationId: listPublicModels
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
      - name: provider
        in: query
        schema:
          type: array
          items:
            type: string
      - name: protocol
        in: query
        schema:
          type: array
          items:
            type: string
      - name: action
        in: query
        schema:
          type: array
          items:
            type: string
      - name: modality
        in: query
        schema:
          type: array
          items:
            type: string
      - name: region
        in: query
        schema:
          type: array
          items:
            type: string
      - name: retention
        in: query
        schema:
          type: array
          items:
            type: string
      - name: stability
        in: query
        schema:
          type: array
          items:
            type: string
      - $ref: '#/components/parameters/CatalogAvailability'
      - $ref: '#/components/parameters/CatalogBilling'
      - name: availability_state
        in: query
        deprecated: true
        schema:
          type: string
          enum:
          - live
          - catalog_only
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - name
          - price_input
          - context
          - ttft
          - availability
      - $ref: '#/components/parameters/IdentityLimit'
      - $ref: '#/components/parameters/IdentityCursor'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/CatalogModelPage'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/public/models/{id}:
    parameters:
    - $ref: '#/components/parameters/CatalogModelID'
    get:
      operationId: getPublicModel
      parameters:
      - name: catalog_version
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/ModelDetail'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/public/models/compare:
    post:
      operationId: comparePublicModels
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/CatalogCompareResult'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogCompareInput'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/models:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityProjectID'
    get:
      operationId: listProjectModels
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
      - name: provider
        in: query
        schema:
          type: array
          items:
            type: string
      - name: protocol
        in: query
        schema:
          type: array
          items:
            type: string
      - name: action
        in: query
        schema:
          type: array
          items:
            type: string
      - name: modality
        in: query
        schema:
          type: array
          items:
            type: string
      - name: region
        in: query
        schema:
          type: array
          items:
            type: string
      - name: retention
        in: query
        schema:
          type: array
          items:
            type: string
      - name: stability
        in: query
        schema:
          type: array
          items:
            type: string
      - $ref: '#/components/parameters/CatalogAvailability'
      - $ref: '#/components/parameters/CatalogBilling'
      - $ref: '#/components/parameters/CatalogKeyID'
      - name: availability_state
        in: query
        deprecated: true
        schema:
          type: string
          enum:
          - live
          - catalog_only
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - name
          - price_input
          - context
          - ttft
          - availability
      - $ref: '#/components/parameters/IdentityLimit'
      - $ref: '#/components/parameters/IdentityCursor'
      - name: accessible
        in: query
        schema:
          type: boolean
      - name: routable
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/CatalogModelPage'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/models/{id}:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityProjectID'
    - $ref: '#/components/parameters/CatalogModelID'
    get:
      operationId: getProjectModel
      parameters:
      - $ref: '#/components/parameters/CatalogKeyID'
      - name: catalog_version
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/ModelDetail'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/models/compare:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityProjectID'
    post:
      operationId: compareProjectModels
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/CatalogCompareResult'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogCompareInput'
components:
  parameters:
    CatalogAvailability:
      name: availability
      in: query
      schema:
        $ref: '#/components/schemas/CatalogAvailabilityState'
    CatalogBilling:
      name: billing
      in: query
      schema:
        $ref: '#/components/schemas/CatalogBillingState'
    CatalogKeyID:
      name: api_key_id
      in: query
      description: Select a Key the current actor can use in this project.
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
    CatalogModelID:
      name: id
      in: path
      required: true
      description: |
        Stable opaque catalog ID (`m_` followed by 32 lowercase hex characters)
        or a `provider/model` slug resolved against the same catalog snapshot.
        The detail handler also accepts a bare model suffix as an unambiguous
        compatibility fallback; clients should prefer the stable ID or slug and
        must not assume every accepted value matches the opaque ID pattern.
      schema:
        oneOf:
        - type: string
          pattern: ^m_[0-9a-f]{32}$
          description: Stable opaque model ID.
        - type: string
          pattern: ^[^/]+/.+$
          description: Provider/model slug, for example `openai/gpt-4o`.
  schemas:
    CatalogRate:
      type: object
      required:
      - currency
      - amount
      - unit
      - per
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        amount:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
        unit:
          type: string
        per:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
    CatalogMoney:
      type: object
      required:
      - currency
      - amount
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        amount:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
    CatalogEvidence:
      type: object
      required:
      - source
      - maturity
      - observed_at
      - expires_at
      - state
      properties:
        source:
          type: string
        maturity:
          type: string
          enum:
          - unknown
          - stable
          - experimental
          - deprecated
        observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        state:
          type: string
          enum:
          - fresh
          - stale
          - unknown
    CatalogScope:
      type: object
      required:
      - workspace_id
      - project_id
      - scope_version
      properties:
        workspace_id:
          $ref: '#/components/schemas/IdentityID'
        project_id:
          $ref: '#/components/schemas/IdentityID'
        scope_version:
          $ref: '#/components/schemas/IdentityID'
    CatalogModelFacts:
      type: object
      required:
      - source
      - maturity
      - observed_at
      - expires_at
      - state
      - context_tokens
      - max_output_tokens
      - embedding_dimensions
      - context_kind
      - tools
      - vision
      - reasoning
      - prompt_caching
      - pdf
      - modalities
      properties:
        source:
          type: string
        maturity:
          type: string
          enum:
          - unknown
          - stable
          - experimental
          - deprecated
        observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        state:
          type: string
          enum:
          - fresh
          - stale
          - unknown
        context_tokens:
          anyOf:
          - type: string
            pattern: ^(0|[1-9][0-9]*)$
          - type: 'null'
        max_output_tokens:
          anyOf:
          - type: string
            pattern: ^(0|[1-9][0-9]*)$
          - type: 'null'
        embedding_dimensions:
          anyOf:
          - type: string
            pattern: ^(0|[1-9][0-9]*)$
          - type: 'null'
        context_kind:
          type: string
          enum:
          - input
          - total
          - unspecified
          - ''
        tools:
          anyOf:
          - type: boolean
          - type: 'null'
        vision:
          anyOf:
          - type: boolean
          - type: 'null'
        reasoning:
          anyOf:
          - type: boolean
          - type: 'null'
        prompt_caching:
          anyOf:
          - type: boolean
          - type: 'null'
        pdf:
          anyOf:
          - type: boolean
          - type: 'null'
        modalities:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
    CatalogCapability:
      type: object
      required:
      - source
      - maturity
      - observed_at
      - expires_at
      - state
      - action
      - protocol
      - mode
      - tools
      - stream
      - verified_at
      - adapter_version
      - limitations
      properties:
        verified_extension_actions:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/ExtensionActionLabel'}
        source:
          type: string
        maturity:
          type: string
          enum:
          - unknown
          - stable
          - experimental
          - deprecated
        observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        state:
          type: string
          enum:
          - fresh
          - stale
          - unknown
        action:
          type: string
        protocol:
          type: string
        mode:
          type: string
          enum:
          - native
          - bridge
          - unknown
        tools:
          type: string
          enum:
          - supported
          - unsupported
          - unknown
        stream:
          type: string
          enum:
          - supported
          - unsupported
          - unknown
        verified_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        adapter_version:
          anyOf:
          - type: string
          - type: 'null'
        limitations:
          type: array
          items:
            type: string
    CatalogEndpoint:
      type: object
      required:
      - id
      - provider
      - training
      - content_retention
      - regions
      - safety_retention_days
      - region_evidence
      - privacy_evidence
      - capabilities
      properties:
        id:
          type: string
        provider:
          type: string
        training:
          type: string
        content_retention:
          type: string
        regions:
          type: array
          items:
            type: string
        safety_retention_days:
          anyOf:
          - type: string
            pattern: ^(0|[1-9][0-9]*)$
          - type: 'null'
        region_evidence:
          anyOf:
          - $ref: '#/components/schemas/CatalogEvidence'
          - type: 'null'
        privacy_evidence:
          anyOf:
          - $ref: '#/components/schemas/CatalogEvidence'
          - type: 'null'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCapability'
    CatalogSourceKind:
      type: string
      enum: [builtin_reviewed, platform_preset, builtin_supplement, pi_ai_reference, account_discovery, account_declaration, external_reference, heuristic]
    CatalogSourceAxis:
      type: object
      required: [kinds, candidate, discovered]
      properties:
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/CatalogSourceKind'
        candidate:
          type: [boolean, 'null']
        discovered:
          type: [boolean, 'null']
          description: Native discovery membership in the authorized view. Null for public viewers.
    CatalogAvailabilityState:
      type: string
      enum: [live, unavailable, requires_scope, unknown]
    CatalogAvailability:
      type: object
      required: [state, publication, access]
      properties:
        state:
          $ref: '#/components/schemas/CatalogAvailabilityState'
        publication:
          type: string
          enum: [published, unpublished, unknown]
        access:
          type: string
          enum: [allowed, denied, requires_scope, unknown]
        reason:
          type: string
          enum: [candidate_only, published_without_eligible_binding, discovered_without_eligible_binding, scope_required, access_denied, no_eligible_binding, eligibility_incomplete]
    CatalogBillingState:
      type: string
      enum: [priced, free, conditional, partial, conflict, unpriced, error, unknown]
    CatalogBilling:
      type: object
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/CatalogBillingState'
        reason:
          type: string
          description: A stable display or quote reason code.
        sale_price:
          $ref: '#/components/schemas/CatalogSalePrice'
        reference_price:
          $ref: '#/components/schemas/CatalogReferencePrice'
    CatalogSalePrice:
      type: object
      required: [source, scope, price_version, valid_from, valid_until, input_rate, output_rate, additional_rates, time_bands]
      properties:
        source:
          type: string
        scope:
          type: string
          enum: [public, authorized]
        price_version:
          type: [string, 'null']
        valid_from:
          type: [string, 'null']
          format: date-time
        valid_until:
          type: [string, 'null']
          format: date-time
        input_rate:
          anyOf:
          - $ref: '#/components/schemas/CatalogRate'
          - type: 'null'
        output_rate:
          anyOf:
          - $ref: '#/components/schemas/CatalogRate'
          - type: 'null'
        additional_rates:
          type: array
          items:
            $ref: '#/components/schemas/CatalogRateBand'
        time_bands:
          type: array
          items:
            $ref: '#/components/schemas/CatalogTimeBand'
        context_basis:
          type: string
    CatalogFieldProvenance:
      type: object
      required: [field, state]
      properties:
        field:
          type: string
        state:
          type: string
          enum: [known, unknown, stale, conflict, suppressed]
        source_kind:
          $ref: '#/components/schemas/CatalogSourceKind'
        artifact_version:
          type: string
        observed_at:
          type: string
          format: date-time
        record_key:
          type: string
        provider:
          type: string
        profile:
          type: string
        match_rule:
          type: string
        trust:
          type: string
        scope:
          type: string
        expires_at:
          type: string
          format: date-time
        value: {}
    CatalogCommonFacts:
      type: object
      required: [context_tokens, context_kind, max_output_tokens, embedding_dimensions, tools, vision, reasoning, prompt_caching, pdf, modalities]
      properties:
        context_tokens:
          type: [string, 'null']
        context_kind:
          type: string
          enum: [input, total, unspecified, '']
        max_output_tokens:
          type: [string, 'null']
        embedding_dimensions:
          type: [string, 'null']
        tools:
          type: [boolean, 'null']
        vision:
          type: [boolean, 'null']
        reasoning:
          type: [boolean, 'null']
        prompt_caching:
          type: [boolean, 'null']
        pdf:
          type: [boolean, 'null']
        modalities:
          type: [array, 'null']
          items:
            type: string
    ModelSummary:
      type: object
      required:
      - id
      - model
      - display_name
      - provider
      - catalog_version
      - modalities
      - protocols
      - actions
      - regions
      - context_tokens
      - maturity
      - catalog_state
      - access_state
      - route_state
      - price_state
      - input_rate
      - output_rate
      - observed_at
      - evidence_state
      properties:
        id:
          type: string
        canonical_id:
          type: string
        source:
          $ref: '#/components/schemas/CatalogSourceAxis'
        availability:
          $ref: '#/components/schemas/CatalogAvailability'
        billing:
          $ref: '#/components/schemas/CatalogBilling'
        model:
          type: string
        display_name:
          type: string
        provider:
          type: string
        catalog_version:
          type: string
        modalities:
          type: array
          items:
            type: string
        protocols:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            type: string
        regions:
          type: array
          items:
            type: string
        context_tokens:
          anyOf:
          - type: string
            pattern: ^(0|[1-9][0-9]*)$
          - type: 'null'
        maturity:
          deprecated: true
          type: string
          enum:
          - unknown
          - stable
          - experimental
          - deprecated
        catalog_state:
          deprecated: true
          type: string
          enum:
          - listed
        availability_state:
          deprecated: true
          type: string
          enum:
          - live
          - catalog_only
        access_state:
          deprecated: true
          type: string
          enum:
          - allowed
          - denied
          - unknown
          - requires_scope
        route_state:
          deprecated: true
          type: string
          enum:
          - eligible
          - ineligible
          - unknown
          - requires_scope
        price_state:
          deprecated: true
          type: string
          enum:
          - priced
          - free
          - unpriced
          - error
        input_rate:
          anyOf:
          - $ref: '#/components/schemas/CatalogRate'
          - type: 'null'
        output_rate:
          anyOf:
          - $ref: '#/components/schemas/CatalogRate'
          - type: 'null'
        observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        evidence_state:
          deprecated: true
          type: string
          enum:
          - fresh
          - stale
          - unknown
        effective_scope:
          $ref: '#/components/schemas/CatalogScope'
    CatalogRateBand:
      type: object
      required:
      - rate
      - kind
      - min_tokens
      - max_tokens
      properties:
        rate:
          $ref: '#/components/schemas/CatalogRate'
        kind:
          type: string
        min_tokens:
          anyOf:
          - type: string
            pattern: ^(0|[1-9][0-9]*)$
          - type: 'null'
        max_tokens:
          anyOf:
          - type: string
            pattern: ^(0|[1-9][0-9]*)$
          - type: 'null'
        label:
          type: string
    CatalogTimeBand:
      type: object
      required:
      - timezone
      - start_time
      - end_time
      - weekdays_only
      - multiplier
      properties:
        timezone:
          type: string
        start_time:
          type: string
        end_time:
          type: string
        weekdays_only:
          type: boolean
        multiplier:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
    CatalogMetrics:
      type: object
      required:
      - window_start
      - window_end
      - source
      - requests
      - ttft_samples
      - speed_samples
      - success_rate
      - ttft_p50_ms
      - output_tokens_per_second
      - state
      properties:
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        source:
          type: string
        requests:
          anyOf:
          - type: string
            pattern: ^(0|[1-9][0-9]*)$
          - type: 'null'
        ttft_samples:
          anyOf:
          - type: string
            pattern: ^(0|[1-9][0-9]*)$
          - type: 'null'
        speed_samples:
          anyOf:
          - type: string
            pattern: ^(0|[1-9][0-9]*)$
          - type: 'null'
        success_rate:
          anyOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: 'null'
        ttft_p50_ms:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        output_tokens_per_second:
          anyOf:
          - type: number
          - type: 'null'
        state:
          type: string
          enum:
          - insufficient_samples
          - partial
          - available
          - unavailable
          - withheld
    CatalogBenchmark:
      type: object
      required:
      - benchmark_id
      - unit
      - source
      - value
      - verified_at
      properties:
        benchmark_id:
          type: string
        unit:
          type: string
        source:
          type: string
        value:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
        verified_at:
          type: string
          format: date-time
    CatalogReferencePrice:
      type: object
      required:
      - state
      - source
      - input_rate
      - output_rate
      - additional_rates
      - time_bands
      properties:
        state:
          type: string
        source:
          type: string
        input_rate:
          anyOf:
          - $ref: '#/components/schemas/CatalogRate'
          - type: 'null'
        output_rate:
          anyOf:
          - $ref: '#/components/schemas/CatalogRate'
          - type: 'null'
        additional_rates:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/CatalogRateBand'
          - type: 'null'
        context_basis:
          type: string
        time_bands:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/CatalogTimeBand'
          - type: 'null'
    ModelDetail:
      type: object
      required:
      - model
      - aliases
      - model_facts
      - capabilities
      - endpoints
      - price_version
      - price_source
      - additional_rates
      - time_bands
      - metrics
      - benchmarks
      - documentation_url
      - redactions
      properties:
        scope_version:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        provenance:
          type: array
          items:
            $ref: '#/components/schemas/CatalogFieldProvenance'
        common_facts:
          $ref: '#/components/schemas/CatalogCommonFacts'
        model:
          $ref: '#/components/schemas/ModelSummary'
        reference_price:
          anyOf:
          - $ref: '#/components/schemas/CatalogReferencePrice'
          - type: 'null'
        aliases:
          type: array
          items:
            type: string
        model_facts:
          type: array
          items:
            $ref: '#/components/schemas/CatalogModelFacts'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCapability'
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEndpoint'
        price_version:
          anyOf:
          - type: string
          - type: 'null'
        price_source:
          type: string
        additional_rates:
          type: array
          items:
            $ref: '#/components/schemas/CatalogRateBand'
        context_basis:
          type: string
        time_bands:
          type: array
          items:
            $ref: '#/components/schemas/CatalogTimeBand'
        metrics:
          $ref: '#/components/schemas/CatalogMetrics'
        benchmarks:
          type: array
          items:
            $ref: '#/components/schemas/CatalogBenchmark'
        compatibility:
          type: array
          items:
            $ref: '#/components/schemas/CatalogModelCompatibility'
        documentation_url:
          anyOf:
          - type: string
          - type: 'null'
        redactions:
          type: array
          items:
            type: string
    CatalogModelPage:
      type: object
      required:
      - items
      - next_cursor
      - as_of
      - catalog_version
      properties:
        scope_version:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModelSummary'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
        as_of:
          type: string
          format: date-time
        catalog_version:
          type: string
    CatalogPriceScenario:
      $ref: '#/components/schemas/ExactPriceScenario'
    CatalogCompareInput:
      type: object
      required:
      - model_ids
      properties:
        api_key_id:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Accepted only by project compare for a Key the actor can use in that project.
        model_ids:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 3
          uniqueItems: true
        protocol:
          type: string
        action:
          type: string
        scenario:
          $ref: '#/components/schemas/CatalogPriceScenario'
        price_at:
          type: string
          format: date-time
    CatalogEstimateComponent:
      type: object
      required:
      - kind
      - quantity
      - raw_amount
      properties:
        kind:
          type: string
        quantity:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        raw_amount:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
    CatalogEstimate:
      type: object
      required:
      - state
      - price_version
      - estimated_charge
      - components
      - rounding_adjustment
      properties:
        billing_state:
          $ref: '#/components/schemas/CatalogBillingState'
        reason:
          description: Explains an unavailable estimate or describes the catalog billing state when no estimate was requested.
          anyOf:
          - $ref: '#/components/schemas/PriceEstimateReason'
          - type: string
        price_at:
          type: string
          format: date-time
        state:
          type: string
          enum:
          - estimated
          - free
          - unpriced
        price_version:
          anyOf:
          - type: string
          - type: 'null'
        estimated_charge:
          anyOf:
          - $ref: '#/components/schemas/CatalogMoney'
          - type: 'null'
        components:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEstimateComponent'
        rounding_adjustment:
          anyOf:
          - type: string
            pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
          - type: 'null'
    CatalogCompareRow:
      type: object
      required:
      - model_id
      - capabilities
      - metrics
      - benchmarks
      - quote
      properties:
        model_id:
          type: string
        capabilities:
          type: object
          required:
          - tools
          - stream
          properties:
            tools:
              type: string
              enum:
              - supported
              - unsupported
              - unknown
            stream:
              type: string
              enum:
              - supported
              - unsupported
              - unknown
        metrics:
          $ref: '#/components/schemas/CatalogMetrics'
        benchmarks:
          type: array
          items:
            $ref: '#/components/schemas/CatalogBenchmark'
        quote:
          $ref: '#/components/schemas/CatalogEstimate'
    CatalogCompareResult:
      type: object
      required:
      - catalog_version
      - as_of
      - rows
      properties:
        scope_version:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        catalog_version:
          type: string
        as_of:
          type: string
          format: date-time
        rows:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCompareRow'
