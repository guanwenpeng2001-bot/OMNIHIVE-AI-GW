paths:
  /api/v1/admin/accounts:
    post:
      operationId: createAdminAccount
      description: Creates an account or confirms its reviewed OAuth credential draft.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminAccountCreate'}
      responses:
        '200': {description: Saved account}
        '400': {description: Invalid account or model selection}
        '409': {description: Credential draft or account configuration changed}
  /api/v1/admin/accounts/batch:
    post:
      operationId: batchCreateAdminAccounts
      description: Creates accounts or confirms reviewed OAuth credential drafts in a batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accounts]
              properties:
                accounts:
                  type: array
                  minItems: 1
                  items: {$ref: '#/components/schemas/AdminAccountCreate'}
      responses:
        '200': {description: Batch result}
        '400': {description: Invalid batch or model selection}
        '409': {description: Credential draft or account configuration changed}
  /api/v1/admin/accounts/credential-drafts/{draft}/review:
    post:
      operationId: reviewAdminAccountCredentialDraft
      description: Binds the reviewed account request, including model selection, to the credential draft.
      parameters:
        - name: draft
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminAccountCreate'}
      responses:
        '200': {description: Reviewed credential draft}
        '400': {description: Invalid review or model selection}
        '409': {description: Credential draft changed}
  /api/v1/admin/accounts/{id}/apply-oauth-credentials:
    post:
      operationId: applyAdminAccountOAuthCredentials
      description: Confirms a reviewed draft. Submit the same model selection used at review.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, credential_draft, credential_draft_revision]
              properties:
                type: {type: string, enum: [oauth, setup-token]}
                credential_draft: {type: string}
                credential_draft_revision: {type: string}
                credentials: {$ref: '#/components/schemas/AdminAccountUpdateCredentials'}
                extra: {type: object, additionalProperties: true}
                model_selection: {$ref: '#/components/schemas/AdminAccountWorkflowModelSelection'}
      responses:
        '200': {description: Re-authorized account}
        '400': {description: Invalid confirmation or model selection}
        '409': {description: The confirmation differs from the reviewed credential draft or the account changed}
components:
  schemas:
    AdminAccountWorkflowModelSelection:
      type: object
      required: [mode]
      description: Set the upstream scope without creating identity aliases. Omit this object on existing accounts to keep the current scope unless explicitly editing the mapping.
      properties:
        mode: {type: string, enum: [inherit, restricted]}
        models:
          type: array
          items: {type: string}
          description: Restricted requires at least one concrete upstream model ID. The server adds stored mapping targets. Inherit requires an empty or omitted list.
    AdminAccountCreate:
      type: object
      additionalProperties: true
      required: [name, platform, type, credentials]
      properties:
        name: {type: string}
        platform: {type: string}
        type: {type: string, enum: [oauth, setup-token, apikey, upstream, bedrock, service_account]}
        existing_account_id: {type: integer, format: int64, minimum: 1}
        credential_draft: {type: string}
        credential_draft_revision: {type: string}
        credentials: {$ref: '#/components/schemas/AdminAccountUpdateCredentials'}
        model_selection: {$ref: '#/components/schemas/AdminAccountWorkflowModelSelection'}
