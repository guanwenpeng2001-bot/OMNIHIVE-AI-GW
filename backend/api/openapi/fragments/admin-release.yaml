paths:
  /api/v1/admin/accounts/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    put:
      operationId: updateAdminAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAccountUpdate'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {const: 0}
                  message: {type: string}
                  data:
                    type: object
                    required: [id, auto_added, rules_revision]
                    additionalProperties: true
                    properties:
                      id: {type: integer, format: int64}
                      auto_added:
                        type: array
                        items: {type: string}
                        description: Upstream targets added to the account's range by this update
                      rules_revision: {$ref: '#/components/schemas/AdminModelSelectionRevision'}
        '400':
          description: Invalid update, including conflicting model selection intent
        '409':
          description: Account model selection conflict, mapping change on deny_all, or a Connections-managed account
  /api/v1/admin/accounts/bulk-update:
    post:
      operationId: bulkUpdateAdminAccounts
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminAccountBulkUpdate'}
      responses:
        '200':
          description: Bulk update counts and per-account results
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {const: 0}
                  message: {type: string}
                  data: {$ref: '#/components/schemas/AdminAccountBulkUpdateResult'}
        '400':
          description: Invalid bulk update, empty restricted scope, or missing deny-all reason or confirmation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminModelSelectionError'}
        '409':
          description: Account model selection conflict, mapping change on deny_all, or a Connections-managed account
  /api/v1/admin/system/rollback-versions:
    get:
      operationId: listAdminRollbackVersions
      responses:
        '200':
          description: Rollback eligibility, with local backup candidates when GitHub is unavailable
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {const: 0}
                  message: {type: string}
                  data:
                    $ref: '#/components/schemas/AdminRollbackEligibility'
  /api/v1/admin/system/check-updates:
    get:
      operationId: checkAdminSystemUpdates
      parameters:
      - name: force
        in: query
        schema: {type: boolean, default: false}
      responses:
        '200':
          description: Release check, including an unavailable result if GitHub cannot be reached
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {const: 0}
                  message: {type: string}
                  data:
                    $ref: '#/components/schemas/AdminUpdateInfo'
  /api/v1/admin/backups/schedule:
    get:
      operationId: getAdminBackupSchedule
      responses:
        '200':
          $ref: '#/components/responses/AdminBackupScheduleResponse'
    put:
      operationId: updateAdminBackupSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBackupSchedule'
      responses:
        '200':
          $ref: '#/components/responses/AdminBackupScheduleResponse'
components:
  responses:
    AdminBackupScheduleResponse:
      description: Schedule configuration and observed scheduler status
      content:
        application/json:
          schema:
            type: object
            required: [code, message, data]
            properties:
              code: {const: 0}
              message: {type: string}
              data:
                $ref: '#/components/schemas/AdminBackupScheduleStatus'
  schemas:
    AdminAccountUpdate:
      type: object
      properties:
        preserve_model_selection:
          type: boolean
          description: >-
            Preserve the current model selection during metadata edits. Defaults to false. When true, omit
            credentials.model_mapping, credentials.model_whitelist, and extra.upstream_model_allowlist.
            Supplying any of these fields returns CONFLICTING_MODEL_SELECTION_INTENT.
            An explicit credentials.compact_model_mapping can still be edited or cleared.
        name: {type: string}
        notes: {type: [string, 'null']}
        type: {type: string, enum: [oauth, setup-token, apikey, upstream, bedrock, service_account]}
        credentials: {$ref: '#/components/schemas/AdminAccountUpdateCredentials'}
        extra: {type: object, additionalProperties: true}
        proxy_id: {type: [integer, 'null'], format: int64}
        proxy_group_id: {type: [integer, 'null'], format: int64}
        concurrency: {type: integer}
        priority: {type: integer}
        rate_multiplier: {type: number}
        load_factor: {type: integer}
        status: {type: string, enum: [active, inactive, error]}
        group_ids: {type: array, items: {type: integer, format: int64}}
        expires_at: {type: [integer, 'null'], format: int64}
        auto_pause_on_expired: {type: boolean}
        upstream_billing_probe_enabled: {type: boolean}
        upstream_billing_rate_sync_enabled: {type: boolean}
        confirm_mixed_channel_risk: {type: boolean}
        tpm_limit: {type: [integer, 'null'], format: int64}
    AdminAccountUpdateCredentials:
      type: object
      additionalProperties: true
      properties:
        model_mapping:
          anyOf:
          - $ref: '#/components/schemas/AdminModelSelectionMapping'
          - type: 'null'
          description: >-
            Replaces the account's entire explicit alias map and adds its targets to the saved scope.
            Omit or use null to keep the existing selection. An empty object clears the map and keeps
            the existing scope. On a deny_all account, choose a mode through the allowlist endpoint
            before changing the mapping.
    AdminAccountBulkUpdate:
      type: object
      anyOf:
      - required: [account_ids]
      - required: [filters]
      properties:
        account_ids: {type: array, minItems: 1, items: {type: integer, format: int64}}
        filters:
          type: object
          properties:
            platform: {type: string}
            type: {type: string}
            status: {type: string}
            group: {type: string}
            search: {type: string}
            privacy_mode: {type: string}
        name: {type: string}
        proxy_id: {type: [integer, 'null'], format: int64}
        proxy_group_id: {type: [integer, 'null'], format: int64}
        concurrency: {type: integer}
        priority: {type: integer}
        rate_multiplier: {type: number}
        load_factor: {type: integer}
        status: {type: string, enum: [active, inactive, error]}
        schedulable: {type: boolean}
        group_ids: {type: array, items: {type: integer, format: int64}}
        credentials:
          $ref: '#/components/schemas/AdminAccountUpdateCredentials'
          description: Each explicit mapping replaces the map on every target account. Omission or null preserves the map. An empty object explicitly clears it.
        model_selection:
          $ref: '#/components/schemas/AdminAccountBulkModelSelection'
        extra: {type: object, additionalProperties: true}
        upstream_billing_probe_enabled: {type: boolean}
        confirm_mixed_channel_risk: {type: boolean}
        tpm_limit: {type: [integer, 'null'], format: int64}
    AdminAccountBulkModelSelection:
      type: object
      required: [mode]
      description: Applies one scope intent to every target account using that account's locked configuration.
      properties:
        mode: {$ref: '#/components/schemas/AdminModelSelectionMode'}
        models:
          type: array
          items: {type: string}
          description: Restricted requires at least one explicit model. The server adds each account's mapping targets. Inherit and deny_all require an empty or omitted list.
        reason:
          type: string
          description: Required and non-blank for deny_all.
        confirm_deny_all:
          type: boolean
          description: Must be true for deny_all.
    AdminAccountBulkUpdateResult:
      type: object
      required: [success, failed, success_ids, failed_ids, results]
      properties:
        success: {type: integer}
        failed: {type: integer}
        success_ids: {type: array, items: {type: integer, format: int64}}
        failed_ids: {type: array, items: {type: integer, format: int64}}
        long_context_inherited_count: {type: integer}
        results:
          type: array
          items:
            type: object
            required: [account_id, success]
            properties:
              account_id: {type: integer, format: int64}
              success: {type: boolean}
              error: {type: string}
              auto_added:
                type: array
                items: {type: string}
                description: Upstream targets added to this account's scope during a selection or mapping write. An empty array is returned when no targets were added.
              rules_revision: {$ref: '#/components/schemas/AdminModelSelectionRevision'}
    AdminRollbackVersion:
      type: object
      required: [version, effective_floor, published_at, html_url]
      properties:
        version: {type: string}
        effective_floor: {type: string}
        exclusion_reason: {type: string}
        published_at: {type: string}
        html_url: {type: string}
    AdminRollbackEligibility:
      type: object
      required: [database_floor, current_version, remote_status, versions, excluded_versions, local_versions]
      properties:
        database_floor: {type: string}
        current_version: {type: string}
        remote_status: {type: string, enum: [available, unavailable]}
        remote_reason: {type: string}
        versions:
          type: array
          items: {$ref: '#/components/schemas/AdminRollbackVersion'}
        excluded_versions:
          type: array
          items: {$ref: '#/components/schemas/AdminRollbackVersion'}
        local_versions:
          description: Verified local backup versions reported during a remote outage. Omit the version when requesting a local rollback.
          type: array
          items: {$ref: '#/components/schemas/AdminRollbackVersion'}
    AdminUpdateInfo:
      type: object
      required: [current_version, latest_version, has_update, cached, build_type, remote_status]
      properties:
        current_version: {type: string}
        latest_version: {type: string}
        has_update: {type: boolean}
        cached: {type: boolean}
        build_type: {type: string, enum: [source, release]}
        remote_status: {type: string, enum: [available, cached, unavailable]}
        warning: {type: string}
        release_info:
          type: object
          required: [name, body, published_at, html_url]
          properties:
            name: {type: string}
            body: {type: string}
            published_at: {type: string}
            html_url: {type: string}
            assets:
              type: array
              items:
                type: object
                required: [name, download_url, size]
                properties:
                  name: {type: string}
                  download_url: {type: string}
                  size: {type: integer, format: int64}
    AdminBackupSchedule:
      type: object
      properties:
        enabled: {type: boolean}
        cron_expr: {type: string}
        retain_days: {type: integer, default: 14}
        retain_count: {type: integer}
    AdminBackupScheduleStatus:
      allOf:
      - $ref: '#/components/schemas/AdminBackupSchedule'
      - type: object
        required: [enabled, cron_expr, retain_days, retain_count, runtime, backup_secret_key, restore]
        properties:
          runtime:
            type: object
            required: [loaded, health, leader_required, timezone]
            properties:
              loaded: {type: boolean}
              health: {type: string}
              leader_required: {type: boolean}
              timezone: {type: string}
              next_run_at: {type: string, format: date-time}
              last_attempt_at: {type: string, format: date-time}
              last_success_at: {type: string, format: date-time}
              last_verified_at: {type: string, format: date-time}
              last_error: {type: string}
          last_verified_backup:
            $ref: '#/components/schemas/AdminVerifiedBackup'
          backup_secret_key:
            type: object
            required: [source, configured, migration_required]
            properties:
              source: {type: string}
              configured: {type: boolean}
              migration_required: {type: boolean}
              key_id: {type: string}
          restore:
            type: object
            required: [status]
            properties:
              status: {type: string, enum: [disabled, available, unavailable]}
              reason: {type: string}
    AdminVerifiedBackup:
      type: object
      additionalProperties: true
      required: [id, status, file_name, size_bytes]
      properties:
        id: {type: string}
        status: {type: string}
        file_name: {type: string}
        size_bytes: {type: integer, format: int64}
        checksum: {type: string}
        verified_at: {type: string, format: date-time}
        verification_error: {type: string}
