      summary: Consume a workspace and browser-bound authorization draft
components:
  schemas:
    ConnectionField:
      type: object
      required:
      - path
      - type
      - required
      - component
      properties:
        path:
          type: string
        type:
          type: string
        required:
          type: boolean
        component:
          type: string
      additionalProperties: false
    ConnectionSchema:
      type: object
      required:
      - provider
      - schema_version
      - auth_types
      - fields
      - supported_actions
      properties:
        provider:
          type: string
        schema_version:
          type: string
        auth_types:
          type: array
          items:
            type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionField'
        supported_actions:
          type: array
          items:
            type: string
        authorization_workflows:
          type: object
          additionalProperties:
            type: string
      additionalProperties: false
    ConnectionLimits:
      type: object
      required:
      - concurrency
      properties:
        concurrency:
          type: integer
          minimum: 1
          maximum: 10000
      additionalProperties: false
    ConnectionMetadata:
      type: object
      required:
      - version
      - state
      - fingerprint
      - last_four
      properties:
        version:
          type: string
          pattern: ^[0-9]+$
        state:
          type: string
          enum:
          - unset
          - unverified
          - verified
          - revoked
        fingerprint:
          type:
          - string
          - 'null'
        last_four:
          type:
          - string
          - 'null'
      additionalProperties: false
    ConnectionCheck:
      type: object
      required:
      - name
      - state
      - reason
      properties:
        name:
          type: string
          enum:
          - network
          - authorization
          - discover_models
        state:
          type: string
          enum:
          - passed
          - failed
          - unknown
          - unsupported
        reason:
          type:
          - string
          - 'null'
      additionalProperties: false
    ConnectionVerification:
      type: object
      required:
      - verification_id
      - checks
      - models
      - verified_at
      - expires_at
      properties:
        verification_id:
          type: string
          format: uuid
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionCheck'
        models:
          type: array
          items:
            type: string
        verified_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      additionalProperties: false
    ConnectionQuota:
      type: object
      required:
      - state
      - remaining
      - last_success_at
      properties:
        state:
          type: string
          enum:
          - unknown
          - stale
          - fresh
        remaining:
          type:
          - string
          - 'null'
        last_success_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        source:
          type: string
        unit:
          type: string
        window:
          type: string
      additionalProperties: false
    ConnectionHeaderOverrides:
      type: object
      description: Outbound HTTP headers for supported providers and authentication types.
      maxProperties: 64
      additionalProperties:
        type: string
    ConnectionCreate:
      type: object
      required:
      - provider
      - schema_version
      - auth_type
      - name
      properties:
        provider:
          type: string
        schema_version:
          const: '1'
        auth_type:
          type: string
        name:
          type: string
        endpoint:
          type: string
        network_policy_id:
          type: string
        header_overrides:
          $ref: '#/components/schemas/ConnectionHeaderOverrides'
      additionalProperties: false
    ConnectionPatch:
      type: object
      properties:
        name:
          type: string
        endpoint:
          type: string
        network_policy_id:
          type: string
        header_overrides:
          $ref: '#/components/schemas/ConnectionHeaderOverrides'
          description: Replaces the current map. An empty object clears the existing overrides.
        model_ids:
          type: array
          items:
            type: string
        pool_ids:
          type: array
          items:
            type: string
            pattern: ^[1-9][0-9]*$
        limits:
          $ref: '#/components/schemas/ConnectionLimits'
      additionalProperties: false
    ConnectionAssignments:
      type: object
      properties:
        model_ids:
          type: array
          items:
            type: string
        pool_ids:
          type: array
          items:
            type: string
            pattern: ^[1-9][0-9]*$
        limits:
          $ref: '#/components/schemas/ConnectionLimits'
      additionalProperties: false
    ConnectionResource:
      type: object
      required:
      - id
      - workspace_id
      - provider
      - schema_version
      - auth_type
      - name
      - endpoint
      - network_policy_id
      - state
      - version
      - model_ids
      - pool_ids
      - limits
      - last_verification
      - quota
      - allowed_actions
      - redactions
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
        workspace_id:
          type: string
          pattern: ^[1-9][0-9]*$
        provider:
          type: string
        schema_version:
          const: '1'
        auth_type:
          type: string
        name:
          type: string
        endpoint:
          type: string
        network_policy_id:
          type: string
        header_overrides:
          $ref: '#/components/schemas/ConnectionHeaderOverrides'
          description: Present for callers with connection edit permission when overrides are configured.
        state:
          type: string
          enum:
          - draft
          - active
          - disabled
        version:
          type: string
          pattern: ^[1-9][0-9]*$
        credential:
          $ref: '#/components/schemas/ConnectionMetadata'
        model_ids:
          type: array
          items:
            type: string
        pool_ids:
          type: array
          items:
            type: string
            pattern: ^[1-9][0-9]*$
        limits:
          $ref: '#/components/schemas/ConnectionLimits'
        last_verification:
          anyOf:
          - $ref: '#/components/schemas/ConnectionVerification'
          - type: 'null'
        quota:
          $ref: '#/components/schemas/ConnectionQuota'
        allowed_actions:
          type: array
          items:
            type: string
        redactions:
          type: array
          items:
            type: string
      additionalProperties: false
    ConnectionRedacted:
      type: object
      required:
      - version
      - redactions
      properties:
        version:
          type: string
          pattern: ^[1-9][0-9]*$
        redactions:
          type: array
          items:
            type: string
      additionalProperties: false
    ConnectionCredentialInput:
      oneOf:
      - type: object
        required:
        - operation
        properties:
          operation:
            type: string
            enum:
            - keep
            - clear
        additionalProperties: false
      - type: object
        required:
        - operation
        - type
        - secret
        properties:
          operation:
            const: set
          type:
            type: string
          secret:
            type: string
            format: password
            writeOnly: true
          refresh_token:
            type: string
            format: password
            writeOnly: true
        additionalProperties: false
    ConnectionCredentialResult:
      type: object
      required:
      - version
      properties:
        connection_id:
          type: string
          pattern: ^[1-9][0-9]*$
        credential:
          $ref: '#/components/schemas/ConnectionMetadata'
        version:
          type: string
          pattern: ^[1-9][0-9]*$
      additionalProperties: false
    ConnectionVerify:
      type: object
      required:
      - checks
      - credential_version
      properties:
        checks:
          type: array
          items:
            type: string
            enum:
            - network
            - authorization
            - discover_models
        credential_version:
          type: string
          pattern: ^[1-9][0-9]*$
      additionalProperties: false
    ConnectionItem:
      type: object
      required:
      - id
      - base_version
      - state
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
        base_version:
          type: string
          pattern: ^[1-9][0-9]*$
        state:
          type: string
          enum:
          - applicable
          - applied
          - blocked
          - conflict
        verification_id:
          type: string
          format: uuid
        reason:
          type: string
        version:
          type: string
          pattern: ^[1-9][0-9]*$
      additionalProperties: false
    ConnectionPreview:
      type: object
      required:
      - preview_id
      - adds
      - removes
      - blocked
      - items
      - expires_at
      properties:
        preview_id:
          type: string
          format: uuid
        base_version:
          type: string
          pattern: ^[1-9][0-9]*$
        adds:
          type: array
          items:
            type: string
            pattern: ^[1-9][0-9]*$
        removes:
          type: array
          items:
            type: string
            pattern: ^[1-9][0-9]*$
        blocked:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionItem'
        expires_at:
          type: string
          format: date-time
      additionalProperties: false
    ConnectionActivate:
      type: object
      required:
      - preview_id
      - verification_id
      - expected_credential_version
      properties:
        preview_id:
          type: string
          format: uuid
        verification_id:
          type: string
          format: uuid
        expected_credential_version:
          type: string
          pattern: ^[1-9][0-9]*$
      additionalProperties: false
    ConnectionRotation:
      type: object
      required:
      - expected_credential_version
      - replacement
      properties:
        expected_credential_version:
          type: string
          pattern: ^[1-9][0-9]*$
        replacement:
          type: object
          required:
          - type
          - secret
          properties:
            type:
              type: string
            secret:
              type: string
              writeOnly: true
            refresh_token:
              type: string
              writeOnly: true
          additionalProperties: false
      additionalProperties: false
    ConnectionBulkIn:
      type: object
      required:
      - ids
      - patch
      properties:
        ids:
          type: array
          items:
            type: string
            pattern: ^[1-9][0-9]*$
        patch:
          $ref: '#/components/schemas/ConnectionAssignments'
      additionalProperties: false
    ConnectionBulkApply:
      type: object
      required:
      - preview_id
      - selected_ids
      properties:
        preview_id:
          type: string
          format: uuid
        selected_ids:
          type: array
          items:
            type: string
            pattern: ^[1-9][0-9]*$
      additionalProperties: false
