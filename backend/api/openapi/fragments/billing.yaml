paths:
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/billing/activity:
    parameters:
    - {$ref: '#/components/parameters/IdentityWorkspaceID'}
    - {$ref: '#/components/parameters/IdentityProjectID'}
    get:
      operationId: projectCostActivity
      summary: Aggregate project request and usage evidence for one currency
      parameters:
      - {$ref: '#/components/parameters/CostQueryFrom'}
      - {$ref: '#/components/parameters/CostQueryTo'}
      - {$ref: '#/components/parameters/CostQueryTimezone'}
      - {$ref: '#/components/parameters/CostQueryCurrency'}
      - {$ref: '#/components/parameters/CostQueryKeyId'}
      - {$ref: '#/components/parameters/CostQueryMemberId'}
      - {$ref: '#/components/parameters/CostQueryModelId'}
      - {$ref: '#/components/parameters/CostQueryFundingSource'}
      - {$ref: '#/components/parameters/CostQuerySettlementState'}
      - {$ref: '#/components/parameters/CostQueryCursor'}
      - {$ref: '#/components/parameters/CostQueryLimit'}
      - {$ref: '#/components/parameters/CostQueryGroupBy'}
      responses:
        '200':
          description: Aggregate project request and usage evidence for one currency
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code: {const: 0}
                  message: {type: string}
                  data: {$ref: '#/components/schemas/CostActivity'}
        default:
          description: Scoped management error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityError'}
  /api/v2/workspaces/{workspace_id}/billing/activity:
    parameters:
    - {$ref: '#/components/parameters/IdentityWorkspaceID'}
    get:
      operationId: workspaceCostActivity
      summary: Aggregate across projects with workspace billing access
      parameters:
      - {$ref: '#/components/parameters/CostQueryFrom'}
      - {$ref: '#/components/parameters/CostQueryTo'}
      - {$ref: '#/components/parameters/CostQueryTimezone'}
      - {$ref: '#/components/parameters/CostQueryCurrency'}
      - {$ref: '#/components/parameters/CostQueryKeyId'}
      - {$ref: '#/components/parameters/CostQueryMemberId'}
      - {$ref: '#/components/parameters/CostQueryModelId'}
      - {$ref: '#/components/parameters/CostQueryFundingSource'}
      - {$ref: '#/components/parameters/CostQuerySettlementState'}
      - {$ref: '#/components/parameters/CostQueryCursor'}
      - {$ref: '#/components/parameters/CostQueryLimit'}
      - {$ref: '#/components/parameters/CostQueryGroupBy'}
      responses:
        '200':
          description: Aggregate across projects with workspace billing access
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code: {const: 0}
                  message: {type: string}
                  data: {$ref: '#/components/schemas/CostActivity'}
        default:
          description: Scoped management error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityError'}
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/billing/charges:
    parameters:
    - {$ref: '#/components/parameters/IdentityWorkspaceID'}
    - {$ref: '#/components/parameters/IdentityProjectID'}
    get:
      operationId: billingChargeList
      summary: Read scoped receipt amounts and frozen prices
      parameters:
      - {$ref: '#/components/parameters/CostQueryFrom'}
      - {$ref: '#/components/parameters/CostQueryTo'}
      - {$ref: '#/components/parameters/CostQueryTimezone'}
      - {$ref: '#/components/parameters/CostQueryCurrency'}
      - {$ref: '#/components/parameters/CostQueryKeyId'}
      - {$ref: '#/components/parameters/CostQueryMemberId'}
      - {$ref: '#/components/parameters/CostQueryModelId'}
      - {$ref: '#/components/parameters/CostQueryFundingSource'}
      - {$ref: '#/components/parameters/CostQuerySettlementState'}
      - {$ref: '#/components/parameters/CostQueryCursor'}
      - {$ref: '#/components/parameters/CostQueryLimit'}
      responses:
        '200':
          description: Read scoped receipt amounts and frozen prices
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code: {const: 0}
                  message: {type: string}
                  data: {$ref: '#/components/schemas/CostChargePage'}
        default:
          description: Scoped management error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityError'}
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/billing/ledger:
    parameters:
    - {$ref: '#/components/parameters/IdentityWorkspaceID'}
    - {$ref: '#/components/parameters/IdentityProjectID'}
    get:
      operationId: billingLedger
      summary: Read scoped wallet entries and adjustment references
      parameters:
      - {$ref: '#/components/parameters/CostQueryFrom'}
      - {$ref: '#/components/parameters/CostQueryTo'}
      - {$ref: '#/components/parameters/CostQueryTimezone'}
      - {$ref: '#/components/parameters/CostQueryCurrency'}
      - {$ref: '#/components/parameters/CostQueryKeyId'}
      - {$ref: '#/components/parameters/CostQueryMemberId'}
      - {$ref: '#/components/parameters/CostQueryModelId'}
      - {$ref: '#/components/parameters/CostQueryFundingSource'}
      - {$ref: '#/components/parameters/CostQuerySettlementState'}
      - {$ref: '#/components/parameters/CostQueryCursor'}
      - {$ref: '#/components/parameters/CostQueryLimit'}
      - {$ref: '#/components/parameters/CostQueryRequestId'}
      - {$ref: '#/components/parameters/CostQuerySettlementId'}
      - {$ref: '#/components/parameters/CostQueryFundingAccountId'}
      responses:
        '200':
          description: Read scoped wallet entries and adjustment references
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code: {const: 0}
                  message: {type: string}
                  data: {$ref: '#/components/schemas/CostLedgerPage'}
        default:
          description: Scoped management error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityError'}
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/billing/quotas:
    parameters:
    - {$ref: '#/components/parameters/IdentityWorkspaceID'}
    - {$ref: '#/components/parameters/IdentityProjectID'}
    get:
      operationId: billingEffectiveQuota
      summary: Explain effective funding and budget rules
      parameters:
      - {$ref: '#/components/parameters/CostQueryApiKeyId'}
      - {$ref: '#/components/parameters/CostQueryMemberId'}
      - {$ref: '#/components/parameters/CostQueryModelId'}
      - {$ref: '#/components/parameters/CostQueryAt'}
      responses:
        '200':
          description: Explain effective funding and budget rules
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code: {const: 0}
                  message: {type: string}
                  data: {$ref: '#/components/schemas/CostQuota'}
        default:
          description: Scoped management error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityError'}
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/billing/budgets/{id}:
    parameters:
    - {$ref: '#/components/parameters/IdentityWorkspaceID'}
    - {$ref: '#/components/parameters/IdentityProjectID'}
    - name: id
      in: path
      required: true
      schema: {type: string}
    - {$ref: '#/components/parameters/IdentityIdempotency'}
    - name: If-Match
      in: header
      required: true
      schema: {type: string}
    put:
      operationId: updateProjectBudget
      summary: Update the project currency budget with a version precondition
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CostBudgetInput'}
      responses:
        '200':
          description: Update the project currency budget with a version precondition
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code: {const: 0}
                  message: {type: string}
                  data: {$ref: '#/components/schemas/CostRule'}
        default:
          description: Scoped management error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityError'}
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/billing/exports:
    parameters:
    - {$ref: '#/components/parameters/IdentityWorkspaceID'}
    - {$ref: '#/components/parameters/IdentityProjectID'}
    - {$ref: '#/components/parameters/IdentityIdempotency'}
    post:
      operationId: exportBillingCharges
      summary: Register a scoped read-only CSV snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CostExportInput'}
      responses:
        '202':
          description: Register a scoped read-only CSV snapshot
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code: {const: 0}
                  message: {type: string}
                  data: {$ref: '#/components/schemas/IdentityOperation'}
        default:
          description: Scoped management error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityError'}
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/billing/exports/{id}/download:
    parameters:
    - {$ref: '#/components/parameters/IdentityWorkspaceID'}
    - {$ref: '#/components/parameters/IdentityProjectID'}
    - name: id
      in: path
      required: true
      schema: {type: string}
    get:
      operationId: downloadBillingCharges
      summary: Download an authorized unexpired CSV snapshot
      responses:
        '200':
          description: Download an authorized unexpired CSV snapshot
          content:
            text/csv:
              schema: {type: string}
        default:
          description: Scoped management error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityError'}
  /api/v2/workspaces/{workspace_id}/billing/reconciliation:
    parameters:
    - {$ref: '#/components/parameters/IdentityWorkspaceID'}
    get:
      operationId: listBillingDiscrepancies
      summary: Read workspace or delegated project discrepancies
      parameters:
      - {$ref: '#/components/parameters/CostQueryProjectId'}
      - {$ref: '#/components/parameters/CostQueryState'}
      - {$ref: '#/components/parameters/CostQueryFromOptional'}
      - {$ref: '#/components/parameters/CostQueryToOptional'}
      - {$ref: '#/components/parameters/CostQueryCurrencyOptional'}
      - {$ref: '#/components/parameters/CostQueryCursor'}
      - {$ref: '#/components/parameters/CostQueryLimit'}
      responses:
        '200':
          description: Read workspace or delegated project discrepancies
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code: {const: 0}
                  message: {type: string}
                  data: {$ref: '#/components/schemas/CostCasePage'}
        default:
          description: Scoped management error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityError'}
  /api/v2/workspaces/{workspace_id}/billing/reconciliation/{id}/resolve:
    parameters:
    - {$ref: '#/components/parameters/IdentityWorkspaceID'}
    - name: id
      in: path
      required: true
      schema: {type: string}
    - {$ref: '#/components/parameters/IdentityIdempotency'}
    - name: If-Match
      in: header
      required: true
      schema: {type: string}
    post:
      operationId: resolveBillingDiscrepancy
      summary: Record a reviewed evidence reference
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CostResolutionInput'}
      responses:
        '202':
          description: Record a reviewed evidence reference
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code: {const: 0}
                  message: {type: string}
                  data: {$ref: '#/components/schemas/IdentityOperation'}
        default:
          description: Scoped management error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityError'}
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/billing/adjustments:
    parameters:
    - {$ref: '#/components/parameters/IdentityWorkspaceID'}
    - {$ref: '#/components/parameters/IdentityProjectID'}
    - {$ref: '#/components/parameters/IdentityIdempotency'}
    post:
      operationId: postBillingAdjustment
      summary: Append a wallet correction with a verified session
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CostAdjustmentInput'}
      responses:
        '201':
          description: Append a wallet correction with a verified session
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code: {const: 0}
                  message: {type: string}
                  data: {$ref: '#/components/schemas/CostAdjustment'}
        default:
          description: Scoped management error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityError'}
components:
  parameters:
    CostQueryFrom:
      name: from
      in: query
      required: true
      schema: {type: string, format: date-time}
    CostQueryTo:
      name: to
      in: query
      required: true
      schema: {type: string, format: date-time}
    CostQueryTimezone:
      name: timezone
      in: query
      required: true
      schema: {type: string}
    CostQueryCurrency:
      name: currency
      in: query
      required: true
      schema: {type: string}
    CostQueryKeyId:
      name: key_id
      in: query
      required: false
      schema: {type: string}
    CostQueryMemberId:
      name: member_id
      in: query
      required: false
      schema: {type: string}
    CostQueryModelId:
      name: model_id
      in: query
      required: false
      schema: {type: string}
    CostQueryFundingSource:
      name: funding_source
      in: query
      required: false
      schema: {type: string}
    CostQuerySettlementState:
      name: settlement_state
      in: query
      required: false
      schema: {type: string}
    CostQueryCursor:
      name: cursor
      in: query
      required: false
      schema: {type: string}
    CostQueryLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    CostQueryGroupBy:
      name: group_by
      in: query
      required: false
      schema:
        type: string
        enum:
        - day
        - model
        - key
        - member
        - workspace
        - project
    CostQueryRequestId:
      name: request_id
      in: query
      required: false
      schema: {type: string}
    CostQuerySettlementId:
      name: settlement_id
      in: query
      required: false
      schema: {type: string}
    CostQueryFundingAccountId:
      name: funding_account_id
      in: query
      required: false
      schema: {type: string}
    CostQueryApiKeyId:
      name: api_key_id
      in: query
      required: false
      schema: {type: string}
    CostQueryAt:
      name: at
      in: query
      required: false
      schema: {type: string, format: date-time}
    CostQueryProjectId:
      name: project_id
      in: query
      required: false
      schema: {type: string}
    CostQueryState:
      name: state
      in: query
      required: false
      schema: {type: string}
    CostQueryFromOptional:
      name: from
      in: query
      required: false
      schema: {type: string, format: date-time}
    CostQueryToOptional:
      name: to
      in: query
      required: false
      schema: {type: string, format: date-time}
    CostQueryCurrencyOptional:
      name: currency
      in: query
      required: false
      schema: {type: string}
  schemas:
    CostMoney:
      type: object
      required:
      - currency
      - amount
      properties:
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        amount: {type: string}
    CostCharge:
      type: object
      required:
      - request_id
      - settlement_id
      - at
      - model_id
      - billing_source
      - state
      - platform_charge
      - estimate
      - currency
      - price_version
      - detail_url
      properties:
        request_id: {type: string}
        settlement_id:
          type:
          - string
          - 'null'
        at: {type: string, format: date-time}
        model_id:
          type:
          - string
          - 'null'
        billing_source: {type: string}
        state: {type: string}
        platform_charge:
          anyOf:
          - {$ref: '#/components/schemas/CostMoney'}
          - {type: 'null'}
        estimate:
          anyOf:
          - {$ref: '#/components/schemas/CostMoney'}
          - {type: 'null'}
        currency: {type: string}
        price_version:
          type:
          - string
          - 'null'
        detail_url: {type: string}
    CostChargePage:
      type: object
      required:
      - items
      - next_cursor
      - as_of
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CostCharge'}
        next_cursor:
          type:
          - string
          - 'null'
        as_of: {type: string, format: date-time}
    CostGroup:
      type: object
      required:
      - group
      - filter
      - logical_requests
      - attempts
      - input_tokens
      - output_tokens
      - platform_charge
      properties:
        group:
          type:
          - string
          - 'null'
        filter:
          type: object
          additionalProperties:
            type:
            - string
            - 'null'
        logical_requests: {type: string}
        attempts:
          type:
          - string
          - 'null'
        input_tokens:
          type:
          - string
          - 'null'
        output_tokens:
          type:
          - string
          - 'null'
        platform_charge:
          anyOf:
          - {$ref: '#/components/schemas/CostMoney'}
          - {type: 'null'}
    CostTotals:
      type: object
      required:
      - observed_usage_requests
      - catalog_reference
      - subscription_consumption
      - byok_external_estimate
      - platform_service_fee
      - reserved
      - pending_requests
      - needs_review_requests
      - logical_requests
      - attempts
      - input_tokens
      - output_tokens
      - platform_charge
      properties:
        observed_usage_requests: {type: string}
        catalog_reference:
          anyOf:
          - {$ref: '#/components/schemas/CostMoney'}
          - {type: 'null'}
        subscription_consumption:
          anyOf:
          - {$ref: '#/components/schemas/CostMoney'}
          - {type: 'null'}
        byok_external_estimate:
          anyOf:
          - {$ref: '#/components/schemas/CostMoney'}
          - {type: 'null'}
        platform_service_fee:
          anyOf:
          - {$ref: '#/components/schemas/CostMoney'}
          - {type: 'null'}
        reserved:
          anyOf:
          - {$ref: '#/components/schemas/CostMoney'}
          - {type: 'null'}
        pending_requests: {type: string}
        needs_review_requests: {type: string}
        logical_requests: {type: string}
        attempts:
          type:
          - string
          - 'null'
        input_tokens:
          type:
          - string
          - 'null'
        output_tokens:
          type:
          - string
          - 'null'
        platform_charge:
          anyOf:
          - {$ref: '#/components/schemas/CostMoney'}
          - {type: 'null'}
    CostActivity:
      type: object
      required:
      - timezone
      - currency
      - from
      - to
      - as_of
      - next_cursor
      - items
      - totals
      - data_completeness
      properties:
        timezone: {type: string}
        currency: {type: string}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        as_of: {type: string, format: date-time}
        next_cursor:
          type:
          - string
          - 'null'
        items:
          type: array
          items: {$ref: '#/components/schemas/CostGroup'}
        totals: {$ref: '#/components/schemas/CostTotals'}
        data_completeness:
          type: object
          required:
          - state
          - missing
          properties:
            state: {type: string}
            missing:
              type: array
              items:
                type: object
                required:
                - section
                - reason
                properties:
                  section: {type: string}
                  reason: {type: string}
    CostRule:
      type: object
      required:
      - id
      - version
      - scope
      - owner_id
      - shared_allowance_id
      - source
      - mode
      - unit
      - limit
      - used
      - reserved
      - available
      - overrun
      - window
      - timezone
      - resets_at
      - freshness
      - observed_at
      - allow_extra_spend
      - include_byok_external_estimates
      - adjust_action
      - can_adjust
      properties:
        id: {type: string}
        version: {type: string}
        scope:
          type: object
          required:
          - type
          - id
          properties:
            type: {type: string}
            id: {type: string}
        owner_id: {type: string}
        shared_allowance_id: {type: string}
        source: {type: string}
        mode: {type: string}
        unit: {type: string}
        limit:
          type:
          - string
          - 'null'
        used:
          type:
          - string
          - 'null'
        reserved:
          type:
          - string
          - 'null'
        available:
          type:
          - string
          - 'null'
        overrun:
          type:
          - string
          - 'null'
        window: {type: string}
        timezone: {type: string}
        resets_at:
          type:
          - string
          - 'null'
          format: date-time
        freshness: {type: string}
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
        allow_extra_spend: {type: boolean}
        include_byok_external_estimates: {type: boolean}
        adjust_action:
          type:
          - string
          - 'null'
        can_adjust: {type: boolean}
    CostQuota:
      type: object
      required:
      - as_of
      - funding_account_id
      - rules
      - blocked
      - blocking_rule_ids
      - external_exposure
      properties:
        as_of: {type: string, format: date-time}
        funding_account_id:
          type:
          - string
          - 'null'
        rules:
          type: array
          items: {$ref: '#/components/schemas/CostRule'}
        blocked: {type: boolean}
        blocking_rule_ids:
          type: array
          items: {type: string}
        external_exposure:
          type: object
          required:
          - state
          - risk_limit
          properties:
            state: {type: string}
            risk_limit:
              anyOf:
              - {$ref: '#/components/schemas/CostMoney'}
              - {type: 'null'}
    CostEntry:
      type: object
      required:
      - id
      - effect_id
      - kind
      - request_id
      - settlement_id
      - funding_account_id
      - signed_amount
      - posted_at
      - reverses_id
      properties:
        id: {type: string}
        effect_id: {type: string}
        kind:
          type: string
          enum:
          - charge
          - adjustment
        request_id: {type: string}
        settlement_id: {type: string}
        funding_account_id: {type: string}
        signed_amount: {$ref: '#/components/schemas/CostMoney'}
        posted_at: {type: string, format: date-time}
        reverses_id:
          type:
          - string
          - 'null'
    CostLedgerPage:
      type: object
      required:
      - items
      - next_cursor
      - as_of
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CostEntry'}
        next_cursor:
          type:
          - string
          - 'null'
        as_of: {type: string, format: date-time}
    CostCase:
      type: object
      required:
      - id
      - project_id
      - request_id
      - settlement_id
      - state
      - reason
      - difference
      - currency
      - version
      properties:
        id: {type: string}
        project_id: {type: string}
        request_id: {type: string}
        settlement_id:
          type:
          - string
          - 'null'
        state:
          type: string
          enum:
          - needs_review
          - resolved
        reason: {type: string}
        difference:
          anyOf:
          - {$ref: '#/components/schemas/CostMoney'}
          - {type: 'null'}
        currency: {type: string}
        version: {type: string}
    CostCasePage:
      type: object
      required:
      - items
      - next_cursor
      - as_of
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CostCase'}
        next_cursor:
          type:
          - string
          - 'null'
        as_of: {type: string, format: date-time}
    CostAdjustment:
      type: object
      required:
      - id
      - ledger_entry_id
      - reverses_id
      - state
      properties:
        id: {type: string}
