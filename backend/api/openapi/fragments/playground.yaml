paths:
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/playground/runs:
    parameters:
      - {$ref: '#/components/parameters/IdentityWorkspaceID'}
      - {$ref: '#/components/parameters/IdentityProjectID'}
    post:
      operationId: playgroundSubmit
      summary: Submit a separately funded native model call
      x-required-grant: playground.run
      parameters:
        - {$ref: '#/components/parameters/IdentityIdempotency'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/PlaygroundSubmit'}}
      responses:
        '200': {$ref: '#/components/responses/PlaygroundExecution'}
        default: {$ref: '#/components/responses/RequestsError'}
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/playground/runs/by-idempotency-key:
    parameters:
      - {$ref: '#/components/parameters/IdentityWorkspaceID'}
      - {$ref: '#/components/parameters/IdentityProjectID'}
    get:
      operationId: playgroundRunByIdempotencyKey
      summary: Recover the submitting actor's original run
      x-required-grant: playground.read
      parameters:
        - {$ref: '#/components/parameters/IdentityIdempotency'}
      responses:
        '200': {$ref: '#/components/responses/PlaygroundStatus'}
        default: {$ref: '#/components/responses/RequestsError'}
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/playground/runs/{id}:
    parameters:
      - {$ref: '#/components/parameters/IdentityWorkspaceID'}
      - {$ref: '#/components/parameters/IdentityProjectID'}
      - {$ref: '#/components/parameters/PlaygroundRunID'}
    get:
      operationId: playgroundRunDetail
      x-required-grant: playground.read
      responses:
        '200': {$ref: '#/components/responses/PlaygroundStatus'}
        default: {$ref: '#/components/responses/RequestsError'}
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/playground/runs/{id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/IdentityWorkspaceID'}
      - {$ref: '#/components/parameters/IdentityProjectID'}
      - {$ref: '#/components/parameters/PlaygroundRunID'}
    post:
      operationId: playgroundRunCancel
      x-required-grant: playground.cancel
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, additionalProperties: false}}
      responses:
        '202': {$ref: '#/components/responses/PlaygroundStatus'}
        default: {$ref: '#/components/responses/RequestsError'}
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/requests/{id}/replay:
    parameters:
      - {$ref: '#/components/parameters/IdentityWorkspaceID'}
      - {$ref: '#/components/parameters/IdentityProjectID'}
      - {$ref: '#/components/parameters/RequestsID'}
    post:
      operationId: playgroundReplayRequest
      summary: Authorize and fund a new call using the original model and protocol
      x-required-grant: requests.replay
      parameters:
        - {$ref: '#/components/parameters/IdentityIdempotency'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/PlaygroundReplay'}}
      responses:
        '200': {$ref: '#/components/responses/PlaygroundExecution'}
        default: {$ref: '#/components/responses/RequestsError'}
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/requests/{id}/replay-context:
    parameters:
      - {$ref: '#/components/parameters/IdentityWorkspaceID'}
      - {$ref: '#/components/parameters/IdentityProjectID'}
      - {$ref: '#/components/parameters/RequestsID'}
    get:
      operationId: playgroundReplayContext
      summary: Resolve the source model and protocol before quoting a replay
      x-required-grant: requests.replay
      responses:
        '200':
          description: Source metadata without retained request content
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {const: 0}
                  message: {const: success}
                  data:
                    type: object
                    required: [request_id, model_id, protocol]
                    properties:
                      request_id: {type: string}
                      model_id: {type: string}
                      protocol: {$ref: '#/components/schemas/PlaygroundProtocol'}
        default: {$ref: '#/components/responses/RequestsError'}

components:
  parameters:
    PlaygroundRunID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    PlaygroundStatus:
      description: Current submission and linked settlement status
      content:
        application/json:
          schema:
            type: object
            required: [code, message, data]
            properties:
              code: {const: 0}
              message: {enum: [success, accepted]}
              data: {$ref: '#/components/schemas/PlaygroundSummary'}
    PlaygroundExecution:
      description: New POST stream, synchronous native result, or JSON summary for a matching idempotent submission
      content:
        text/event-stream:
          schema: {type: string, description: 'SSE id matches seq. Event names are started, delta, usage, raw_event, diagnostic, finished and failed.'}
          x-event-data-schema: {$ref: '#/components/schemas/PlaygroundEvent'}
        application/json:
          schema:
            type: object
            required: [code, message, data]
            properties:
              code: {const: 0}
              message: {const: success}
              data:
                oneOf:
                  - {$ref: '#/components/schemas/PlaygroundSummary'}
                  - {$ref: '#/components/schemas/PlaygroundResult'}
  schemas:
    PlaygroundProtocol:
      type: string
      enum: [openai_chat, openai_responses, anthropic_messages, gemini_generate]
    PlaygroundOptions:
      type: object
      additionalProperties: false
      properties:
        stream: {type: boolean, default: true}
        include_raw_events: {type: boolean, default: false, description: Requires playground.raw and streaming mode}
        retain_text_preview: {type: boolean, default: false, description: Consent to a bounded ephemeral text preview under requests.content.read}
    PlaygroundReplay:
      type: object
      additionalProperties: false
      required: [api_key_id, input, funding_acknowledged]
      properties:
        api_key_id: {$ref: '#/components/schemas/IdentityID'}
        payer_user_id: {$ref: '#/components/schemas/IdentityID'}
        input: {type: object, additionalProperties: true}
        options: {$ref: '#/components/schemas/PlaygroundOptions'}
        funding_acknowledged: {const: true}
        expected_price_version:
          type: string
          maxLength: 200
          description: Optional accepted quote version; a different execution price is rejected before admission.
    PlaygroundSubmit:
      type: object
      additionalProperties: false
      required: [api_key_id, model_id, protocol, action, input, funding_acknowledged]
      properties:
        api_key_id: {$ref: '#/components/schemas/IdentityID'}
        payer_user_id: {$ref: '#/components/schemas/IdentityID'}
        model_id: {type: string, maxLength: 255}
        protocol: {$ref: '#/components/schemas/PlaygroundProtocol'}
        action: {const: text.chat}
        input: {type: object, additionalProperties: true, description: 'Native Chat or Messages messages, Responses input, or Gemini contents. Maximum body size 256 KiB.'}
        options: {$ref: '#/components/schemas/PlaygroundOptions'}
        funding_acknowledged: {const: true}
        expected_price_version:
          type: string
          maxLength: 200
          description: Optional accepted quote version; a different execution price is rejected before admission.
    PlaygroundSummary:
      type: object
      required: [run_id, request_id, protocol, state, last_seq, content_retained, status_url, detail_url, payer_user_id, settlement_state]
      properties:
        run_id: {type: string, format: uuid}
        request_id: {type: string, format: uuid}
        protocol: {$ref: '#/components/schemas/PlaygroundProtocol'}
        state: {enum: [running, cancel_requested, succeeded, failed, canceled, unknown]}
        last_seq: {type: integer, minimum: 0}
        content_retained: {type: boolean}
        text_preview: {type: string}
        status_url: {type: string}
        detail_url: {type: string}
        payer_user_id: {$ref: '#/components/schemas/IdentityID'}
        settlement_state: {type: string}
    PlaygroundResult:
      type: object
      required: [run_id, request_id, protocol, outcome, output, settlement_state, status_url, detail_url]
      properties:
        run_id: {type: string, format: uuid}
        request_id: {type: string, format: uuid}
        protocol: {$ref: '#/components/schemas/PlaygroundProtocol'}
        outcome: {enum: [succeeded, failed, canceled, unknown]}
        output: {type: [object, 'null'], additionalProperties: true}
        reason: {type: string}
        retry: {enum: [never, query_status]}
        settlement_state: {type: string}
        status_url: {type: string}
        detail_url: {type: string}
    PlaygroundEvent:
      type: object
      required: [seq, run_id, request_id]
      properties:
        seq: {type: integer, minimum: 1}
        run_id: {type: string, format: uuid}
        request_id: {type: string, format: uuid}
        protocol: {$ref: '#/components/schemas/PlaygroundProtocol'}
        kind: {enum: [text, reasoning, tool_arguments]}
        index: {type: integer}
        text: {type: string}
        tool_call_id: {type: string}
        name: {type: string}
        fragment: {type: string}
        quantities:
          type: array
          items:
            type: object
            required: [unit, quantity]
            properties:
              unit: {enum: [input_token, output_token]}
              quantity: {type: string, pattern: '^[0-9]+$'}
        evidence: {const: provider_reported}
        frame: {description: Allowlisted native payload including the Chat stream terminator}
        code: {type: string}
        field: {type: string}
        severity: {type: string}
        price_version: {type: string}
        payer_user_id: {$ref: '#/components/schemas/IdentityID'}
        outcome: {enum: [succeeded, failed, canceled, unknown]}
        reason: {type: string}
        retry: {enum: [never, query_status]}
        status_url: {type: string}
        detail_url: {type: string}
        settlement_state: {type: string}
