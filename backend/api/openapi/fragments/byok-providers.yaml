paths:
  /api/v2/workspaces/{workspace_id}/byok/{id}:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    get:
      operationId: byokWorkspaceGet
      summary: Read credential status and grants
      description: Requires credentials.byok.manage.
      responses:
        '200':
          $ref: '#/components/responses/ByokChanged'
        default:
          $ref: '#/components/responses/ByokError'
    patch:
      operationId: byokWorkspacePatch
      summary: Update the supplied grant and funding fields
      description: Requires credentials.byok.manage.
      responses:
        '200':
          $ref: '#/components/responses/ByokChanged'
        default:
          $ref: '#/components/responses/ByokError'
      parameters:
      - $ref: '#/components/parameters/IdentityVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ByokGrantPatch'
    delete:
      operationId: byokWorkspaceDelete
      summary: Force-revoke a credential and retain its history
      description: Requires credentials.byok.manage.
      responses:
        '202':
          $ref: '#/components/responses/ByokOperation'
        default:
          $ref: '#/components/responses/ByokError'
      parameters:
      - $ref: '#/components/parameters/IdentityVersion'
      - $ref: '#/components/parameters/IdentityIdempotency'
  /api/v2/workspaces/{workspace_id}/byok/{id}/events:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    get:
      operationId: byokWorkspaceEvents
      summary: Read metadata-only credential events
      description: Requires credentials.byok.manage.
      responses:
        '200':
          $ref: '#/components/responses/ByokLifecyclePage'
        default:
          $ref: '#/components/responses/ByokError'
      parameters:
      - $ref: '#/components/parameters/IdentityCursor'
      - $ref: '#/components/parameters/IdentityLimit'
  /api/v2/workspaces/{workspace_id}/byok/provider-classes:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    get:
      operationId: byokWorkspaceClasses
      summary: Read available provider credential classes
      description: Requires credentials.byok.manage.
      responses:
        '200':
          $ref: '#/components/responses/ByokProviderClasses'
        default:
          $ref: '#/components/responses/ByokError'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/byok/credentials/{id}:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityProjectID'
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    get:
      operationId: byokProjectGet
      summary: Read credential status and grants
      description: Requires credentials.byok.manage.
      responses:
        '200':
          $ref: '#/components/responses/ByokChanged'
        default:
          $ref: '#/components/responses/ByokError'
    patch:
      operationId: byokProjectPatch
      summary: Update the supplied grant and funding fields
      description: Requires credentials.byok.manage.
      responses:
        '200':
          $ref: '#/components/responses/ByokChanged'
        default:
          $ref: '#/components/responses/ByokError'
      parameters:
      - $ref: '#/components/parameters/IdentityVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ByokGrantPatch'
    delete:
      operationId: byokProjectDelete
      summary: Force-revoke a credential and retain its history
      description: Requires credentials.byok.manage.
      responses:
        '202':
          $ref: '#/components/responses/ByokOperation'
        default:
          $ref: '#/components/responses/ByokError'
      parameters:
      - $ref: '#/components/parameters/IdentityVersion'
      - $ref: '#/components/parameters/IdentityIdempotency'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/byok/credentials/{id}/events:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityProjectID'
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    get:
      operationId: byokProjectEvents
      summary: Read metadata-only credential events
      description: Requires credentials.byok.manage.
      responses:
        '200':
          $ref: '#/components/responses/ByokLifecyclePage'
        default:
          $ref: '#/components/responses/ByokError'
      parameters:
      - $ref: '#/components/parameters/IdentityCursor'
      - $ref: '#/components/parameters/IdentityLimit'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/byok/credentials/provider-classes:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityProjectID'
    get:
      operationId: byokProjectClasses
      summary: Read available provider credential classes
      description: Requires credentials.byok.manage.
      responses:
        '200':
          $ref: '#/components/responses/ByokProviderClasses'
        default:
          $ref: '#/components/responses/ByokError'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/byok/credentials/service-accounts/{key_id}:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityProjectID'
    - name: key_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    get:
      operationId: byokProjectServiceAccount
      summary: Read a service account by its dedicated key
      description: Requires credentials.byok.manage.
      responses:
        '200':
          $ref: '#/components/responses/ByokServicePrincipal'
        default:
          $ref: '#/components/responses/ByokError'
    put:
      operationId: byokProjectRegisterServiceAccount
      summary: Designate an owned project key for a service account
      description: Requires credentials.byok.manage.
      responses:
        '200':
          $ref: '#/components/responses/ByokServicePrincipal'
        default:
          $ref: '#/components/responses/ByokError'
    delete:
      operationId: byokProjectRevokeServiceAccount
      summary: Retire a service account designation
      description: Requires credentials.byok.manage.
      responses:
        '200':
          $ref: '#/components/responses/ByokServicePrincipal'
        default:
          $ref: '#/components/responses/ByokError'
  /api/v2/workspaces/{workspace_id}/byok/{id}/estimate:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    get:
      operationId: byokWorkspaceEstimate
      summary: Estimate tenant exposure and platform service fee
      description: Requires credentials.byok.manage.
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/IdentityID'
      - name: member_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/IdentityID'
      - name: key_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/IdentityID'
      - name: model_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: input_token_bound
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9]+$
      - name: output_token_bound
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9]+$
      responses:
        '200':
          $ref: '#/components/responses/ByokEstimate'
        default:
          $ref: '#/components/responses/ByokError'
components:
  schemas:
    ByokAuthType:
      type: string
      enum:
      - api_key
      - oauth
      - setup-token
      - bedrock
      - service_account
    ByokPrincipalIDs:
      type: array
      maxItems: 100
      uniqueItems: true
      items:
        $ref: '#/components/schemas/IdentityID'
    ByokGrantPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        allowed_project_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IdentityID'
        allowed_service_account_ids:
          $ref: '#/components/schemas/ByokPrincipalIDs'
        allowed_member_ids:
          type: array
          minItems: 0
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IdentityID'
        allowed_key_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IdentityID'
        allowed_model_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
          description: Lower values are preferred.
        allow_platform_fallback:
          type: boolean
          default: false
        include_external_in_budget:
          type: boolean
          default: false
    ByokClass:
      type: object
      additionalProperties: false
      required:
      - provider
      - auth_type
      - supported
      - enabled
      properties:
        provider:
          type: string
        auth_type:
          type: string
        supported:
          type: boolean
        enabled:
          type: boolean
    ByokClassList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ByokClass'
    ByokServiceAccount:
      type: object
      additionalProperties: false
      required:
      - id
      - project_id
      - key_id
      - active
      - revoked_at
      properties:
        id:
          $ref: '#/components/schemas/IdentityID'
        project_id:
          $ref: '#/components/schemas/IdentityID'
        key_id:
          $ref: '#/components/schemas/IdentityID'
        active:
          type: boolean
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
  responses:
    ByokLifecyclePage:
      description: Scoped credential lifecycle events
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - code
            - message
            - data
            properties:
              code:
                const: 0
              message:
                const: success
              data:
                $ref: '#/components/schemas/ConnectionEventPage'
    ByokProviderClasses:
      description: Provider and auth class eligibility
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - code
            - message
            - data
            properties:
              code:
                const: 0
              message:
                const: success
              data:
                $ref: '#/components/schemas/ByokClassList'
    ByokServicePrincipal:
      description: Project service account designation
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - code
            - message
            - data
            properties:
              code:
                const: 0
              message:
                const: success
              data:
                $ref: '#/components/schemas/ByokServiceAccount'
