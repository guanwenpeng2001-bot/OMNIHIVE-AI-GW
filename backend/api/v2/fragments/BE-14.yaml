paths:
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/requests:
    parameters:
      - $ref: '#/components/parameters/IdentityWorkspaceID'
      - $ref: '#/components/parameters/IdentityProjectID'
    get:
      operationId: requestList
      summary: List logical requests in the project
      description: Requires requests.read. Results seek from newest admission or legacy observation, then descending request ID.
      parameters:
        - {name: from, in: query, schema: {type: string, format: date-time}, description: Inclusive lower time bound}
        - {name: to, in: query, schema: {type: string, format: date-time}, description: Exclusive upper time bound}
        - {name: timezone, in: query, schema: {type: string}, description: IANA timezone}
        - name: key_id
          in: query
          schema: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/IdentityID'}}
        - name: model_id
          in: query
          description: Model identifier recorded by the gateway at admission
          schema: {type: array, maxItems: 20, items: {type: string}}
        - name: protocol
          in: query
          schema: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/RequestsProtocol'}}
        - name: outcome
          in: query
          schema: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/RequestsOutcome'}}
        - name: settlement_state
          in: query
          schema: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/RequestsSettlementState'}}
        - name: funding_source
          in: query
          description: Requires billing.ledger.read
          schema: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/RequestsFundingSource'}}
        - name: reason
          in: query
          schema: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/RequestsReason'}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 1024}}
        - {name: limit, in: query, schema: {type: integer, default: 25, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Project request page
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {const: 0}
                  message: {const: success}
                  data: {$ref: '#/components/schemas/RequestsPage'}
        default: {$ref: '#/components/responses/RequestsError'}

  /api/v2/workspaces/{workspace_id}/projects/{project_id}/requests/{id}:
    parameters:
      - $ref: '#/components/parameters/IdentityWorkspaceID'
      - $ref: '#/components/parameters/IdentityProjectID'
      - $ref: '#/components/parameters/RequestsID'
    get:
      operationId: requestDetail
      summary: Read a project request and its evidence
      description: Requires requests.read. Connection identity requires connections.read. Amounts and financial references require billing.ledger.read.
      responses:
        '200':
          description: Request detail
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {const: 0}
                  message: {const: success}
                  data: {$ref: '#/components/schemas/RequestsDetail'}
        default: {$ref: '#/components/responses/RequestsError'}

  /api/v2/workspaces/{workspace_id}/projects/{project_id}/requests/{id}/route-explain:
    parameters:
      - $ref: '#/components/parameters/IdentityWorkspaceID'
      - $ref: '#/components/parameters/IdentityProjectID'
      - $ref: '#/components/parameters/RequestsID'
    get:
      operationId: requestRouteExplanation
      summary: Read the latest recorded execution routing decision
      description: Requires requests.read. Candidate IDs are local to the routing decision.
      responses:
        '200':
          description: Routing explanation, including historical evidence gaps
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {const: 0}
                  message: {const: success}
                  data: {$ref: '#/components/schemas/RequestsRouteExplanation'}
        default: {$ref: '#/components/responses/RequestsError'}

  /api/v2/workspaces/{workspace_id}/projects/{project_id}/requests/{id}/exports:
    parameters:
      - $ref: '#/components/parameters/IdentityWorkspaceID'
      - $ref: '#/components/parameters/IdentityProjectID'
      - $ref: '#/components/parameters/RequestsID'
    post:
      operationId: requestExportCreate
      summary: Create a request metadata export operation
      description: Requires requests.read and requests.export. An identical retry returns the same operation and expiration.
      parameters:
        - $ref: '#/components/parameters/IdentityIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RequestsExportInput'}
      responses:
        '202':
          description: Accepted export operation
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {const: 0}
                  message: {const: accepted}
                  data: {$ref: '#/components/schemas/RequestsExportOperation'}
        default: {$ref: '#/components/responses/RequestsError'}

  /api/v2/workspaces/{workspace_id}/projects/{project_id}/requests/{id}/exports/{export_id}/download:
    parameters:
      - $ref: '#/components/parameters/IdentityWorkspaceID'
      - $ref: '#/components/parameters/IdentityProjectID'
      - $ref: '#/components/parameters/RequestsID'
      - {name: export_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: requestExportDownload
      summary: Stream the selected request metadata sections
      description: Requires the creating actor, requests.read and requests.export. Field permissions apply at download.
      responses:
        '200':
          description: Request metadata attachment
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequestsExportDocument'}
        default: {$ref: '#/components/responses/RequestsError'}

components:
  parameters:
    RequestsID:
      name: id
      in: path
      required: true
      schema: {type: string}
  responses:
    RequestsError:
      description: Management error including invalid filters, expired cursor or artifact, denied action, and inaccessible request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/IdentityError'}
  schemas:
    RequestsProtocol:
      type: string
      enum: [openai_chat, openai_responses, anthropic_messages, gemini_generate, gemini_count_tokens, gemini_embedding,
             openai_images, openai_embeddings, openai_audio, openai_video]
    RequestsOutcome:
      type: string
      enum: [admitted, running, succeeded, failed, interrupted, canceled, unknown]
    RequestsReason:
      type: string
      enum: [STREAM_INTERRUPTED, REQUEST_CANCELED, ACCEPTANCE_UNKNOWN, RECEIPT_UNCONFIRMED,
             UPSTREAM_RATE_LIMITED, UPSTREAM_ERROR, REQUEST_REJECTED, GATEWAY_ERROR]
    RequestsSettlementState:
      type: string
      enum: [estimated, reserved, pending, settled, needs_review, adjusted, refunded, unknown]
    RequestsReceiptState:
      type: string
      enum: [unconfirmed, pending, settled, needs_review]
    RequestsFundingSource:
      type: string
      enum: [wallet, subscription, byok, mixed, unknown]
    RequestsNullableMoney:
      oneOf:
        - $ref: '#/components/schemas/CatalogMoney'
        - type: 'null'
    RequestsCompleteness:
      type: object
      required: [state, missing]
      properties:
        state: {type: string, enum: [complete, partial]}
        missing:
          type: array
          items:
            type: object
            required: [section, reason]
            properties:
              section: {type: string}
              reason: {type: string}
    RequestsSummary:
      type: object
      required: [id, started_at, start_source, requested_model, protocol, outcome, reason, settlement_state,
                 charged_amount, attempt_count, detail_url, redactions]
      properties:
        id: {type: string}
        started_at: {type: string, format: date-time}
        start_source: {type: string, enum: [admission, legacy_observation]}
        requested_model: {type: [string, 'null']}
        protocol:
          oneOf:
            - $ref: '#/components/schemas/RequestsProtocol'
            - type: 'null'
        outcome: {$ref: '#/components/schemas/RequestsOutcome'}
        reason:
          oneOf:
            - $ref: '#/components/schemas/RequestsReason'
            - type: 'null'
        settlement_state: {$ref: '#/components/schemas/RequestsSettlementState'}
        charged_amount: {$ref: '#/components/schemas/RequestsNullableMoney'}
        attempt_count: {type: [string, 'null'], pattern: '^[0-9]+$'}
        detail_url: {type: string}
        redactions: {type: array, items: {type: string}}
    RequestsPage:
      type: object
      required: [items, next_cursor, as_of]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RequestsSummary'}}
        next_cursor: {type: [string, 'null']}
        as_of: {type: string, format: date-time}
    RequestsTimeline:
      type: array
      items:
        type: object
        required: [kind, at, source]
        properties:
          kind: {type: string, enum: [admitted, first_output, client_completed, client_ended, execution_finished, settled]}
          at: {type: string, format: date-time}
          source: {type: string, enum: [gateway_admission, gateway_finalization, upstream_ttft_estimate, settlement_receipt]}
    RequestsRoute:
      type: object
      required: [policy_version, snapshot_id, candidate_id, explain_url]
      properties:
        policy_version: {type: [string, 'null']}
        snapshot_id: {type: [string, 'null']}
        candidate_id: {type: [string, 'null']}
        explain_url: {type: string}
    RequestsRouteExplanation:
      type: object
      required: [request_id, trace, data_completeness]
      properties:
        request_id: {type: string}
        trace:
          oneOf:
            - $ref: '#/components/schemas/RoutingDecisionTrace'
            - type: 'null'
        data_completeness: {$ref: '#/components/schemas/RequestsCompleteness'}
    RequestsConversion:
      type: [object, 'null']
      required: [mode, source_protocol, target_protocol, diagnostics]
      properties:
        mode: {type: string, enum: [native, bridge, rejected]}
        source_protocol: {type: string}
        target_protocol: {type: string}
        diagnostics:
          type: array
          items:
            type: object
            required: [field, reason, severity]
            properties:
              field: {type: string}
              reason: {type: string}
              severity: {type: string}
    RequestsAttempt:
      type: object
      required: [id, number, candidate_id, connection_id, connection_name, started_at, duration_ms, upstream_ttft_ms,
                 acceptance, outcome, status, reason, semantic_output, abandoned_uncertain, receipt_state, conversion]
      properties:
        id: {type: string}
        number: {type: integer, minimum: 1}
        candidate_id: {type: [string, 'null']}
        connection_id: {type: [string, 'null']}
        connection_name: {type: [string, 'null']}
        started_at: {type: [string, 'null'], format: date-time}
        duration_ms: {type: [integer, 'null'], minimum: 0}
        upstream_ttft_ms: {type: [integer, 'null'], minimum: 0}
        acceptance: {type: string, enum: [not_sent, accepted, unknown]}
        outcome: {$ref: '#/components/schemas/RequestsOutcome'}
        status: {type: [integer, 'null']}
        reason: {type: [string, 'null']}
        semantic_output: {type: [boolean, 'null']}
        abandoned_uncertain: {type: boolean}
        receipt_state: {$ref: '#/components/schemas/RequestsReceiptState'}
        conversion: {$ref: '#/components/schemas/RequestsConversion'}
    RequestsUsage:
      type: object
      required: [level, source, units]
      properties:
        level: {type: string, enum: [observed, unknown]}
        source: {type: string, enum: [settlement_receipt, legacy_usage, unconfirmed]}
        units:
          type: array
          items:
            type: object
            required: [kind, quantity]
            properties:
              kind: {type: string, enum: [input_token, output_token]}
              quantity: {type: string, pattern: '^[0-9]+$'}
    RequestsBilling:
      type: object
      required: [billing_source, state, currency, price_version, pricing_state, reservation_id, reservation_state,
                 release_pending, reserved, estimate, platform_charge, catalog_reference, entitlement_consumption,
                 byok_external_estimate, platform_service_fee, settlement_id, receipt_state, ledger_entry_ids, rounding_rule]
      properties:
        billing_source:
          oneOf:
            - $ref: '#/components/schemas/RequestsFundingSource'
            - type: 'null'
        state: {$ref: '#/components/schemas/RequestsSettlementState'}
        currency: {type: [string, 'null']}
        price_version: {type: [string, 'null']}
        pricing_state: {type: [string, 'null']}
        reservation_id: {type: [string, 'null']}
        reservation_state: {type: [string, 'null']}
        release_pending: {type: [boolean, 'null']}
        reserved: {$ref: '#/components/schemas/RequestsNullableMoney'}
        estimate: {$ref: '#/components/schemas/RequestsNullableMoney'}
        platform_charge: {$ref: '#/components/schemas/RequestsNullableMoney'}
        catalog_reference: {$ref: '#/components/schemas/RequestsNullableMoney'}
        entitlement_consumption: {$ref: '#/components/schemas/RequestsNullableMoney'}
        byok_external_estimate: {$ref: '#/components/schemas/RequestsNullableMoney'}
        platform_service_fee: {$ref: '#/components/schemas/RequestsNullableMoney'}
        settlement_id: {type: [string, 'null']}
        receipt_state: {$ref: '#/components/schemas/RequestsReceiptState'}
        ledger_entry_ids: {type: array, items: {type: string}}
        rounding_rule: {type: [string, 'null']}
    RequestsDetail:
      allOf:
        - $ref: '#/components/schemas/RequestsSummary'
        - type: object
          required: [workspace_id, project_id, client_correlation_id, api_key_id, actor_id, key_owner_id, funding_account_id,
                     trace_id, origin, action, effective_model, ended_at, timings_ms, timeline, route, attempts,
                     abandoned_attempts, conversion, usage, billing, task_ids, diagnostics, data_completeness, allowed_actions]
          properties:
            workspace_id: {$ref: '#/components/schemas/IdentityID'}
            project_id: {$ref: '#/components/schemas/IdentityID'}
            api_key_id: {$ref: '#/components/schemas/IdentityID'}
            client_correlation_id: {type: [string, 'null']}
            actor_id: {type: [string, 'null']}
            key_owner_id: {type: [string, 'null']}
            funding_account_id: {type: [string, 'null']}
            trace_id: {type: [string, 'null']}
            origin: {type: string}
            action: {type: [string, 'null']}
            effective_model: {type: [string, 'null']}
            ended_at: {type: [string, 'null'], format: date-time}
            timings_ms:
              type: object
              required: [queue, route, upstream_ttft, total]
              properties:
                queue: {type: [integer, 'null'], minimum: 0}
                route: {type: [integer, 'null'], minimum: 0}
                upstream_ttft: {type: [integer, 'null'], minimum: 0}
                total: {type: [integer, 'null'], minimum: 0}
            timeline: {$ref: '#/components/schemas/RequestsTimeline'}
            route: {$ref: '#/components/schemas/RequestsRoute'}
            attempts: {type: array, items: {$ref: '#/components/schemas/RequestsAttempt'}}
            abandoned_attempts: {type: array, items: {$ref: '#/components/schemas/RequestsAttempt'}}
            conversion: {$ref: '#/components/schemas/RequestsConversion'}
            usage: {$ref: '#/components/schemas/RequestsUsage'}
            billing: {$ref: '#/components/schemas/RequestsBilling'}
            task_ids: {type: array, items: {type: string}}
            diagnostics:
              type: array
              items:
                type: object
                required: [reason]
                properties:
                  reason: {type: string}
                  attempt_id: {type: string}
            data_completeness: {$ref: '#/components/schemas/RequestsCompleteness'}
            allowed_actions: {type: array, items: {type: string}}
    RequestsExportInput:
      type: object
      required: [format, sections]
      additionalProperties: false
      properties:
        format: {const: json}
        sections:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 5
          items: {type: string, enum: [timeline, route, attempts, usage, billing]}
    RequestsExportOperation:
      allOf:
        - $ref: '#/components/schemas/IdentityOperation'
        - type: object
          properties:
            result:
              type: object
              required: [download_url, expires_at]
              properties:
                download_url: {type: [string, 'null']}
                expires_at: {type: string, format: date-time}
    RequestsExportDocument:
      type: object
      required: [request]
      properties:
        request:
          type: object
          required: [id, workspace_id, project_id, redactions, data_completeness]
          properties:
            id: {type: string}
            workspace_id: {$ref: '#/components/schemas/IdentityID'}
            project_id: {$ref: '#/components/schemas/IdentityID'}
            redactions: {type: array, items: {type: string}}
            data_completeness: {$ref: '#/components/schemas/RequestsCompleteness'}
        timeline: {$ref: '#/components/schemas/RequestsTimeline'}
        route: {$ref: '#/components/schemas/RequestsRoute'}
        attempts: {type: array, items: {$ref: '#/components/schemas/RequestsAttempt'}}
        abandoned_attempts: {type: array, items: {$ref: '#/components/schemas/RequestsAttempt'}}
        usage: {$ref: '#/components/schemas/RequestsUsage'}
        billing: {$ref: '#/components/schemas/RequestsBilling'}
