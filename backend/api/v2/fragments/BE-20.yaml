paths:
  /api/v2/admin/extensions:
    get:
      operationId: listAdminExtensions
      description: List installed extension packages and their signed capability inventory for the authenticated administrator.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {const: 0}
                  message: {const: success}
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/ExtensionInventoryItem'}
        default:
          description: Management error
components:
  schemas:
    ExtensionInventoryCapability:
      type: object
      required: [id, platform, account_type]
      properties:
        id: {type: string}
        platform: {type: string}
        account_type: {type: string}
    ExtensionInventoryItem:
      type: object
      required: [id, sdk_version, capabilities, state]
      properties:
        id: {type: string}
        sdk_version: {type: integer}
        publisher_id: {type: string}
        capabilities:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/ExtensionInventoryCapability'}
        state: {type: string}
        digest: {type: string}
