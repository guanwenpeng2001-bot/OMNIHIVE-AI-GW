paths:
  /api/v2/workspaces/{workspace_id}/byok:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    get:
      operationId: byokWorkspaceList
      summary: List scoped pilot credentials
      description: Requires credentials.byok.manage.
      parameters:
      - $ref: '#/components/parameters/IdentityCursor'
      - $ref: '#/components/parameters/IdentityLimit'
      responses:
        '200':
          $ref: '#/components/responses/ByokPage'
        default:
          $ref: '#/components/responses/ByokError'
    post:
      operationId: byokWorkspaceCreate
      summary: Enroll an ordinary provider API key
      description: Requires credentials.byok.manage.
      parameters:
      - $ref: '#/components/parameters/IdentityIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ByokCreate'
      responses:
        '201':
          $ref: '#/components/responses/ByokCreated'
        default:
          $ref: '#/components/responses/ByokError'
  /api/v2/workspaces/{workspace_id}/byok/{id}/policy:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    put:
      operationId: byokWorkspacePolicy
      summary: Replace allowed scopes and funding consent
      description: Requires credentials.byok.manage.
      parameters:
      - $ref: '#/components/parameters/IdentityVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ByokPolicy'
      responses:
        '200':
          $ref: '#/components/responses/ByokChanged'
        default:
          $ref: '#/components/responses/ByokError'
  /api/v2/workspaces/{workspace_id}/byok/{id}/verify:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    post:
      operationId: byokWorkspaceVerify
      summary: Verify credential authorization and models
      description: Requires credentials.byok.manage.
      parameters:
      - $ref: '#/components/parameters/IdentityVersion'
      - $ref: '#/components/parameters/IdentityIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ByokVerify'
      responses:
        '202':
          $ref: '#/components/responses/ByokOperation'
        default:
          $ref: '#/components/responses/ByokError'
  /api/v2/workspaces/{workspace_id}/byok/{id}/rotate:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    post:
      operationId: byokWorkspaceRotate
      summary: Verify and switch to a new credential version
      description: Requires credentials.byok.manage.
      parameters:
      - $ref: '#/components/parameters/IdentityVersion'
      - $ref: '#/components/parameters/IdentityIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ByokRotate'
      responses:
        '202':
          $ref: '#/components/responses/ByokOperation'
        default:
          $ref: '#/components/responses/ByokError'
  /api/v2/workspaces/{workspace_id}/byok/{id}/revoke:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    post:
      operationId: byokWorkspaceRevoke
      summary: Revoke the current credential
      description: Requires credentials.byok.manage.
      parameters:
      - $ref: '#/components/parameters/IdentityVersion'
      - $ref: '#/components/parameters/IdentityIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ByokRevoke'
      responses:
        '202':
          $ref: '#/components/responses/ByokOperation'
        default:
          $ref: '#/components/responses/ByokError'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/byok/credentials:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityProjectID'
    get:
      operationId: byokProjectList
      summary: List scoped pilot credentials
      description: Requires credentials.byok.manage.
      parameters:
      - $ref: '#/components/parameters/IdentityCursor'
      - $ref: '#/components/parameters/IdentityLimit'
      responses:
        '200':
          $ref: '#/components/responses/ByokPage'
        default:
          $ref: '#/components/responses/ByokError'
    post:
      operationId: byokProjectCreate
      summary: Enroll an ordinary provider API key
      description: Requires credentials.byok.manage.
      parameters:
      - $ref: '#/components/parameters/IdentityIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ByokCreate'
      responses:
        '201':
          $ref: '#/components/responses/ByokCreated'
        default:
          $ref: '#/components/responses/ByokError'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/byok/credentials/{id}/policy:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityProjectID'
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    put:
      operationId: byokProjectPolicy
      summary: Replace allowed scopes and funding consent
      description: Requires credentials.byok.manage.
      parameters:
      - $ref: '#/components/parameters/IdentityVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ByokPolicy'
      responses:
        '200':
          $ref: '#/components/responses/ByokChanged'
        default:
          $ref: '#/components/responses/ByokError'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/byok/credentials/{id}/verify:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityProjectID'
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    post:
      operationId: byokProjectVerify
      summary: Verify credential authorization and models
      description: Requires credentials.byok.manage.
      parameters:
      - $ref: '#/components/parameters/IdentityVersion'
      - $ref: '#/components/parameters/IdentityIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ByokVerify'
      responses:
        '202':
          $ref: '#/components/responses/ByokOperation'
        default:
          $ref: '#/components/responses/ByokError'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/byok/credentials/{id}/rotate:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityProjectID'
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    post:
      operationId: byokProjectRotate
      summary: Verify and switch to a new credential version
      description: Requires credentials.byok.manage.
      parameters:
      - $ref: '#/components/parameters/IdentityVersion'
      - $ref: '#/components/parameters/IdentityIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ByokRotate'
      responses:
        '202':
          $ref: '#/components/responses/ByokOperation'
        default:
          $ref: '#/components/responses/ByokError'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/byok/credentials/{id}/revoke:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityProjectID'
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    post:
      operationId: byokProjectRevoke
      summary: Revoke the current credential
      description: Requires credentials.byok.manage.
      parameters:
      - $ref: '#/components/parameters/IdentityVersion'
      - $ref: '#/components/parameters/IdentityIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ByokRevoke'
      responses:
        '202':
          $ref: '#/components/responses/ByokOperation'
        default:
          $ref: '#/components/responses/ByokError'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/byok/credentials/{id}/estimate:
    parameters:
    - $ref: '#/components/parameters/IdentityWorkspaceID'
    - $ref: '#/components/parameters/IdentityProjectID'
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    get:
      operationId: byokProjectEstimate
      summary: Estimate tenant exposure and platform service fee
      description: Requires credentials.byok.manage.
      parameters:
      - name: member_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/IdentityID'
      - name: key_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/IdentityID'
      - name: model_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: input_token_bound
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9]+$
      - name: output_token_bound
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9]+$
      responses:
        '200':
          $ref: '#/components/responses/ByokEstimate'
        default:
          $ref: '#/components/responses/ByokError'
components:
  schemas:
    ByokPolicy:
      type: object
      additionalProperties: false
      required:
      - allowed_project_ids
      - allowed_member_ids
      - allowed_key_ids
      - allowed_model_ids
      properties:
        allowed_project_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IdentityID'
        allowed_member_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IdentityID'
        allowed_key_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IdentityID'
        allowed_model_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
          description: Lower values are preferred.
        allow_platform_fallback:
          type: boolean
          default: false
        include_external_in_budget:
          type: boolean
          default: false
    ByokCreate:
      type: object
      additionalProperties: false
      required:
      - provider
      - auth_type
      - secret
      - allowed_project_ids
      - allowed_member_ids
      - allowed_key_ids
      - allowed_model_ids
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 128
        auth_type:
          const: api_key
        secret:
          type: string
          minLength: 1
          maxLength: 262144
          writeOnly: true
        allowed_project_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IdentityID'
        allowed_member_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IdentityID'
        allowed_key_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IdentityID'
        allowed_model_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
          description: Lower values are preferred.
        allow_platform_fallback:
          type: boolean
          default: false
        include_external_in_budget:
          type: boolean
          default: false
    ByokCredential:
      type: object
      additionalProperties: false
      required:
      - id
      - owner_workspace_id
      - provider
      - version
      - credential_version
      - state
      - fingerprint
      - verified_until
      - scope
      - priority
      - allow_platform_fallback
      - include_external_in_budget
      properties:
        id:
          $ref: '#/components/schemas/IdentityID'
        owner_workspace_id:
          $ref: '#/components/schemas/IdentityID'
        provider:
          type: string
          minLength: 1
          maxLength: 128
        version:
          $ref: '#/components/schemas/IdentityID'
        credential_version:
          $ref: '#/components/schemas/IdentityID'
        state:
          type: string
          enum:
          - unverified
          - verified
          - expired
          - revoked
        fingerprint:
          type: string
        verified_until:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        scope:
          type: object
          additionalProperties: false
          required:
          - project_ids
          - member_ids
          - key_ids
          - model_ids
          properties:
            project_ids:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items:
                $ref: '#/components/schemas/IdentityID'
            member_ids:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items:
                $ref: '#/components/schemas/IdentityID'
            key_ids:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items:
                $ref: '#/components/schemas/IdentityID'
            model_ids:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items:
                type: string
                minLength: 1
                maxLength: 128
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
          description: Lower values are preferred.
        allow_platform_fallback:
          type: boolean
          default: false
        include_external_in_budget:
          type: boolean
          default: false
    ByokVerify:
      type: object
      additionalProperties: false
    ByokRotate:
      type: object
      additionalProperties: false
      required:
      - replacement
      properties:
        replacement:
          type: object
          additionalProperties: false
          required:
          - secret
          properties:
            secret:
              type: string
              minLength: 1
              maxLength: 262144
              writeOnly: true
    ByokRevoke:
      type: object
      additionalProperties: false
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - force
          - drain
    ByokPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ByokCredential'
        next_cursor:
          oneOf:
          - type: string
          - type: 'null'
    ByokEstimate:
      type: object
      additionalProperties: false
      required:
      - funding_source
      - external_state
      - byok_external_estimate
      - platform_service_fee
      - platform_estimate
      - price_version
      - include_external_in_budget
      properties:
        funding_source:
          const: byok
        external_state:
          type: string
          enum:
          - unknown
          - estimated
        byok_external_estimate:
          oneOf:
          - $ref: '#/components/schemas/CatalogMoney'
          - type: 'null'
        platform_service_fee:
          $ref: '#/components/schemas/CatalogMoney'
        platform_estimate:
          type: 'null'
        price_version:
          oneOf:
          - type: string
          - type: 'null'
        include_external_in_budget:
          type: boolean
  responses:
    ByokError:
      description: Invalid command, inaccessible scope, stale revision, or unavailable funding evidence.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdentityError'
    ByokCreated:
      description: Created
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - code
            - message
            - data
            properties:
              code:
                const: 0
              message:
                const: success
              data:
                $ref: '#/components/schemas/ByokCredential'
    ByokChanged:
      description: Changed
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - code
            - message
            - data
            properties:
              code:
                const: 0
              message:
                const: success
              data:
                $ref: '#/components/schemas/ByokCredential'
    ByokPage:
      description: Page
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - code
            - message
            - data
            properties:
              code:
                const: 0
              message:
                const: success
              data:
                $ref: '#/components/schemas/ByokPage'
    ByokEstimate:
      description: Estimate
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - code
            - message
            - data
            properties:
              code:
                const: 0
              message:
                const: success
              data:
                $ref: '#/components/schemas/ByokEstimate'
    ByokOperation:
      description: Operation
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - code
            - message
            - data
            properties:
              code:
                const: 0
              message:
                const: accepted
              data:
                $ref: '#/components/schemas/IdentityOperation'
