  /api/v2/workspaces/{workspace_id}/projects/{project_id}/requests:
    get:
      operationId: requestList
      summary: List logical requests in the project
      description: Requires requests.read. Results seek from newest admission or legacy observation, then descending request ID.
      parameters:
        - {name: from, in: query, schema: {type: string, format: date-time}, description: Inclusive lower time bound}
        - {name: to, in: query, schema: {type: string, format: date-time}, description: Exclusive upper time bound}
        - {name: timezone, in: query, schema: {type: string}, description: IANA timezone}
        - name: key_id
          in: query
          schema: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/IdentityID'}}
        - name: model_id
          in: query
          description: Model identifier recorded by the gateway at admission
          schema: {type: array, maxItems: 20, items: {type: string}}
        - name: protocol
          in: query
          schema: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/RequestsProtocol'}}
        - name: outcome
          in: query
          schema: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/RequestsOutcome'}}
        - name: settlement_state
          in: query
          schema: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/RequestsSettlementState'}}
        - name: funding_source
          in: query
          description: Requires billing.ledger.read
          schema: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/RequestsFundingSource'}}
        - name: reason
          in: query
          schema: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/RequestsReason'}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 1024}}
        - {name: limit, in: query, schema: {type: integer, default: 25, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Project request page
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {const: 0}
                  message: {const: success}
                  data: {$ref: '#/components/schemas/RequestsPage'}
        default: {$ref: '#/components/responses/RequestsError'}
    parameters:
      - $ref: '#/components/parameters/IdentityWorkspaceID'
      - $ref: '#/components/parameters/IdentityProjectID'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/requests/{id}:
