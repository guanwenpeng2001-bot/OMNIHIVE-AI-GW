                type: array
                items:
                  type: object
                  required: [code, stage]
                  properties:
                    code: {type: string}
                    stage: {type: string}
                    origin: {type: string}
              factors:
                type: array
                items:
                  type: object
                  required: [name, value, unit, source, freshness, window_seconds, samples, observed_at]
                  properties:
                    name: {type: string}
                    value: {type: string}
                    unit: {type: string}
                    source: {type: string}
                    freshness: {type: string}
                    window_seconds: {type: integer, nullable: true}
                    samples: {type: string, nullable: true}
                    observed_at: {type: string, format: date-time, nullable: true}
        selected:
          type: object
          nullable: true
          required: [model_id, candidate_id, funding_source]
          properties:
            model_id: {type: string}
            candidate_id: {type: string}
            funding_source: {type: string}
        uncertainties: {type: array, items: {type: string}}
        redactions: {type: array, items: {type: string}}
        execution_outcome: {type: string, enum: [selected, wait, unselected]}
        selection_layer: {type: string}
    RoutingPolicyDiff:
      type: object
      properties:
        selection_changed:
          type: boolean
        became_eligible:
          type: array
          items:
            type: string
        became_excluded:
          type: array
          items:
            type: string
      required:
        - selection_changed
        - became_eligible
        - became_excluded
      additionalProperties: false
    RoutingPolicyHead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        active_version:
          type: string
        draft_version:
          type: string
        base_version:
          type: string
        etag:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        definition:
          $ref: '#/components/schemas/RoutingPolicyInput'
      required:
        - id
        - active_version
        - draft_version
        - base_version
        - etag
        - definition
      additionalProperties: false
    RoutingPolicyImpact:
      type: object
      properties:
        projects:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        keys:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
      required:
        - projects
        - keys
      additionalProperties: false
    RoutingPolicyInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scope:
          $ref: '#/components/schemas/RoutingPolicyScope'
        constraints:
          type: object
          properties:
            models:
              $ref: '#/components/schemas/RoutingPolicyListRule'
            regions:
              $ref: '#/components/schemas/RoutingPolicyListRule'
            retention:
              type: string
              enum:
                - inherit
                - strict_zero
            training:
              type: string
              enum:
                - inherit
                - prohibited
            max_input_rate:
              type: object
              properties:
                currency:
                  const: USD
                amount:
                  type: string
                unit:
                  const: input_token
                per:
                  const: '1000000'
              required:
                - currency
                - amount
                - unit
                - per
              additionalProperties: false
            required_capabilities:
              type: array
              items:
                type: string
            require_known_quota:
              type: boolean
          additionalProperties: false
        candidates:
          type: object
          properties:
            pool_ids:
              type: array
              items:
                type: string
            denied_provider_ids:
              type: array
              items:
                type: string
            allow_expansion:
              type: boolean
          additionalProperties: false
        preferences:
          type: object
          properties:
            template:
              type: string
              enum:
                - balanced
                - stable
                - low_latency
                - lowest_cost
            ordered_provider_ids:
              type: array
              items:
                type: string
          additionalProperties: false
        fallback:
          type: object
          properties:
            endpoint:
              type: boolean
            model_ids:
              type: array
              items:
                type: string
            byok_to_platform:
              type: boolean
          additionalProperties: false
      required:
        - name
        - scope
      additionalProperties: false
    RoutingPolicyListRule:
      oneOf:
        - type: object
          properties:
            mode:
              type: string
              enum:
                - inherit
                - deny_all
            values:
              type: array
              items:
                type: string
              maxItems: 0
          required:
            - mode
          additionalProperties: false
        - type: object
          properties:
            mode:
              type: string
              enum:
                - allow_list
            values:
              type: array
              items:
                type: string
              minItems: 1
              maxItems: 256
              uniqueItems: true
          required:
            - mode
            - values
          additionalProperties: false
    RoutingPolicyPublication:
      type: object
      properties:
        id:
          type: string
          format: uuid
        active_version:
          type: string
          format: uuid
        previous_version:
          type: string
        published_at:
          type: string
          format: date-time
        impact:
          $ref: '#/components/schemas/RoutingPolicyImpact'
        revocation_epoch:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
      required:
        - id
        - active_version
        - previous_version
        - published_at
        - impact
        - revocation_epoch
      additionalProperties: false
    RoutingPolicyPublish:
      type: object
      properties:
        draft_version:
          type: string
          format: uuid
        base_version:
          type: string
        simulation_id:
          type: string
        change_note:
          type: string
      required:
        - draft_version
        - base_version
        - simulation_id
        - change_note
      additionalProperties: false
    RoutingPolicyRollback:
      type: object
      properties:
        from_version:
          type: string
          format: uuid
        restore_version:
          type: string
          format: uuid
        change_note:
          type: string
      required:
        - from_version
        - restore_version
        - change_note
      additionalProperties: false
    RoutingPolicyScope:
      type: object
      properties:
        type:
          type: string
          enum:
            - workspace
            - project
            - api_key
        id:
          $ref: '#/components/schemas/IdentityID'
        project_id:
          $ref: '#/components/schemas/IdentityID'
      required:
        - type
        - id
      additionalProperties: false
    RoutingPolicySimulation:
      type: object
      properties:
        simulation_id:
          type: string
        trace:
          $ref: '#/components/schemas/RoutingDecisionTrace'
        baseline:
          anyOf:
            - $ref: '#/components/schemas/RoutingDecisionTrace'
            - type: 'null'
        diff:
          anyOf:
            - $ref: '#/components/schemas/RoutingPolicyDiff'
            - type: 'null'
        impact:
          $ref: '#/components/schemas/RoutingPolicyImpact'
        expires_at:
          type: string
          format: date-time
      required:
        - simulation_id
        - trace
        - baseline
        - diff
        - impact
        - expires_at
      additionalProperties: false
    RoutingPolicySimulationInput:
      type: object
      properties:
        version:
          type: string
          format: uuid
        compare_version:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        project_id:
          $ref: '#/components/schemas/IdentityID'
        api_key_id:
          anyOf:
            - $ref: '#/components/schemas/IdentityID'
            - type: 'null'
        model_id:
          type: string
        protocol:
          type: string
        action:
          type: string
        required_capabilities:
          type: array
          items:
            type: string
        input_token_bound:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        output_token_bound:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        snapshot_id:
          anyOf:
            - type: string
            - type: 'null'
        seed:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
      required:
        - version
        - project_id
        - model_id
        - protocol
        - action
        - input_token_bound
        - output_token_bound
        - seed
      additionalProperties: false
    RoutingPolicyVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        base_version:
          type: string
        actor_id:
          $ref: '#/components/schemas/IdentityID'
        published_at:
          type: string
          format: date-time
        change_note:
          type: string
      required:
        - id
        - base_version
        - actor_id
        - published_at
        - change_note
      additionalProperties: false
