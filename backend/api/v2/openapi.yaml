# Generated by go run ./api/v2/compose. Edit the fragments instead.
openapi: 3.1.0
info:
  title: OmniHive API
  version: 2.0.0
paths:
  /api/v1/workspaces/{workspace_id}/connections/{id}/authorization:
    parameters:
      - $ref: '#/components/parameters/IdentityWorkspaceID'
      - $ref: '#/components/parameters/ConnectionID'
    put:
      operationId: connectionAttachAuthorization
      parameters:
        - $ref: '#/components/parameters/IdentityVersion'
        - $ref: '#/components/parameters/IdentityIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionAuthorization'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/ConnectionWriteResult'
                additionalProperties: false
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
      summary: Consume a workspace and browser-bound authorization draft
  /api/v2/admin/catalog/verification-targets:
    post:
      operationId: catalogCreateVerificationTarget
      summary: Register a reviewed platform connection and matrix tuple
      description: Requires catalog.verify. An interval of zero selects manual verification. A target starts as a candidate.
      parameters:
        - $ref: '#/components/parameters/CatalogVerificationIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogVerificationTargetInput'}
      responses:
        '201': {$ref: '#/components/responses/CatalogVerificationTarget'}
        default: {$ref: '#/components/responses/CatalogVerificationError'}
  /api/v2/admin/catalog/verification-targets/{id}:
    get:
      operationId: catalogVerificationTarget
      summary: Read a target, recent observations, and current publication
      description: Requires catalog.verify. The latest attempt and last success can refer to different observations.
      responses:
        '200':
          description: Verification target detail
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {const: 0}
                  message: {const: success}
                  data:
                    allOf:
                      - $ref: '#/components/schemas/CatalogVerificationTarget'
                      - type: object
                        required: [latest_attempt, last_success, publication]
                        properties:
                          latest_attempt:
                            anyOf:
                              - $ref: '#/components/schemas/CatalogVerificationObservation'
                              - type: 'null'
                          last_success:
                            anyOf:
                              - $ref: '#/components/schemas/CatalogVerificationObservation'
                              - type: 'null'
                          publication:
                            anyOf:
                              - $ref: '#/components/schemas/CatalogCompatibilityPublication'
                              - type: 'null'
        default: {$ref: '#/components/responses/CatalogVerificationError'}
    parameters:
      - $ref: '#/components/parameters/CatalogVerificationTargetID'
  /api/v2/admin/catalog/verification-targets/{id}/publications:
    parameters:
      - $ref: '#/components/parameters/CatalogVerificationTargetID'
    post:
      operationId: catalogPublishCompatibility
      summary: Publish a compatibility lifecycle update or roll back to a previous revision
      description: Requires catalog.publish. Use the current publication_version or zero in If-Match.
      parameters:
        - $ref: '#/components/parameters/CatalogVerificationIdempotency'
        - $ref: '#/components/parameters/CatalogVerificationIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [maturity]
                  properties:
                    maturity: {const: experimental}
                    evidence_id: {type: string}
                - type: object
                  additionalProperties: false
                  required: [maturity, evidence_id]
                  properties:
                    maturity: {const: stable}
                    evidence_id: {type: string}
                - type: object
                  additionalProperties: false
                  required: [maturity, deprecation_reason, sunset_at]
                  properties:
                    maturity: {const: deprecated}
                    deprecation_reason: {$ref: '#/components/schemas/CatalogDeprecationReason'}
                    sunset_at: {type: string, format: date-time}
                - type: object
                  additionalProperties: false
                  required: [maturity]
                  properties:
                    maturity: {const: closed}
                - type: object
                  additionalProperties: false
                  required: [rollback_version]
                  properties:
                    rollback_version: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
      responses:
        '201':
          description: Published compatibility version
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {const: 0}
                  message: {const: success}
                  data: {$ref: '#/components/schemas/CatalogCompatibilityPublication'}
        default: {$ref: '#/components/responses/CatalogVerificationError'}
  /api/v2/admin/catalog/verification-targets/{id}/schedule:
    parameters:
      - $ref: '#/components/parameters/CatalogVerificationTargetID'
    put:
      operationId: catalogSetVerificationSchedule
      summary: Set the recurring verification interval
      description: Requires catalog.verify. Use the target schedule_version in If-Match. Recurring jobs run under the approving actor.
      parameters:
        - $ref: '#/components/parameters/CatalogVerificationIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [interval_seconds]
              properties:
                interval_seconds: {$ref: '#/components/schemas/CatalogVerificationInterval'}
      responses:
        '200': {$ref: '#/components/responses/CatalogVerificationTarget'}
        default: {$ref: '#/components/responses/CatalogVerificationError'}
  /api/v2/admin/catalog/verifications:
    post:
      operationId: catalogQueueVerification
      summary: Queue a platform catalog verification
      description: Requires catalog.verify. Omit protocol when the other matrix dimensions select exactly one reviewed target.
      parameters:
        - $ref: '#/components/parameters/CatalogVerificationIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogVerificationMatrixInput'}
      responses:
        '202':
          description: Verification accepted. Poll the workspace operation in status_url.
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {const: 0}
                  message: {const: accepted}
                  data: {$ref: '#/components/schemas/CatalogVerificationOperation'}
        '429':
          description: Verification capacity reached.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityError'}
        default: {$ref: '#/components/responses/CatalogVerificationError'}
  /api/v2/admin/extensions:
    get:
      operationId: listAdminExtensions
      description: List installed extension packages and their signed capability inventory for the authenticated administrator.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {const: 0}
                  message: {const: success}
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/ExtensionInventoryItem'}
        default:
          description: Management error
  /api/v2/admin/restores:
    post:
      operationId: executeRestore
      description: Queue the specified target. Production requires a verified isolated operation, a subsequent production preview and a current TOTP session grant. Requires ops.restore.execute.
      parameters:
        - $ref: '#/components/parameters/IdentityIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreExecuteInput'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: 0
                  message:
                    const: accepted
                  data:
                    $ref: '#/components/schemas/RestoreOperation'
                required:
                  - code
                  - message
                  - data
                additionalProperties: false
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/admin/restores/{id}:
    get:
      operationId: getRestore
      description: Read the journaled operation. Requires ops.restore.execute.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/RestoreOperation'
                required:
                  - code
                  - message
                  - data
                additionalProperties: false
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/admin/restores/previews:
    post:
      operationId: previewRestore
      description: Verify the requested archive digest and inspect its contents. Requires ops.restore.preview.
      parameters:
        - $ref: '#/components/parameters/IdentityIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestorePreviewInput'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/RestorePreview'
                required:
                  - code
                  - message
                  - data
                additionalProperties: false
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/admin/status/incidents:
    post:
      operationId: statusIncidentCreate
      summary: Publish an incident and its initial investigating update
      description: Requires a console session and ops.incidents.publish. Title and message are shown publicly as plain text.
      parameters:
        - $ref: '#/components/parameters/IdentityIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, severity, component_ids, message]
              properties:
                title: {type: string, minLength: 1, maxLength: 160}
                severity: {$ref: '#/components/schemas/StatusSeverity'}
                component_ids: {$ref: '#/components/schemas/StatusAffectedComponents'}
                message: {$ref: '#/components/schemas/StatusMessage'}
      responses:
        '201': {$ref: '#/components/responses/StatusPublication'}
        '409': {$ref: '#/components/responses/StatusError'}
        default: {$ref: '#/components/responses/StatusError'}
  /api/v2/admin/status/incidents/{id}/updates:
    parameters:
      - $ref: '#/components/parameters/StatusIncidentID'
    post:
      operationId: statusIncidentUpdate
      summary: Append an incident timeline update
      description: Requires ops.incidents.publish. The incident can stay in its current active state or advance toward resolved.
      parameters:
        - $ref: '#/components/parameters/IdentityIdempotency'
        - $ref: '#/components/parameters/IdentityVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state, message]
              properties:
                state: {$ref: '#/components/schemas/StatusIncidentState'}
                message: {$ref: '#/components/schemas/StatusMessage'}
      responses:
        '201': {$ref: '#/components/responses/StatusPublication'}
        '409': {$ref: '#/components/responses/StatusError'}
        '412':
          description: Stale incident version
          headers:
            ETag: {$ref: '#/components/headers/StatusETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityError'}
        default: {$ref: '#/components/responses/StatusError'}
  /api/v2/me/scopes:
    get:
      operationId: identityScopes
      summary: List accessible workspaces and projects
      parameters:
        - $ref: '#/components/parameters/IdentityLimit'
        - $ref: '#/components/parameters/IdentityCursor'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/IdentityWorkspacePage'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/public/models:
    get:
      operationId: listPublicModels
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: provider
          in: query
          schema:
            type: array
            items:
              type: string
        - name: protocol
          in: query
          schema:
            type: array
            items:
              type: string
        - name: action
          in: query
          schema:
            type: array
            items:
              type: string
        - name: modality
          in: query
          schema:
            type: array
            items:
              type: string
        - name: region
          in: query
          schema:
            type: array
            items:
              type: string
        - name: retention
          in: query
          schema:
            type: array
            items:
              type: string
        - name: stability
          in: query
          schema:
            type: array
            items:
              type: string
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - name
              - price_input
              - context
              - ttft
        - $ref: '#/components/parameters/IdentityLimit'
        - $ref: '#/components/parameters/IdentityCursor'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/CatalogModelPage'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
  /api/v2/public/models/{id}:
    get:
      operationId: getPublicModel
      parameters:
        - name: catalog_version
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/ModelDetail'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
    parameters:
      - $ref: '#/components/parameters/CatalogModelID'
  /api/v2/public/models/compare:
    post:
      operationId: comparePublicModels
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/CatalogCompareResult'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogCompareInput'
  /api/v2/public/status:
    get:
      operationId: publicStatus
      summary: Read published service health
      description: Returns allowlisted component measurements, the latest 90 UTC dates and up to 25 active incidents.
      security: []
      parameters:
        - name: window
          in: query
          schema: {type: string, enum: [1h, 24h, 7d, 30d], default: 24h}
        - $ref: '#/components/parameters/StatusIfNoneMatch'
        - $ref: '#/components/parameters/StatusIfModifiedSince'
      responses:
        '200':
          description: Public service status
          headers:
            ETag: {$ref: '#/components/headers/StatusETag'}
            Last-Modified: {$ref: '#/components/headers/StatusLastModified'}
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {const: 0}
                  message: {const: success}
                  data: {$ref: '#/components/schemas/StatusSummary'}
        '304': {$ref: '#/components/responses/StatusNotModified'}
        default: {$ref: '#/components/responses/StatusError'}
  /api/v2/public/status/incidents:
    get:
      operationId: publicIncidentList
      summary: List published incidents
      description: Results seek by newest incident start first. From and to filter incident start using a half-open interval.
      security: []
      parameters:
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 1024}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - $ref: '#/components/parameters/StatusIfNoneMatch'
        - $ref: '#/components/parameters/StatusIfModifiedSince'
      responses:
        '200':
          description: Public incident page with a publication cutoff
          headers:
            ETag: {$ref: '#/components/headers/StatusETag'}
            Last-Modified: {$ref: '#/components/headers/StatusLastModified'}
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {const: 0}
                  message: {const: success}
                  data:
                    type: object
                    required: [items, next_cursor, as_of]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/StatusIncidentSummary'}}
                      next_cursor: {type: [string, 'null']}
                      as_of: {type: string, format: date-time}
        '304': {$ref: '#/components/responses/StatusNotModified'}
        '410': {$ref: '#/components/responses/StatusError'}
        default: {$ref: '#/components/responses/StatusError'}
  /api/v2/public/status/incidents/{id}:
    get:
      operationId: publicIncidentDetail
      summary: Read a published incident and its full update history
      security: []
      parameters:
        - $ref: '#/components/parameters/StatusIfNoneMatch'
        - $ref: '#/components/parameters/StatusIfModifiedSince'
      responses:
        '200':
          description: Incident with updates in chronological order
          headers:
            ETag: {$ref: '#/components/headers/StatusETag'}
            Last-Modified: {$ref: '#/components/headers/StatusLastModified'}
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {const: 0}
                  message: {const: success}
                  data: {$ref: '#/components/schemas/StatusIncident'}
        '304': {$ref: '#/components/responses/StatusNotModified'}
        '404': {$ref: '#/components/responses/StatusError'}
        default: {$ref: '#/components/responses/StatusError'}
    parameters:
      - $ref: '#/components/parameters/StatusIncidentID'
  /api/v2/workspaces/{workspace_id}/billing/activity:
    get:
      operationId: workspaceCostActivity
      summary: Aggregate across projects with workspace billing access
      parameters:
        - {$ref: '#/components/parameters/CostQueryFrom'}
        - {$ref: '#/components/parameters/CostQueryTo'}
        - {$ref: '#/components/parameters/CostQueryTimezone'}
        - {$ref: '#/components/parameters/CostQueryCurrency'}
        - {$ref: '#/components/parameters/CostQueryKeyId'}
        - {$ref: '#/components/parameters/CostQueryMemberId'}
        - {$ref: '#/components/parameters/CostQueryModelId'}
        - {$ref: '#/components/parameters/CostQueryFundingSource'}
        - {$ref: '#/components/parameters/CostQuerySettlementState'}
        - {$ref: '#/components/parameters/CostQueryCursor'}
        - {$ref: '#/components/parameters/CostQueryLimit'}
        - {$ref: '#/components/parameters/CostQueryGroupBy'}
      responses:
        '200':
          description: Aggregate across projects with workspace billing access
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code: {const: 0}
                  message: {type: string}
                  data: {$ref: '#/components/schemas/CostActivity'}
        default:
          description: Scoped management error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityError'}
    parameters:
      - {$ref: '#/components/parameters/IdentityWorkspaceID'}
  /api/v2/workspaces/{workspace_id}/billing/reconciliation:
    get:
      operationId: listBillingDiscrepancies
      summary: Read workspace or delegated project discrepancies
      parameters:
        - {$ref: '#/components/parameters/CostQueryProjectId'}
        - {$ref: '#/components/parameters/CostQueryState'}
        - {$ref: '#/components/parameters/CostQueryFromOptional'}
        - {$ref: '#/components/parameters/CostQueryToOptional'}
        - {$ref: '#/components/parameters/CostQueryCurrencyOptional'}
        - {$ref: '#/components/parameters/CostQueryCursor'}
        - {$ref: '#/components/parameters/CostQueryLimit'}
      responses:
        '200':
          description: Read workspace or delegated project discrepancies
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code: {const: 0}
                  message: {type: string}
                  data: {$ref: '#/components/schemas/CostCasePage'}
        default:
          description: Scoped management error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityError'}
    parameters:
      - {$ref: '#/components/parameters/IdentityWorkspaceID'}
  /api/v2/workspaces/{workspace_id}/billing/reconciliation/{id}/resolve:
    parameters:
      - {$ref: '#/components/parameters/IdentityWorkspaceID'}
      - name: id
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/IdentityIdempotency'}
      - name: If-Match
        in: header
        required: true
        schema: {type: string}
    post:
      operationId: resolveBillingDiscrepancy
      summary: Record a reviewed evidence reference
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CostResolutionInput'}
      responses:
        '202':
          description: Record a reviewed evidence reference
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code: {const: 0}
                  message: {type: string}
                  data: {$ref: '#/components/schemas/IdentityOperation'}
        default:
          description: Scoped management error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityError'}
  /api/v2/workspaces/{workspace_id}/byok:
    get:
      operationId: byokWorkspaceList
      summary: List scoped pilot credentials
      description: Requires credentials.byok.manage.
      parameters:
        - $ref: '#/components/parameters/IdentityCursor'
        - $ref: '#/components/parameters/IdentityLimit'
      responses:
        '200':
          $ref: '#/components/responses/ByokPage'
        default:
          $ref: '#/components/responses/ByokError'
    parameters:
      - $ref: '#/components/parameters/IdentityWorkspaceID'
    post:
      operationId: byokWorkspaceCreate
      summary: Enroll an ordinary provider API key
      description: Requires credentials.byok.manage.
      parameters:
        - $ref: '#/components/parameters/IdentityIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ByokCreate'
      responses:
        '201':
          $ref: '#/components/responses/ByokCreated'
        default:
          $ref: '#/components/responses/ByokError'
  /api/v2/workspaces/{workspace_id}/byok/{id}/policy:
    parameters:
      - $ref: '#/components/parameters/IdentityWorkspaceID'
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IdentityID'
    put:
      operationId: byokWorkspacePolicy
      summary: Replace allowed scopes and funding consent
      description: Requires credentials.byok.manage.
      parameters:
        - $ref: '#/components/parameters/IdentityVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ByokPolicy'
      responses:
        '200':
          $ref: '#/components/responses/ByokChanged'
        default:
          $ref: '#/components/responses/ByokError'
  /api/v2/workspaces/{workspace_id}/byok/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/IdentityWorkspaceID'
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IdentityID'
    post:
      operationId: byokWorkspaceRevoke
      summary: Revoke the current credential
      description: Requires credentials.byok.manage.
      parameters:
