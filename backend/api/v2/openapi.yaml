          in: query
          schema:
            type: array
            items:
              type: string
        - name: protocol
          in: query
          schema:
            type: array
            items:
              type: string
        - name: action
          in: query
          schema:
            type: array
            items:
              type: string
        - name: modality
          in: query
          schema:
            type: array
            items:
              type: string
        - name: region
          in: query
          schema:
            type: array
            items:
              type: string
        - name: retention
          in: query
          schema:
            type: array
            items:
              type: string
        - name: stability
          in: query
          schema:
            type: array
            items:
              type: string
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - name
              - price_input
              - context
              - ttft
        - $ref: '#/components/parameters/IdentityLimit'
        - $ref: '#/components/parameters/IdentityCursor'
        - name: accessible
          in: query
          schema:
            type: boolean
        - name: routable
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/CatalogModelPage'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
    parameters:
      - $ref: '#/components/parameters/IdentityWorkspaceID'
      - $ref: '#/components/parameters/IdentityProjectID'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/models/{id}:
    get:
      operationId: getProjectModel
      parameters:
        - name: catalog_version
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/ModelDetail'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
    parameters:
      - $ref: '#/components/parameters/IdentityWorkspaceID'
      - $ref: '#/components/parameters/IdentityProjectID'
      - $ref: '#/components/parameters/CatalogModelID'
  /api/v2/workspaces/{workspace_id}/projects/{project_id}/models/compare:
    parameters:
      - $ref: '#/components/parameters/IdentityWorkspaceID'
      - $ref: '#/components/parameters/IdentityProjectID'
    post:
      operationId: compareProjectModels
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/CatalogCompareResult'
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogCompareInput'
  /api/v2/workspaces/{workspace_id}/provider-schemas:
    get:
      operationId: connectionSchemas
      parameters:
        - $ref: '#/components/parameters/IdentityCursor'
        - $ref: '#/components/parameters/IdentityLimit'
        - name: provider
          in: query
          schema:
            type: string
        - name: auth_type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    const: 0
                  message:
                    const: success
                  data:
                    $ref: '#/components/schemas/ConnectionSchemaPage'
                additionalProperties: false
        default:
          description: Management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
    parameters:
      - $ref: '#/components/parameters/IdentityWorkspaceID'
components:
  parameters:
    CatalogModelID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^m_[0-9a-f]{32}$
    ConnectionID:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    IdentityCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    IdentityIdempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IdentityLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdentityMemberID:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    IdentityOperationID:
      name: id
      in: path
      required: true
      schema:
        type: string
    IdentityProjectID:
      name: project_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    IdentityVersion:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    IdentityWorkspaceID:
      name: workspace_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
  schemas:
    CatalogBenchmark:
      type: object
      required:
        - benchmark_id
        - unit
        - source
        - value
        - verified_at
      properties:
        benchmark_id:
          type: string
        unit:
          type: string
        source:
          type: string
        value:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
        verified_at:
          type: string
          format: date-time
    CatalogCapability:
      type: object
      required:
        - source
        - maturity
        - observed_at
        - expires_at
        - state
        - action
        - protocol
        - mode
        - tools
        - stream
        - verified_at
        - adapter_version
        - limitations
      properties:
        source:
          type: string
        maturity:
          type: string
          enum:
            - unknown
            - stable
            - experimental
            - deprecated
        observed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        expires_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        state:
          type: string
          enum:
            - fresh
            - stale
            - unknown
        action:
          type: string
        protocol:
          type: string
        mode:
          type: string
          enum:
            - native
            - bridge
            - unknown
        tools:
          type: string
          enum:
            - supported
            - unsupported
            - unknown
        stream:
          type: string
          enum:
            - supported
            - unsupported
            - unknown
        verified_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        adapter_version:
          anyOf:
            - type: string
            - type: 'null'
        limitations:
          type: array
          items:
            type: string
    CatalogCompareInput:
      type: object
      required:
        - model_ids
      properties:
        model_ids:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 3
          uniqueItems: true
        protocol:
          type: string
        action:
          type: string
        scenario:
          $ref: '#/components/schemas/CatalogPriceScenario'
        price_at:
          type: string
          format: date-time
    CatalogCompareResult:
      type: object
      required:
        - catalog_version
        - as_of
        - rows
      properties:
        catalog_version:
          type: string
        as_of:
          type: string
          format: date-time
        rows:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCompareRow'
    CatalogCompareRow:
      type: object
      required:
        - model_id
        - capabilities
        - metrics
        - benchmarks
        - quote
      properties:
        model_id:
          type: string
        capabilities:
          type: object
          required:
            - tools
            - stream
          properties:
            tools:
              type: string
              enum:
                - supported
                - unsupported
                - unknown
            stream:
              type: string
              enum:
                - supported
                - unsupported
                - unknown
        metrics:
          $ref: '#/components/schemas/CatalogMetrics'
        benchmarks:
          type: array
          items:
            $ref: '#/components/schemas/CatalogBenchmark'
        quote:
          $ref: '#/components/schemas/CatalogEstimate'
    CatalogEndpoint:
      type: object
      required:
        - id
        - provider
        - training
        - content_retention
        - regions
        - safety_retention_days
        - region_evidence
        - privacy_evidence
        - capabilities
      properties:
        id:
          type: string
        provider:
          type: string
        training:
          type: string
        content_retention:
          type: string
        regions:
          type: array
          items:
            type: string
        safety_retention_days:
          anyOf:
            - type: string
              pattern: ^(0|[1-9][0-9]*)$
            - type: 'null'
        region_evidence:
          anyOf:
            - $ref: '#/components/schemas/CatalogEvidence'
            - type: 'null'
        privacy_evidence:
          anyOf:
            - $ref: '#/components/schemas/CatalogEvidence'
            - type: 'null'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCapability'
    CatalogEstimate:
      type: object
      required:
        - state
        - price_version
        - estimated_charge
        - components
        - rounding_adjustment
      properties:
        state:
          type: string
          enum:
            - estimated
            - unpriced
        price_version:
          anyOf:
            - type: string
            - type: 'null'
        estimated_charge:
          anyOf:
            - $ref: '#/components/schemas/CatalogMoney'
            - type: 'null'
        components:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEstimateComponent'
        rounding_adjustment:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
            - type: 'null'
    CatalogEstimateComponent:
      type: object
      required:
        - kind
        - quantity
        - raw_amount
      properties:
        kind:
          type: string
        quantity:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        raw_amount:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
    CatalogEvidence:
      type: object
      required:
        - source
        - maturity
        - observed_at
        - expires_at
        - state
      properties:
        source:
          type: string
        maturity:
          type: string
          enum:
            - unknown
            - stable
            - experimental
            - deprecated
        observed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        expires_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        state:
          type: string
          enum:
            - fresh
            - stale
            - unknown
    CatalogMetrics:
      type: object
      required:
        - window_start
        - window_end
        - source
        - requests
        - ttft_samples
        - speed_samples
        - success_rate
        - ttft_p50_ms
        - output_tokens_per_second
        - state
      properties:
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        source:
          type: string
        requests:
          anyOf:
            - type: string
              pattern: ^(0|[1-9][0-9]*)$
            - type: 'null'
        ttft_samples:
          anyOf:
            - type: string
              pattern: ^(0|[1-9][0-9]*)$
            - type: 'null'
        speed_samples:
          anyOf:
            - type: string
              pattern: ^(0|[1-9][0-9]*)$
            - type: 'null'
        success_rate:
          anyOf:
            - type: number
              minimum: 0
              maximum: 1
            - type: 'null'
        ttft_p50_ms:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
        output_tokens_per_second:
          anyOf:
            - type: number
            - type: 'null'
        state:
          type: string
          enum:
            - insufficient_samples
            - partial
            - available
            - unavailable
            - withheld
    CatalogModelFacts:
      type: object
      required:
        - source
        - maturity
        - observed_at
        - expires_at
        - state
        - context_tokens
        - max_output_tokens
        - embedding_dimensions
        - context_kind
        - tools
        - vision
        - reasoning
        - prompt_caching
        - pdf
        - modalities
      properties:
        source:
          type: string
        maturity:
          type: string
          enum:
            - unknown
            - stable
            - experimental
            - deprecated
        observed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        expires_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        state:
          type: string
          enum:
            - fresh
            - stale
            - unknown
        context_tokens:
          anyOf:
            - type: string
              pattern: ^(0|[1-9][0-9]*)$
            - type: 'null'
        max_output_tokens:
          anyOf:
            - type: string
              pattern: ^(0|[1-9][0-9]*)$
            - type: 'null'
        embedding_dimensions:
          anyOf:
            - type: string
              pattern: ^(0|[1-9][0-9]*)$
            - type: 'null'
        context_kind:
          type: string
          enum:
            - input
            - total
            - unspecified
            - ''
        tools:
          anyOf:
            - type: boolean
            - type: 'null'
        vision:
          anyOf:
            - type: boolean
            - type: 'null'
        reasoning:
          anyOf:
            - type: boolean
            - type: 'null'
        prompt_caching:
          anyOf:
            - type: boolean
            - type: 'null'
        pdf:
          anyOf:
            - type: boolean
            - type: 'null'
        modalities:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
    CatalogModelPage:
      type: object
      required:
        - items
        - next_cursor
        - as_of
        - catalog_version
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModelSummary'
        next_cursor:
          anyOf:
            - type: string
            - type: 'null'
        as_of:
          type: string
          format: date-time
        catalog_version:
          type: string
    CatalogMoney:
      type: object
      required:
        - currency
        - amount
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        amount:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
    CatalogPriceScenario:
      type: object
      required: []
      properties:
        input_tokens:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        cached_input_tokens:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        output_tokens:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        requests:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
    CatalogRate:
      type: object
      required:
        - currency
        - amount
        - unit
        - per
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        amount:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
        unit:
          type: string
        per:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
    CatalogRateBand:
      type: object
      required:
        - rate
        - kind
        - min_tokens
        - max_tokens
      properties:
        rate:
          $ref: '#/components/schemas/CatalogRate'
        kind:
          type: string
        min_tokens:
          anyOf:
            - type: string
              pattern: ^(0|[1-9][0-9]*)$
            - type: 'null'
        max_tokens:
          anyOf:
            - type: string
              pattern: ^(0|[1-9][0-9]*)$
            - type: 'null'
        label:
          type: string
    CatalogScope:
      type: object
      required:
        - workspace_id
        - project_id
        - scope_version
      properties:
        workspace_id:
          $ref: '#/components/schemas/IdentityID'
        project_id:
          $ref: '#/components/schemas/IdentityID'
        scope_version:
          $ref: '#/components/schemas/IdentityID'
    CatalogTimeBand:
      type: object
      required:
        - timezone
        - start_time
        - end_time
        - weekdays_only
        - multiplier
      properties:
        timezone:
          type: string
        start_time:
          type: string
        end_time:
          type: string
        weekdays_only:
          type: boolean
        multiplier:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
    ConnectionActivate:
      type: object
      required:
        - preview_id
        - verification_id
        - expected_credential_version
      properties:
        preview_id:
          type: string
          format: uuid
        verification_id:
          type: string
          format: uuid
        expected_credential_version:
          type: string
          pattern: ^[1-9][0-9]*$
      additionalProperties: false
    ConnectionAssignments:
      type: object
      properties:
        model_ids:
          type: array
          items:
            type: string
        pool_ids:
          type: array
          items:
            type: string
            pattern: ^[1-9][0-9]*$
        limits:
          $ref: '#/components/schemas/ConnectionLimits'
      additionalProperties: false
    ConnectionAuthorization:
      type: object
      required:
        - credential_draft
        - revision
      additionalProperties: false
      properties:
        credential_draft:
          type: string
          writeOnly: true
        revision:
          type: string
    ConnectionBulkApply:
      type: object
      required:
        - preview_id
        - selected_ids
      properties:
        preview_id:
          type: string
          format: uuid
        selected_ids:
          type: array
          items:
            type: string
            pattern: ^[1-9][0-9]*$
      additionalProperties: false
    ConnectionBulkIn:
      type: object
      required:
        - ids
        - patch
      properties:
        ids:
          type: array
          items:
            type: string
            pattern: ^[1-9][0-9]*$
        patch:
          $ref: '#/components/schemas/ConnectionAssignments'
      additionalProperties: false
    ConnectionCheck:
      type: object
      required:
        - name
        - state
        - reason
      properties:
        name:
          type: string
          enum:
            - network
            - authorization
            - discover_models
        state:
          type: string
          enum:
            - passed
            - failed
            - unknown
            - unsupported
        reason:
          type:
            - string
            - 'null'
      additionalProperties: false
    ConnectionCreate:
      type: object
      required:
        - provider
        - schema_version
        - auth_type
        - name
      properties:
        provider:
          type: string
        schema_version:
          const: '1'
        auth_type:
          type: string
        name:
          type: string
        endpoint:
          type: string
        network_policy_id:
          type: string
      additionalProperties: false
    ConnectionCredentialInput:
      oneOf:
        - type: object
          required:
            - operation
          properties:
            operation:
              type: string
              enum:
                - keep
                - clear
          additionalProperties: false
        - type: object
          required:
            - operation
            - type
            - secret
          properties:
            operation:
              const: set
            type:
              type: string
            secret:
              type: string
              format: password
              writeOnly: true
            refresh_token:
              type: string
              format: password
              writeOnly: true
          additionalProperties: false
    ConnectionCredentialResult:
      type: object
      required:
        - version
      properties:
        connection_id:
          type: string
          pattern: ^[1-9][0-9]*$
        credential:
          $ref: '#/components/schemas/ConnectionMetadata'
        version:
          type: string
          pattern: ^[1-9][0-9]*$
      additionalProperties: false
    ConnectionEvent:
      type: object
      required:
        - id
        - type
        - version
        - at
        - actor_id
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
        type:
          type: string
        version:
          type: string
          pattern: ^[1-9][0-9]*$
        at:
          type: string
          format: date-time
        actor_id:
          type:
            - string
            - 'null'
      additionalProperties: false
    ConnectionEventPage:
      type: object
      required:
        - items
        - next_cursor
        - as_of
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionEvent'
        next_cursor:
          type:
            - string
            - 'null'
        as_of:
          type: string
          format: date-time
      additionalProperties: false
    ConnectionField:
      type: object
      required:
        - path
        - type
        - required
        - component
      properties:
        path:
          type: string
        type:
          type: string
        required:
          type: boolean
        component:
          type: string
      additionalProperties: false
    ConnectionItem:
      type: object
      required:
        - id
        - base_version
        - state
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
        base_version:
          type: string
          pattern: ^[1-9][0-9]*$
        state:
          type: string
          enum:
            - applicable
            - applied
            - blocked
            - conflict
        verification_id:
          type: string
          format: uuid
        reason:
          type: string
        version:
          type: string
          pattern: ^[1-9][0-9]*$
      additionalProperties: false
    ConnectionLimits:
      type: object
      required:
        - concurrency
      properties:
        concurrency:
          type: integer
          minimum: 1
          maximum: 10000
      additionalProperties: false
    ConnectionMetadata:
      type: object
      required:
        - version
        - state
        - fingerprint
        - last_four
      properties:
        version:
          type: string
          pattern: ^[0-9]+$
        state:
          type: string
          enum:
            - unset
            - unverified
            - verified
            - revoked
        fingerprint:
          type:
            - string
            - 'null'
        last_four:
          type:
            - string
            - 'null'
      additionalProperties: false
    ConnectionNewPool:
      type: object
      required:
        - name
        - max_concurrency
      properties:
        name:
          type: string
        connection_ids:
          type: array
          items:
            type: string
            pattern: ^[1-9][0-9]*$
        max_concurrency:
          type: integer
      additionalProperties: false
    ConnectionOperation:
      allOf:
        - $ref: '#/components/schemas/IdentityOperation'
        - type: object
          properties:
            result:
              anyOf:
                - $ref: '#/components/schemas/ConnectionVerification'
                - type: object
                  required:
                    - phase
                    - credential_version
                    - checks
                    - phases
                  properties:
                    phase:
                      type: string
                      enum:
                        - validating
                        - switching
                        - draining
                        - revoked
                        - failed
                    credential_version:
                      type: string
                      pattern: ^[1-9][0-9]*$
                    checks:
                      type: array
                      items:
