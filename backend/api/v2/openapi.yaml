      schema:
        $ref: '#/components/schemas/IdentityID'
    IdentityVersion:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    IdentityWorkspaceID:
      name: workspace_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
  schemas:
    ConnectionActivate:
      type: object
      required:
        - preview_id
        - verification_id
        - expected_credential_version
      properties:
        preview_id:
          type: string
          format: uuid
        verification_id:
          type: string
          format: uuid
        expected_credential_version:
          type: string
          pattern: ^[1-9][0-9]*$
      additionalProperties: false
    ConnectionAssignments:
      type: object
      properties:
        model_ids:
          type: array
          items:
            type: string
        pool_ids:
          type: array
          items:
            type: string
            pattern: ^[1-9][0-9]*$
        limits:
          $ref: '#/components/schemas/ConnectionLimits'
      additionalProperties: false
    ConnectionAuthorization:
      type: object
      required:
        - credential_draft
        - revision
      additionalProperties: false
      properties:
        credential_draft:
          type: string
          writeOnly: true
        revision:
          type: string
    ConnectionBulkApply:
      type: object
      required:
        - preview_id
