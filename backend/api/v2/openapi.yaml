      description: Server-generated identity of the admitted execution, including a matching idempotent resubmission.
      schema: {type: string, format: uuid}
    GatewayExecutionReplayed:
      description: Present on a matching keyed Responses resubmission with its original execution ID and an empty 204 body.
      schema: {type: string, const: 'true'}
    StatusETag:
      schema: {type: string}
      description: Representation validator on public GET or version on a publication response
    StatusLastModified:
      schema: {type: string}
      description: HTTP date for this representation
  parameters:
    CatalogModelID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^m_[0-9a-f]{32}$
    CatalogVerificationIdempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
    CatalogVerificationIfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"(0|[1-9][0-9]*)"$'}
    CatalogVerificationTargetID:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: '^vt_[a-f0-9-]{36}$'}
    ConnectionID:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    CostQueryApiKeyId:
      name: api_key_id
      in: query
      required: false
      schema: {type: string}
    CostQueryAt:
      name: at
      in: query
      required: false
      schema: {type: string, format: date-time}
    CostQueryCurrency:
      name: currency
      in: query
      required: true
      schema: {type: string}
    CostQueryCurrencyOptional:
      name: currency
      in: query
      required: false
      schema: {type: string}
    CostQueryCursor:
      name: cursor
      in: query
      required: false
      schema: {type: string}
    CostQueryFrom:
      name: from
      in: query
      required: true
      schema: {type: string, format: date-time}
    CostQueryFromOptional:
      name: from
      in: query
      required: false
      schema: {type: string, format: date-time}
    CostQueryFundingAccountId:
      name: funding_account_id
      in: query
      required: false
      schema: {type: string}
    CostQueryFundingSource:
      name: funding_source
      in: query
      required: false
      schema: {type: string}
    CostQueryGroupBy:
      name: group_by
      in: query
      required: false
      schema:
        type: string
        enum:
          - day
          - model
          - key
          - member
          - workspace
          - project
    CostQueryKeyId:
      name: key_id
      in: query
      required: false
      schema: {type: string}
    CostQueryLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    CostQueryMemberId:
      name: member_id
      in: query
      required: false
      schema: {type: string}
    CostQueryModelId:
      name: model_id
      in: query
      required: false
      schema: {type: string}
    CostQueryProjectId:
      name: project_id
      in: query
      required: false
      schema: {type: string}
    CostQueryRequestId:
      name: request_id
      in: query
      required: false
      schema: {type: string}
    CostQuerySettlementId:
      name: settlement_id
      in: query
      required: false
      schema: {type: string}
    CostQuerySettlementState:
      name: settlement_state
      in: query
      required: false
      schema: {type: string}
    CostQueryState:
      name: state
      in: query
      required: false
      schema: {type: string}
    CostQueryTimezone:
      name: timezone
      in: query
      required: true
      schema: {type: string}
    CostQueryTo:
      name: to
      in: query
      required: true
      schema: {type: string, format: date-time}
    CostQueryToOptional:
      name: to
      in: query
      required: false
      schema: {type: string, format: date-time}
    IdentityCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    IdentityIdempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IdentityLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdentityMemberID:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    IdentityOperationID:
      name: id
      in: path
      required: true
      schema:
        type: string
    IdentityProjectID:
      name: project_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    IdentityVersion:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    IdentityWorkspaceID:
      name: workspace_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityID'
    ImageArtifactID:
      in: path
      name: artifact_id
      required: true
      schema:
        type: string
    ImageTaskID:
      in: path
      name: id
      required: true
      schema:
        type: string
    ImageTaskTicketHeader:
      name: X-Artifact-Ticket
      in: header
      required: true
      schema:
        type: string
    PaymentAdjustmentID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PlaygroundRunID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RequestsID:
      name: id
      in: path
      required: true
      schema: {type: string}
    ScopedAuditEventID:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/IdentityID'}
    StatusIfModifiedSince:
      name: If-Modified-Since
      in: header
      schema: {type: string}
    StatusIfNoneMatch:
      name: If-None-Match
      in: header
      schema: {type: string}
    StatusIncidentID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    ByokChanged:
      description: Changed
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - code
              - message
              - data
            properties:
              code:
                const: 0
              message:
                const: success
              data:
                $ref: '#/components/schemas/ByokCredential'
    ByokCreated:
      description: Created
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - code
              - message
              - data
            properties:
              code:
                const: 0
              message:
                const: success
              data:
                $ref: '#/components/schemas/ByokCredential'
    ByokError:
      description: Invalid command, inaccessible scope, stale revision, or unavailable funding evidence.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdentityError'
    ByokEstimate:
      description: Estimate
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - code
              - message
              - data
            properties:
              code:
                const: 0
              message:
                const: success
              data:
                $ref: '#/components/schemas/ByokEstimate'
    ByokOperation:
      description: Operation
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - code
              - message
              - data
            properties:
              code:
                const: 0
              message:
                const: accepted
              data:
                $ref: '#/components/schemas/IdentityOperation'
    ByokPage:
      description: Page
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - code
              - message
              - data
            properties:
              code:
                const: 0
              message:
                const: success
              data:
                $ref: '#/components/schemas/ByokPage'
    CatalogVerificationError:
      description: Management error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/IdentityError'}
    CatalogVerificationTarget:
      description: Verification target
      headers:
        ETag: {schema: {type: string}}
      content:
        application/json:
          schema:
            type: object
            required: [code, message, data]
            properties:
              code: {const: 0}
              message: {const: success}
              data: {$ref: '#/components/schemas/CatalogVerificationTarget'}
    PlaygroundExecution:
      description: New POST stream, synchronous native result, or JSON summary for a matching idempotent submission
      content:
        text/event-stream:
          schema: {type: string, description: 'SSE id matches seq. Event names are started, delta, usage, raw_event, diagnostic, finished and failed.'}
          x-event-data-schema: {$ref: '#/components/schemas/PlaygroundEvent'}
        application/json:
          schema:
            type: object
            required: [code, message, data]
            properties:
              code: {const: 0}
              message: {const: success}
              data:
                oneOf:
                  - {$ref: '#/components/schemas/PlaygroundSummary'}
                  - {$ref: '#/components/schemas/PlaygroundResult'}
    PlaygroundStatus:
      description: Current submission and linked settlement status
      content:
        application/json:
          schema:
            type: object
            required: [code, message, data]
            properties:
              code: {const: 0}
              message: {enum: [success, accepted]}
              data: {$ref: '#/components/schemas/PlaygroundSummary'}
    RequestsError:
      description: Management error including invalid filters, expired cursor or artifact, denied action, and inaccessible request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/IdentityError'}
    ScopedAuditError:
      description: Scoped audit error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/IdentityError'}
    ScopedAuditPolicy:
      description: Effective policy
      content:
        application/json:
          schema:
            type: object
            required: [code, message, data]
            properties:
              code: {const: 0}
              message: {type: string}
              data: {$ref: '#/components/schemas/ScopedAuditRetention'}
    StatusError:
      description: Request failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/IdentityError'}
    StatusNotModified:
      description: The public representation is unchanged
      headers:
        ETag: {$ref: '#/components/headers/StatusETag'}
    StatusPublication:
      description: Published incident including its optimistic version
      headers:
        ETag: {$ref: '#/components/headers/StatusETag'}
      content:
        application/json:
          schema:
            type: object
            required: [code, message, data]
            properties:
              code: {const: 0}
              message: {const: success}
              data:
                allOf:
                  - $ref: '#/components/schemas/StatusIncident'
                  - type: object
                    required: [version]
                    properties:
                      version: {$ref: '#/components/schemas/StatusCount'}
  schemas:
    AdmittedExecution:
      x-internal: true
      description: Frozen server admission metadata. Readers apply project authorization and their field-level projection before delivery.
      type: object
      additionalProperties: false
      required: [request_id, scope, attempt_budget, deadline, versions, reservation_ref]
      properties:
        request_id: {type: string, format: uuid}
        scope: {$ref: '#/components/schemas/ExecutionAuthorizedScope'}
        attempt_budget: {type: integer, minimum: 1}
        deadline: {type: string, format: date-time}
        versions:
          type: object
          additionalProperties: false
          required: [model, price, pricing_at]
          properties:
            model: {type: string}
            price: {type: string}
            pricing_at: {type: string, format: date-time}
        reservation_ref: {type: string, minLength: 1}
    AudioTaskCreate:
      type: object
      description: Synchronous Qwen speech with the Cherry voice. The native tariff uses provider-reported characters. Output is a private PCM WAV up to 120 seconds and 32 MiB. Cancellation is unavailable after dispatch.
      additionalProperties: false
      required: [kind, model_id, api_key_id, input, funding_acknowledged]
      properties:
        kind: {const: audio}
        model_id: {type: string, minLength: 1, maxLength: 255}
        api_key_id: {type: string, pattern: '^[1-9][0-9]*$'}
        funding_acknowledged: {const: true}
        input:
          type: object
          additionalProperties: false
          required: [prompt, format]
          properties:
            prompt: {type: string, minLength: 1, maxLength: 600}
            format: {const: wav}
    ByokCreate:
      type: object
      additionalProperties: false
      required:
        - provider
        - auth_type
        - secret
        - allowed_project_ids
        - allowed_member_ids
        - allowed_key_ids
        - allowed_model_ids
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 128
        auth_type:
          const: api_key
        secret:
          type: string
          minLength: 1
          maxLength: 262144
          writeOnly: true
        allowed_project_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IdentityID'
        allowed_member_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IdentityID'
        allowed_key_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IdentityID'
        allowed_model_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
          description: Lower values are preferred.
        allow_platform_fallback:
          type: boolean
          default: false
        include_external_in_budget:
          type: boolean
          default: false
    ByokCredential:
      type: object
      additionalProperties: false
      required:
        - id
        - owner_workspace_id
        - provider
        - version
        - credential_version
        - state
        - fingerprint
        - verified_until
        - scope
        - priority
        - allow_platform_fallback
        - include_external_in_budget
      properties:
        id:
          $ref: '#/components/schemas/IdentityID'
        owner_workspace_id:
          $ref: '#/components/schemas/IdentityID'
        provider:
          type: string
          minLength: 1
          maxLength: 128
        version:
          $ref: '#/components/schemas/IdentityID'
        credential_version:
          $ref: '#/components/schemas/IdentityID'
        state:
          type: string
          enum:
            - unverified
            - verified
            - expired
            - revoked
        fingerprint:
          type: string
        verified_until:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        scope:
          type: object
          additionalProperties: false
          required:
            - project_ids
            - member_ids
            - key_ids
            - model_ids
          properties:
            project_ids:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items:
                $ref: '#/components/schemas/IdentityID'
            member_ids:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items:
                $ref: '#/components/schemas/IdentityID'
            key_ids:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items:
                $ref: '#/components/schemas/IdentityID'
            model_ids:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items:
                type: string
                minLength: 1
                maxLength: 128
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
          description: Lower values are preferred.
        allow_platform_fallback:
          type: boolean
          default: false
        include_external_in_budget:
          type: boolean
          default: false
    ByokEstimate:
      type: object
      additionalProperties: false
      required:
        - funding_source
        - external_state
        - byok_external_estimate
        - platform_service_fee
        - platform_estimate
        - price_version
        - include_external_in_budget
      properties:
        funding_source:
          const: byok
        external_state:
          type: string
          enum:
            - unknown
            - estimated
        byok_external_estimate:
          oneOf:
            - $ref: '#/components/schemas/CatalogMoney'
            - type: 'null'
        platform_service_fee:
          $ref: '#/components/schemas/CatalogMoney'
        platform_estimate:
          type: 'null'
        price_version:
          oneOf:
            - type: string
            - type: 'null'
        include_external_in_budget:
          type: boolean
    ByokPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ByokCredential'
        next_cursor:
          oneOf:
            - type: string
            - type: 'null'
    ByokPolicy:
      type: object
      additionalProperties: false
      required:
        - allowed_project_ids
        - allowed_member_ids
        - allowed_key_ids
        - allowed_model_ids
      properties:
        allowed_project_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IdentityID'
        allowed_member_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IdentityID'
        allowed_key_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IdentityID'
        allowed_model_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
          description: Lower values are preferred.
        allow_platform_fallback:
          type: boolean
          default: false
        include_external_in_budget:
          type: boolean
          default: false
    ByokRevoke:
      type: object
      additionalProperties: false
      required:
        - mode
      properties:
        mode:
          type: string
          enum:
            - force
            - drain
    ByokRotate:
      type: object
      additionalProperties: false
      required:
        - replacement
      properties:
        replacement:
          type: object
          additionalProperties: false
          required:
            - secret
          properties:
            secret:
              type: string
              minLength: 1
              maxLength: 262144
              writeOnly: true
    ByokVerify:
      type: object
      additionalProperties: false
    CatalogBenchmark:
      type: object
      required:
        - benchmark_id
        - unit
        - source
        - value
        - verified_at
      properties:
        benchmark_id:
          type: string
        unit:
          type: string
        source:
          type: string
        value:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
        verified_at:
          type: string
          format: date-time
    CatalogCapability:
      type: object
      required:
        - source
        - maturity
        - observed_at
        - expires_at
        - state
        - action
        - protocol
        - mode
        - tools
        - stream
        - verified_at
        - adapter_version
        - limitations
      properties:
        verified_extension_actions:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/ExtensionActionLabel'}
        source:
          type: string
        maturity:
          type: string
          enum:
            - unknown
            - stable
            - experimental
            - deprecated
        observed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        expires_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        state:
          type: string
          enum:
            - fresh
            - stale
            - unknown
        action:
          type: string
        protocol:
          type: string
        mode:
          type: string
          enum:
            - native
            - bridge
            - unknown
        tools:
          type: string
          enum:
            - supported
            - unsupported
            - unknown
        stream:
          type: string
          enum:
            - supported
            - unsupported
            - unknown
        verified_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        adapter_version:
          anyOf:
            - type: string
            - type: 'null'
        limitations:
          type: array
          items:
            type: string
    CatalogCompareInput:
      type: object
      required:
        - model_ids
      properties:
        model_ids:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 3
          uniqueItems: true
        protocol:
          type: string
        action:
          type: string
        scenario:
          $ref: '#/components/schemas/CatalogPriceScenario'
        price_at:
          type: string
          format: date-time
    CatalogCompareResult:
      type: object
      required:
        - catalog_version
        - as_of
        - rows
      properties:
        catalog_version:
          type: string
        as_of:
          type: string
          format: date-time
        rows:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCompareRow'
    CatalogCompareRow:
      type: object
      required:
        - model_id
        - capabilities
        - metrics
        - benchmarks
        - quote
      properties:
        model_id:
          type: string
        capabilities:
          type: object
          required:
            - tools
            - stream
          properties:
            tools:
              type: string
              enum:
                - supported
                - unsupported
                - unknown
            stream:
              type: string
              enum:
                - supported
                - unsupported
                - unknown
        metrics:
          $ref: '#/components/schemas/CatalogMetrics'
        benchmarks:
          type: array
          items:
            $ref: '#/components/schemas/CatalogBenchmark'
        quote:
          $ref: '#/components/schemas/CatalogEstimate'
    CatalogCompatibilityPublication:
      allOf:
        - $ref: '#/components/schemas/CatalogModelCompatibility'
        - type: object
          required: [target_id, entry_id, rollback_version]
          properties:
            target_id: {type: string}
            entry_id: {type: string}
            rollback_version: {type: [string, 'null']}
    CatalogDeprecationNotice:
      type: object
      required: [reason, announced_at, sunset_at]
      properties:
        reason: {$ref: '#/components/schemas/CatalogDeprecationReason'}
        announced_at: {type: string, format: date-time}
        sunset_at: {type: string, format: date-time}
    CatalogDeprecationReason:
      type: string
      enum: [provider_retirement, adapter_retirement, superseded]
    CatalogEndpoint:
      type: object
      required:
        - id
        - provider
        - training
        - content_retention
        - regions
        - safety_retention_days
        - region_evidence
        - privacy_evidence
        - capabilities
      properties:
        id:
          type: string
        provider:
          type: string
        training:
          type: string
        content_retention:
          type: string
        regions:
          type: array
          items:
            type: string
        safety_retention_days:
          anyOf:
            - type: string
              pattern: ^(0|[1-9][0-9]*)$
            - type: 'null'
        region_evidence:
          anyOf:
            - $ref: '#/components/schemas/CatalogEvidence'
            - type: 'null'
        privacy_evidence:
          anyOf:
            - $ref: '#/components/schemas/CatalogEvidence'
            - type: 'null'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCapability'
    CatalogEstimate:
      type: object
      required:
        - state
        - price_version
        - estimated_charge
        - components
        - rounding_adjustment
      properties:
        state:
          type: string
          enum:
            - estimated
            - unpriced
        price_version:
          anyOf:
            - type: string
            - type: 'null'
        estimated_charge:
          anyOf:
            - $ref: '#/components/schemas/CatalogMoney'
            - type: 'null'
        components:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEstimateComponent'
        rounding_adjustment:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
            - type: 'null'
    CatalogEstimateComponent:
      type: object
      required:
        - kind
