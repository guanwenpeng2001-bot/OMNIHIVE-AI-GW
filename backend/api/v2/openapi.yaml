        reason:
          oneOf:
            - $ref: '#/components/schemas/RequestsReason'
            - type: 'null'
        settlement_state: {$ref: '#/components/schemas/RequestsSettlementState'}
        charged_amount: {$ref: '#/components/schemas/RequestsNullableMoney'}
        attempt_count: {type: [string, 'null'], pattern: '^[0-9]+$'}
        detail_url: {type: string}
        redactions: {type: array, items: {type: string}}
    RequestsTimeline:
      type: array
      items:
        type: object
        required: [kind, at, source]
        properties:
          kind: {type: string, enum: [admitted, first_output, client_completed, client_ended, execution_finished, settled]}
          at: {type: string, format: date-time}
          source: {type: string, enum: [gateway_admission, gateway_finalization, upstream_ttft_estimate, settlement_receipt]}
    RequestsUsage:
      type: object
      required: [level, source, units]
      properties:
        level: {type: string, enum: [observed, unknown]}
        source: {type: string, enum: [settlement_receipt, legacy_usage, unconfirmed]}
        units:
          type: array
          items:
            type: object
            required: [kind, quantity]
            properties:
              kind: {type: string, enum: [input_token, output_token]}
              quantity: {type: string, pattern: '^[0-9]+$'}
    RestoreExecuteInput:
      type: object
      properties:
        preview_id:
          type: string
        target:
          type: string
          enum:
            - isolated
            - production
        rehearsal_id:
          type:
            - string
            - 'null'
      required:
        - preview_id
        - target
      additionalProperties: false
    RestoreOperation:
      type: object
      properties:
        id:
          type: string
        generation:
          type: string
          pattern: ^[0-9]+$
        target:
          type: string
          enum:
            - isolated
            - production
        state:
          enum:
            - queued
            - running
            - succeeded
            - failed
            - unknown
        stage:
          enum:
            - queued
            - check_source
            - snapshot
            - applying
            - verify_counts
            - verified
        report:
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/RestoreReport'
      required:
        - id
        - generation
        - target
        - state
        - stage
        - report
      additionalProperties: false
    RestorePreview:
      type: object
      properties:
        id:
          type: string
        verified:
          type: boolean
        expires_at:
          type: string
          format: date-time
        impact:
          type: object
          properties:
            databases:
              type: string
              pattern: ^[0-9]+$
            source_digest:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            users:
              type: string
              pattern: ^[0-9]+$
            api_keys:
              type: string
              pattern: ^[0-9]+$
            billing_usage_entries:
              type: string
              pattern: ^[0-9]+$
            upstream_jobs:
              type: string
              pattern: ^[0-9]+$
          required:
            - databases
            - source_digest
            - users
            - api_keys
            - billing_usage_entries
            - upstream_jobs
          additionalProperties: false
      required:
        - id
        - verified
        - expires_at
        - impact
      additionalProperties: false
    RestorePreviewInput:
      type: object
      properties:
        backup_id:
          type: string
        target:
          type: string
          enum:
            - isolated
            - production
        expected_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
      required:
        - backup_id
        - target
      additionalProperties: false
    RestoreReport:
      type: object
      properties:
        source_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        counts:
          type: object
          properties:
            users:
              type: string
              pattern: ^[0-9]+$
            api_keys:
              type: string
              pattern: ^[0-9]+$
            billing_usage_entries:
              type: string
              pattern: ^[0-9]+$
            upstream_jobs:
              type: string
              pattern: ^[0-9]+$
          required: []
          additionalProperties: false
        reason:
          type: string
      additionalProperties: false
    RoutingDecisionTrace:
      type: object
      required: [schema_version, mode, snapshot_id, as_of, policy_version, catalog_version, price_version, seed, origins, stages, candidates, selected, uncertainties, redactions]
      properties:
        schema_version: {type: integer, enum: [1]}
        mode: {type: string, enum: [simulation, execution]}
        snapshot_id: {type: string}
        as_of: {type: string, format: date-time}
        policy_version: {type: string}
        catalog_version: {type: string}
        price_version: {type: string}
        seed: {type: string, pattern: '^[0-9]+$'}
        origins:
          type: array
          items:
            type: object
            required: [constraint, scope_type, scope_id, version]
            properties:
              constraint: {type: string}
              scope_type: {type: string}
              scope_id: {type: string}
              version: {type: string}
        stages:
          type: array
          items:
            type: object
            required: [name, input_count, remaining_count]
            properties:
              name: {type: string}
              input_count: {type: string}
              remaining_count: {type: string}
        candidates:
          type: array
          items:
            type: object
            required: [id, state, rank, reasons, factors]
            properties:
              id: {type: string}
              state: {type: string, enum: [eligible, excluded]}
              rank: {type: integer, nullable: true, minimum: 1}
              reasons:
                type: array
                items:
                  type: object
                  required: [code, stage]
                  properties:
                    code: {type: string}
                    stage: {type: string}
                    origin: {type: string}
              factors:
                type: array
                items:
                  type: object
                  required: [name, value, unit, source, freshness, window_seconds, samples, observed_at]
                  properties:
                    name: {type: string}
                    value: {type: string}
                    unit: {type: string}
                    source: {type: string}
                    freshness: {type: string}
                    window_seconds: {type: integer, nullable: true}
                    samples: {type: string, nullable: true}
                    observed_at: {type: string, format: date-time, nullable: true}
        selected:
          type: object
          nullable: true
          required: [model_id, candidate_id, funding_source]
          properties:
            model_id: {type: string}
            candidate_id: {type: string}
            funding_source: {type: string}
        uncertainties: {type: array, items: {type: string}}
        redactions: {type: array, items: {type: string}}
        execution_outcome: {type: string, enum: [selected, wait, unselected]}
        selection_layer: {type: string}
    RoutingPolicyDiff:
      type: object
      properties:
        selection_changed:
          type: boolean
        became_eligible:
          type: array
          items:
            type: string
        became_excluded:
          type: array
          items:
            type: string
      required:
        - selection_changed
        - became_eligible
        - became_excluded
      additionalProperties: false
    RoutingPolicyHead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        active_version:
          type: string
        draft_version:
          type: string
        base_version:
          type: string
        etag:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        definition:
          $ref: '#/components/schemas/RoutingPolicyInput'
      required:
        - id
        - active_version
        - draft_version
        - base_version
        - etag
        - definition
      additionalProperties: false
    RoutingPolicyImpact:
      type: object
      properties:
        projects:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        keys:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
      required:
        - projects
        - keys
      additionalProperties: false
    RoutingPolicyInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scope:
          $ref: '#/components/schemas/RoutingPolicyScope'
        constraints:
          type: object
          properties:
            models:
              $ref: '#/components/schemas/RoutingPolicyListRule'
            regions:
              $ref: '#/components/schemas/RoutingPolicyListRule'
            retention:
              type: string
              enum:
                - inherit
                - strict_zero
            training:
              type: string
              enum:
                - inherit
                - prohibited
            max_input_rate:
              type: object
              properties:
                currency:
                  const: USD
                amount:
                  type: string
                unit:
                  const: input_token
                per:
                  const: '1000000'
              required:
                - currency
                - amount
                - unit
                - per
              additionalProperties: false
            required_capabilities:
              type: array
              items:
                type: string
            require_known_quota:
              type: boolean
          additionalProperties: false
        candidates:
          type: object
          properties:
            pool_ids:
              type: array
              items:
                type: string
            denied_provider_ids:
              type: array
              items:
                type: string
            allow_expansion:
              type: boolean
          additionalProperties: false
        preferences:
          type: object
          properties:
            template:
              type: string
              enum:
                - balanced
                - stable
                - low_latency
                - lowest_cost
            ordered_provider_ids:
              type: array
              items:
                type: string
          additionalProperties: false
        fallback:
          type: object
          properties:
            endpoint:
              type: boolean
            model_ids:
              type: array
              items:
                type: string
            byok_to_platform:
              type: boolean
          additionalProperties: false
      required:
        - name
        - scope
      additionalProperties: false
    RoutingPolicyListRule:
      oneOf:
        - type: object
          properties:
            mode:
              type: string
              enum:
                - inherit
                - deny_all
            values:
              type: array
              items:
                type: string
              maxItems: 0
          required:
            - mode
          additionalProperties: false
        - type: object
          properties:
            mode:
              type: string
              enum:
                - allow_list
            values:
              type: array
              items:
                type: string
              minItems: 1
              maxItems: 256
              uniqueItems: true
          required:
            - mode
            - values
          additionalProperties: false
    RoutingPolicyPublication:
      type: object
      properties:
        id:
          type: string
          format: uuid
        active_version:
          type: string
          format: uuid
        previous_version:
          type: string
        published_at:
          type: string
          format: date-time
        impact:
          $ref: '#/components/schemas/RoutingPolicyImpact'
        revocation_epoch:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
      required:
        - id
        - active_version
        - previous_version
        - published_at
        - impact
        - revocation_epoch
      additionalProperties: false
    RoutingPolicyPublish:
      type: object
      properties:
        draft_version:
          type: string
          format: uuid
        base_version:
          type: string
        simulation_id:
          type: string
        change_note:
          type: string
      required:
        - draft_version
        - base_version
        - simulation_id
        - change_note
      additionalProperties: false
    RoutingPolicyRollback:
      type: object
      properties:
        from_version:
          type: string
          format: uuid
        restore_version:
          type: string
          format: uuid
        change_note:
          type: string
      required:
        - from_version
        - restore_version
        - change_note
      additionalProperties: false
    RoutingPolicyScope:
      type: object
      properties:
        type:
          type: string
          enum:
            - workspace
            - project
            - api_key
        id:
          $ref: '#/components/schemas/IdentityID'
        project_id:
          $ref: '#/components/schemas/IdentityID'
      required:
        - type
        - id
      additionalProperties: false
    RoutingPolicySimulation:
      type: object
      properties:
        simulation_id:
          type: string
        trace:
          $ref: '#/components/schemas/RoutingDecisionTrace'
        baseline:
          anyOf:
            - $ref: '#/components/schemas/RoutingDecisionTrace'
            - type: 'null'
        diff:
          anyOf:
            - $ref: '#/components/schemas/RoutingPolicyDiff'
            - type: 'null'
        impact:
          $ref: '#/components/schemas/RoutingPolicyImpact'
        expires_at:
          type: string
          format: date-time
      required:
        - simulation_id
        - trace
        - baseline
        - diff
        - impact
        - expires_at
      additionalProperties: false
    RoutingPolicySimulationInput:
      type: object
      properties:
        version:
          type: string
          format: uuid
        compare_version:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        project_id:
          $ref: '#/components/schemas/IdentityID'
        api_key_id:
          anyOf:
            - $ref: '#/components/schemas/IdentityID'
            - type: 'null'
        model_id:
          type: string
        protocol:
          type: string
        action:
          type: string
        required_capabilities:
          type: array
          items:
            type: string
        input_token_bound:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        output_token_bound:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        snapshot_id:
          anyOf:
            - type: string
            - type: 'null'
        seed:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
      required:
        - version
        - project_id
        - model_id
        - protocol
        - action
        - input_token_bound
        - output_token_bound
        - seed
      additionalProperties: false
    RoutingPolicyVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        base_version:
          type: string
        actor_id:
          $ref: '#/components/schemas/IdentityID'
        published_at:
          type: string
          format: date-time
        change_note:
          type: string
      required:
        - id
        - base_version
        - actor_id
        - published_at
        - change_note
      additionalProperties: false
    ScopedAuditAction:
      type: string
      enum: [requests.export, tasks.artifacts.revoke, billing.adjust, billing.reconcile, audit.retention.set, audit.retention.purge, audit.export, scope.read, scope.write]
    ScopedAuditEvent:
      type: object
      additionalProperties: false
      required: [audit_event_id, workspace_id, project_id, actor_id, resource, resource_id, action, effect, at]
      properties:
        audit_event_id: {$ref: '#/components/schemas/IdentityID'}
