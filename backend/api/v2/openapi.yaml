          oneOf:
            - $ref: '#/components/schemas/RoutingDecisionTrace'
            - type: 'null'
        data_completeness: {$ref: '#/components/schemas/RequestsCompleteness'}
    RequestsSettlementState:
      type: string
      enum: [estimated, reserved, pending, settled, needs_review, adjusted, refunded, unknown]
    RequestsSummary:
      type: object
      required: [id, started_at, start_source, requested_model, protocol, outcome, reason, settlement_state, charged_amount, attempt_count, detail_url, redactions]
      properties:
        id: {type: string}
        started_at: {type: string, format: date-time}
        start_source: {type: string, enum: [admission, legacy_observation]}
        requested_model: {type: [string, 'null']}
        protocol:
          oneOf:
            - $ref: '#/components/schemas/RequestsProtocol'
            - type: 'null'
