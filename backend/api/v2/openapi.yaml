    ScopedAuditRetention:
      type: object
      additionalProperties: false
      required: [event_days, trace_days, content_hours]
      properties:
        event_days: {type: integer, minimum: 1, maximum: 3650, default: 90}
        trace_days: {type: integer, minimum: 1, maximum: 3650, default: 7}
        content_hours: {type: integer, minimum: 0, maximum: 24, default: 24}
    StatusAffectedComponents:
      type: array
      minItems: 1
      maxItems: 6
      uniqueItems: true
      items: {$ref: '#/components/schemas/StatusComponentID'}
    StatusComponent:
      type: object
      additionalProperties: false
      required: [id, name, state, observed_state, reason, source, freshness, sample_count, minimum_sample_count, last_success, stale_after, success_rate, ttft_sample_count, ttft_p50_ms, ttft_p95_ms, stream_completion_rate, counts, history]
      properties:
        id: {$ref: '#/components/schemas/StatusComponentID'}
        name: {type: string}
        state: {$ref: '#/components/schemas/StatusState'}
        observed_state: {$ref: '#/components/schemas/StatusState'}
        reason: {$ref: '#/components/schemas/StatusReason'}
        source: {type: string, enum: [gateway_observations, unavailable]}
        freshness: {type: string, enum: [fresh, stale, unknown]}
        stale_after: {type: [string, 'null'], format: date-time}
        last_success: {type: [string, 'null'], format: date-time}
        sample_count: {$ref: '#/components/schemas/StatusCount'}
        minimum_sample_count: {$ref: '#/components/schemas/StatusCount'}
        success_rate: {$ref: '#/components/schemas/StatusPercent'}
        ttft_sample_count: {$ref: '#/components/schemas/StatusCount'}
        ttft_p50_ms: {type: [integer, 'null'], minimum: 0}
        ttft_p95_ms: {type: [integer, 'null'], minimum: 0}
        stream_completion_rate: {$ref: '#/components/schemas/StatusPercent'}
        counts: {$ref: '#/components/schemas/StatusCounts'}
        history: {type: array, minItems: 90, maxItems: 90, items: {$ref: '#/components/schemas/StatusDaily'}}
    StatusComponentID:
      type: string
      enum: [inference, openai_compatible, anthropic_compatible, gemini_compatible, console_auth, async_workers]
    StatusCount:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
    StatusCounts:
      type: object
      additionalProperties: false
      required: [succeeded, gateway_errors, upstream_errors, upstream_rate_limits, stream_interruptions, unknown_outcomes, admission_denials, client_cancellations, attempts, first_byte_timeouts, stream_samples, stream_succeeded]
      properties:
        succeeded: {$ref: '#/components/schemas/StatusCount'}
        gateway_errors: {$ref: '#/components/schemas/StatusCount'}
        upstream_errors: {$ref: '#/components/schemas/StatusCount'}
        upstream_rate_limits: {$ref: '#/components/schemas/StatusCount'}
        stream_interruptions: {$ref: '#/components/schemas/StatusCount'}
        unknown_outcomes: {$ref: '#/components/schemas/StatusCount'}
        admission_denials: {$ref: '#/components/schemas/StatusCount'}
        client_cancellations: {$ref: '#/components/schemas/StatusCount'}
        attempts: {$ref: '#/components/schemas/StatusCount'}
        first_byte_timeouts: {$ref: '#/components/schemas/StatusCount'}
        stream_samples: {$ref: '#/components/schemas/StatusCount'}
        stream_succeeded: {$ref: '#/components/schemas/StatusCount'}
    StatusDaily:
      type: object
      additionalProperties: false
      required: [date, state, reason, sample_count, success_rate]
      properties:
        date: {type: string, format: date}
        state: {$ref: '#/components/schemas/StatusState'}
        reason: {$ref: '#/components/schemas/StatusReason'}
        sample_count: {$ref: '#/components/schemas/StatusCount'}
        success_rate: {$ref: '#/components/schemas/StatusPercent'}
    StatusDefinitions:
      type: object
      additionalProperties: false
      required: [success_rate, stream_completion_rate, ttft, excluded_categories, reported_categories, attempts_counted_separately, aggregation_interval_seconds, publication_delay_seconds]
      properties:
        success_rate: {type: string}
        stream_completion_rate: {type: string}
        ttft: {type: string}
        excluded_categories: {type: array, items: {type: string}}
        reported_categories: {type: array, items: {type: string}}
        attempts_counted_separately: {const: true}
        aggregation_interval_seconds: {type: integer}
        publication_delay_seconds: {type: integer}
    StatusIncident:
      allOf:
        - $ref: '#/components/schemas/StatusIncidentSummary'
        - type: object
          required: [updates]
          properties:
            updates:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [at, state, message]
                properties:
                  at: {type: string, format: date-time}
                  state: {$ref: '#/components/schemas/StatusIncidentState'}
                  message: {$ref: '#/components/schemas/StatusMessage'}
    StatusIncidentState:
      type: string
      enum: [investigating, identified, monitoring, resolved]
    StatusIncidentSummary:
      type: object
      required: [id, title, state, severity, component_ids, started_at, resolved_at]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        state: {$ref: '#/components/schemas/StatusIncidentState'}
        severity: {$ref: '#/components/schemas/StatusSeverity'}
        component_ids: {$ref: '#/components/schemas/StatusAffectedComponents'}
        started_at: {type: string, format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
    StatusMessage:
      type: string
      minLength: 1
      maxLength: 2000
    StatusPercent:
      type: [number, 'null']
      minimum: 0
      maximum: 100
    StatusReason:
      type: [string, 'null']
      enum: [INSUFFICIENT_SAMPLES, STALE_DATA, SOURCE_UNAVAILABLE, ROLLUP_PENDING, OUTCOME_UNKNOWN, null]
    StatusSeverity:
      type: string
      enum: [degraded, outage, maintenance]
    StatusState:
      type: string
      enum: [operational, degraded, outage, maintenance, unknown]
    StatusSummary:
      type: object
      additionalProperties: false
      required: [as_of, window_start, window_end, data_lag_seconds, overall, components, incidents, active_incident_count, definitions]
      properties:
        as_of: {type: string, format: date-time}
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time}
        data_lag_seconds: {type: [integer, 'null'], minimum: 0}
        overall: {$ref: '#/components/schemas/StatusState'}
        components: {type: array, items: {$ref: '#/components/schemas/StatusComponent'}}
        incidents: {type: array, maxItems: 25, items: {$ref: '#/components/schemas/StatusIncidentSummary'}}
        active_incident_count: {$ref: '#/components/schemas/StatusCount'}
        definitions: {$ref: '#/components/schemas/StatusDefinitions'}
    TaskCenterCreate:
      oneOf:
        - {$ref: '#/components/schemas/ImageTaskCreate'}
        - {$ref: '#/components/schemas/AudioTaskCreate'}
        - {$ref: '#/components/schemas/VideoTaskCreate'}
    TaskCenterKind:
      type: string
      enum: [image, audio, video]
    VideoTaskCreate:
      type: object
      description: Wan 2.6 text-to-video with one five-second 720p MP4 up to 256 MiB. The native tariff uses reported duration and the admitted resolution. A verified queued job can request cancellation. Polling confirms its terminal state.
      additionalProperties: false
      required: [kind, model_id, api_key_id, input, funding_acknowledged]
      properties:
        kind: {const: video}
        model_id: {type: string, minLength: 1, maxLength: 255}
        api_key_id: {type: string, pattern: '^[1-9][0-9]*$'}
        funding_acknowledged: {const: true}
        input:
          type: object
          additionalProperties: false
          required: [prompt, format, size, duration_seconds]
          properties:
            prompt: {type: string, minLength: 1, maxLength: 8000}
            format: {const: mp4}
            size: {const: 1280x720}
            duration_seconds: {const: 5}
