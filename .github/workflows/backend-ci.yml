name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Feature branches are validated through their pull request; superseded PR
# runs are cancelled so the newest head gets runners first. Pushes to main/dev
# always run to completion.
concurrency:
  group: backend-ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Use Homebrew Bash 4+
        shell: bash
        run: |
          if ! bash -c 'test "${BASH_VERSINFO[0]:-0}" -ge 4'; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install bash
          fi
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deployment test dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Reject tracked process artifacts
        shell: bash
        run: |
          set -eu
          tracked_pi="$(git ls-files -- '.pi' ':(glob)**/.pi/**')" || exit $?
          if [ -n "$tracked_pi" ]; then
            printf '%s\n' '::error::Tracked .pi process artifacts detected' "$tracked_pi"
            exit 1
          fi
          printf '%s\n' 'No tracked .pi process artifacts'
      - name: Check deployment scripts
        run: make test-shell
      - name: Check quality-gate shell syntax
        shell: bash
        run: |
          bash -n scripts/quality-gate.sh
          bash -n scripts/independence-check.sh
          bash -n scripts/go-test-strict.sh
      - name: Strict Go test gate self-test
        shell: bash
        run: python3 scripts/test_go_test_strict.py --self-test
      - name: Model-capability release generation advances with manifest
        shell: bash
        run: |
          set -eu
          git fetch --no-tags --depth=1 origin '+refs/tags/v*:refs/tags/v*'
          previous_tag="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          git show "$previous_tag:backend/resources/model-capabilities/release-manifest.json" > "$RUNNER_TEMP/previous-manifest.json"
          cd backend/resources/model-capabilities/scripts
          python3 release.py --previous "$RUNNER_TEMP/previous-manifest.json"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The unit bulk-live suites assert PostgreSQL 17 and the exact fixture
        # DSN postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable.
        image: postgres:17
        env:
          POSTGRES_USER: omni_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: job_test
        ports:
          - 55480:5432
        options: >-
          --health-cmd "pg_isready -U omni_fixture -d job_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 56380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # Dedicated fixture topology consumed by IP_GROUP_DEDICATED_TESTS=1. The
      # suites hard-code 127.0.0.1:55439 (PostgreSQL) and 127.0.0.1:56389
      # (Redis), so they must never share the main unit services.
      postgres_ipgroup:
        image: postgres:17
        env:
          POSTGRES_USER: codex_test_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U codex_test_admin -d job_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis_ipgroup:
        image: redis:7-alpine
        ports:
          - 56389:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # Dedicated disposable PostgreSQL 16 container for TestPostgresInventoryAndCheckpoints
      # (which asserts server_version 16 while the main unit service runs PG 17).
      postgres_migration:
        image: postgres:16
        env:
          POSTGRES_USER: omni_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: job_test
        ports:
          - 55486:5432
        options: >-
          --health-cmd "pg_isready -U omni_fixture -d job_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '^1.27.4'
          check-latest: true
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27'
      - name: Build and vet
        working-directory: backend
        run: |
          go build ./...
          go vet ./...
      - name: Prepare disposable databases
        run: |
          set -eu
          # job_test already exists (POSTGRES_DB); add the per-suite databases
          # so no DSN-gated suite falls back to a skip.
          for db in stats_test billing_audit_test backup_data_test be09_journal_test fix3_batch_test model_access_test ops_billing_backlog_test scheduler_recovery_test scheduler_resources_test prompt_audit_test restoregate_test; do
            docker exec "${{ job.services.postgres.id }}" \
              createdb -U omni_fixture "$db"
          done
          # Rehearsal requires a different PostgreSQL system identifier.
          docker exec "${{ job.services.postgres_ipgroup.id }}" createdb -U codex_test_admin be09_rehearsal_test
          # backup_test exercises a real pg_dump/psql cycle against PostgreSQL
          # 17; the distro client (16) refuses to dump a newer server.
          sudo apt-get update -qq
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
      - name: Migrate unit databases
        working-directory: backend
        run: |
          set -eu
          # Bootstrap the canonical migration runner once per fixture database.
          # Unit suites that use the external-service mode do not apply
          # migrations themselves, so job_test must already be schema-complete.
          go build -o /tmp/omnihive-migrate ./cmd/server
          migrate() {
            local port="$1" user="$2" password="$3" server_port="$4"
            local data
            data="$(mktemp -d)"
            AUTO_SETUP=true \
              OMNIHIVE_DATA_DIR="$data" \
              CONFIG_FILE="$data/config.yaml" \
              DATABASE_HOST=127.0.0.1 DATABASE_PORT="$port" DATABASE_USER="$user" \
              DATABASE_PASSWORD="$password" DATABASE_DBNAME=job_test DATABASE_SSLMODE=disable \
              REDIS_HOST=127.0.0.1 REDIS_PORT=56380 REDIS_DB=0 \
              ADMIN_EMAIL="ci-$user@example.invalid" ADMIN_PASSWORD="ci-disposable-password" \
              JWT_SECRET="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
              SERVER_HOST=127.0.0.1 SERVER_PORT="$server_port" SERVER_MODE=release TZ=UTC \
              /tmp/omnihive-migrate >"$data/omnihive.log" 2>&1 &
            local pid=$!
            for _ in $(seq 1 240); do
              [[ -f "$data/.installed" ]] && break
              kill -0 "$pid" >/dev/null 2>&1 || break
              sleep 0.5
            done
            kill "$pid" >/dev/null 2>&1 || true
            wait "$pid" >/dev/null 2>&1 || true
            if [[ ! -f "$data/.installed" ]]; then
              cat "$data/omnihive.log" >&2
              return 1
            fi
          }
          migrate 55480 omni_fixture "" 18093
          migrate 55439 codex_test_admin "postgres" 18094
      - name: Unit tests (skip-is-fail)
        working-directory: backend
        env:
          GO_TEST_STRICT_PROFILE: unit
          # Every DSN below points at a disposable database in this job, so a
          # missing connection is a configuration bug rather than an acceptable
          # skip. External-service mode stays off so suites such as the quota
          # event consumer apply migrations to their own disposable schema
          # instead of requiring a globally empty table.
          # Bulk-live suites assert these exact fixture values.
          SUB2API_BULK_LIVE: "1"
          UPSTREAM_JOB_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          NEW_PLATFORMS_TEST_POSTGRES_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          CATALOG_SCOPE_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          CATALOG_EVENT_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          WORKSPACE_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          CREDENTIAL_DRAFT_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          CREDENTIAL_SECRET_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          ACCOUNT_EXTRA_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          ACCOUNT_WORKFLOW_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          HOSTED_IDENTITY_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          USER_BILLING_TIMELINE_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          API_KEY_CREDENTIAL_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          OPENCODE_QUOTA_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          CURSOR_TEST_POSTGRES_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          CURSOR_MONITOR_TEST_POSTGRES_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          COMPATIBLE_PROVIDER_TEST_POSTGRES_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          PROMPT_AUDIT_TEST_POSTGRES_DSN: postgres://omni_fixture@127.0.0.1:55480/prompt_audit_test?sslmode=disable
          QUOTES_POSTGRES_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          BE09_TEST_ISOLATED_DSN: postgres://codex_test_admin:postgres@127.0.0.1:55439/be09_rehearsal_test?sslmode=disable
          BE09_TEST_JOURNAL_DSN: postgres://omni_fixture@127.0.0.1:55480/be09_journal_test?sslmode=disable
          MIGRATION_INTEGRATION_TEST_DSN: postgres://omni_fixture@127.0.0.1:55486/job_test?sslmode=disable
          RETIREMENT_INTEGRATION_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          USAGE_STATS_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/stats_test?sslmode=disable
          UPSTREAM_BILLING_AUDIT_DSN: postgres://omni_fixture@127.0.0.1:55480/billing_audit_test?sslmode=disable
          BACKUP_DATA_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/backup_data_test?sslmode=disable
          BATCH_SUBMIT_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/fix3_batch_test?sslmode=disable
          MODEL_ACCESS_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/model_access_test?sslmode=disable
          OPS_BILLING_BACKLOG_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/ops_billing_backlog_test
          SCHEDULER_RECOVERY_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/scheduler_recovery_test?sslmode=disable
          SCHEDULER_RESOURCES_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/scheduler_resources_test?sslmode=disable
          AFFINITY_REDIS_TEST_ADDR: 127.0.0.1:56380
          ACCOUNTING_TEST_REDIS_ADDR: 127.0.0.1:56380
          QUOTA_TEST_REDIS_ADDR: 127.0.0.1:56380
          SECURITY_REDIS_TEST_ADDR: 127.0.0.1:56380
          PROMPT_AUDIT_TEST_REDIS_ADDR: 127.0.0.1:56380
          SCHEDULER_RESOURCES_REDIS_ADDR: 127.0.0.1:56380
          CURSOR_TEST_REDIS_ADDR: 127.0.0.1:56380
          QUOTES_REDIS_ADDR: 127.0.0.1:56380
          TEST_REDIS_URL: redis://127.0.0.1:56380/0
          IP_GROUP_DEDICATED_TESTS: "1"
          IP_GROUP_TEST_PASSWORD: postgres
        run: make test-unit
      - name: Integration tests (skip-is-fail)
        working-directory: backend
        env:
          GO_TEST_STRICT_PROFILE: integration
          # Managed disposable mode: the suites that create throwaway databases
          # (migrations, cursor/legacy monitor upgrade, qianwen receipts) must
          # actually run, so external-service mode is deliberately NOT enabled.
          UPSTREAM_JOB_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          NEW_PLATFORMS_TEST_POSTGRES_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          USAGE_STATS_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/stats_test?sslmode=disable
          CATALOG_SCOPE_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          CATALOG_EVENT_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          WORKSPACE_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          CREDENTIAL_DRAFT_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          MCP_GRANT_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          CREDENTIAL_SECRET_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          ACCOUNT_EXTRA_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          ACCOUNT_WORKFLOW_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          HOSTED_IDENTITY_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          USER_BILLING_TIMELINE_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          API_KEY_CREDENTIAL_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          OPENCODE_QUOTA_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          CURSOR_TEST_POSTGRES_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          CURSOR_MONITOR_TEST_POSTGRES_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          COMPATIBLE_PROVIDER_TEST_POSTGRES_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          PROMPT_AUDIT_TEST_POSTGRES_DSN: postgres://omni_fixture@127.0.0.1:55480/prompt_audit_test?sslmode=disable
          QUOTES_POSTGRES_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          BE09_TEST_ISOLATED_DSN: postgres://codex_test_admin:postgres@127.0.0.1:55439/be09_rehearsal_test?sslmode=disable
          BE09_TEST_JOURNAL_DSN: postgres://omni_fixture@127.0.0.1:55480/be09_journal_test?sslmode=disable
          # Never migrated: exercises the first-boot path before the journal schema exists.
          RESTOREGATE_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/restoregate_test?sslmode=disable
          BE6_SETTING_MIGRATION_DSN: postgres://omni_fixture@127.0.0.1:55486/job_test?sslmode=disable
          MIGRATION_INTEGRATION_TEST_DSN: postgres://omni_fixture@127.0.0.1:55486/job_test?sslmode=disable
          RETIREMENT_INTEGRATION_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/job_test?sslmode=disable
          UPSTREAM_BILLING_AUDIT_DSN: postgres://omni_fixture@127.0.0.1:55480/billing_audit_test?sslmode=disable
          BACKUP_DATA_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/backup_data_test?sslmode=disable
          BATCH_SUBMIT_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/fix3_batch_test?sslmode=disable
          MODEL_ACCESS_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/model_access_test?sslmode=disable
          OPS_BILLING_BACKLOG_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/ops_billing_backlog_test
          SCHEDULER_RECOVERY_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/scheduler_recovery_test?sslmode=disable
          SCHEDULER_RESOURCES_TEST_DSN: postgres://omni_fixture@127.0.0.1:55480/scheduler_resources_test?sslmode=disable
          AFFINITY_REDIS_TEST_ADDR: 127.0.0.1:56380
          ACCOUNTING_TEST_REDIS_ADDR: 127.0.0.1:56380
          QUOTA_TEST_REDIS_ADDR: 127.0.0.1:56380
          SECURITY_REDIS_TEST_ADDR: 127.0.0.1:56380
          PROMPT_AUDIT_TEST_REDIS_ADDR: 127.0.0.1:56380
          SCHEDULER_RESOURCES_REDIS_ADDR: 127.0.0.1:56380
          CURSOR_TEST_REDIS_ADDR: 127.0.0.1:56380
          QUOTES_REDIS_ADDR: 127.0.0.1:56380
          TEST_REDIS_URL: redis://127.0.0.1:56380/0
        # Integration packages share the disposable job_test database. Serialize
        # packages, then reset the two state-sensitive suites exactly as the
        # local quality gate does before running them.
        run: |
          set -e
          reset_db() {
            for db in job_test stats_test billing_audit_test backup_data_test be09_journal_test model_access_test ops_billing_backlog_test scheduler_recovery_test scheduler_resources_test prompt_audit_test; do
              docker exec "${{ job.services.postgres.id }}" psql -U omni_fixture -d template1 -v ON_ERROR_STOP=1 \
                -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='${db}' AND pid<>pg_backend_pid()" >/dev/null
              docker exec "${{ job.services.postgres.id }}" dropdb -U omni_fixture --if-exists "$db"
              docker exec "${{ job.services.postgres.id }}" createdb -U omni_fixture "$db"
            done
            docker exec "${{ job.services.redis.id }}" redis-cli FLUSHALL >/dev/null
          }
          reset_db
          packages=$(go list -tags=integration ./... | grep -vE '/(internal/control/status|internal/repository)$')
          ../scripts/go-test-strict.sh -p 1 -mod=readonly -tags=integration -count=1 $packages
          reset_db
          ../scripts/go-test-strict.sh -p 1 -mod=readonly -tags=integration -count=1 ./internal/control/status
          reset_db
          ../scripts/go-test-strict.sh -p 1 -mod=readonly -tags=integration -count=1 ./internal/repository

  postgres:
    name: PostgreSQL ${{ matrix.postgres }} / ${{ matrix.test-case.test }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [18, 16, 15]
        test-case:
          - test: TestUpstreamJobPostgres
            package: ./internal/repository
            tag: unit
            required-subtests: concurrent_submit_poll_settle_restart,failure_replay_expiry_and_unsupported,rollback_usage_balance_and_anchor_together,poll_backoff_and_crashed_claim_expiry,frozen_pricing_survives_database_reload
          - test: TestNewPlatformMigrations
            package: ./migrations
            tag: integration
            required-subtests: fresh=false,fresh=true
          # These use the existing repository Testcontainers harness (PG + Redis).
          - test: TestGroupConfigurationOutboxAtomicity
            package: ./internal/repository
            tag: integration
            required-subtests: create_failure_rolls_back_group_and_notification,update_failure_preserves_persisted_configuration
          - test: TestGroupConfigurationOutboxCallerTransaction
            package: ./internal/repository
            tag: integration
            required-subtests: commit=false,commit=true
          - test: TestQianwenRealtimeReceiptPostgres
            package: ./internal/repository
            tag: integration
            required-subtests: first_commit_restart_concurrent_duplicate_and_conflicts,concurrent_first_insert_charges_once,insert_failure_leaves_no_empty_receipt,billing_failure_keeps_receipt_for_restart
          - test: TestLegacyMonitorUpgradeChain
            package: ./internal/repository
            tag: integration
            required-subtests: fresh,237,239,240,243,244,248,253
          - test: TestLegacyMonitorAppliedChecksums
            package: ./internal/repository
            tag: integration
            required-subtests: applied_240_crlf_false,applied_240_crlf_true,applied_243_crlf_false,applied_243_crlf_true,applied_244_crlf_false,applied_244_crlf_true,applied_248_crlf_false,applied_248_crlf_true,applied_253_crlf_false,applied_253_crlf_true
          - test: TestLegacyMonitorChecksumDrift
            package: ./internal/repository
            tag: integration
            required-subtests: 240_channel_monitor_provider_capabilities.sql,243_channel_monitor_qianwen_commandcode.sql,244_channel_monitor_minimax_opencode.sql
          - test: TestLegacyMonitorUnknownAppliedChecksum
            package: ./internal/repository
            tag: integration
            required-subtests: 240_channel_monitor_provider_capabilities.sql,243_channel_monitor_qianwen_commandcode.sql,244_channel_monitor_minimax_opencode.sql
          - test: TestLegacyUpgradeDDLMeasurement
            package: ./internal/repository
            tag: integration
            required-subtests: ""
          - test: TestUsageSettlementReceiptPostgres
            package: ./internal/repository
            tag: unit
            required-subtests: same_identity_20,same_identity_32,log_insert_rolls_back_all_effects,balance_update_rolls_back_all_effects,commit_rolls_back_all_effects,derived_event_failure_rolls_back,concurrent_different_fingerprints_conflict,archived_different_fingerprint_conflicts,existing_canonical_log_conflict_rolls_back_claim,archived_identity_is_never_charged_again,free_and_unpriced_remain_distinct,pending_recovery_uses_frozen_input,committed_response_lost_query_original_identity,finance_worker_stopped_drop_sample_and_restart,finance_worker_stopped_drop_sample_and_restart/drop,finance_worker_stopped_drop_sample_and_restart/sample,finance_worker_stopped_drop_sample_and_restart/sync,finance_worker_stopped_drop_sample_and_restart/stopped,finance_persist_ack_lost_and_settlement_ack_lost,finance_rebuild_after_receipt_before_worker,finance_persistence_failure_is_visible_without_free_log,finance_legacy_dedup_repair_never_charges_again,finance_legacy_zero_requires_binding_and_original_evidence,finance_quota_provider_emits_once
          - test: TestAccountConfigurationPostgres
            package: ./internal/repository
            tag: unit
            required-subtests: stale_edit_preserves_usage_windows_and_managed_limits,manual_bulk_token_rotation_invalidates_stable_subject,same_baseline_first_commit_wins_and_preserves_aliases,rule_edits_conflict_with_pending_discovery,failed_outbox_rolls_back_before_cache_refresh
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d job_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '^1.27.4'
          check-latest: true
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Run required PostgreSQL test
        working-directory: backend
        env:
          UPSTREAM_JOB_TEST_DSN: postgres://postgres:postgres@localhost:5432/job_test?sslmode=disable
          NEW_PLATFORMS_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          OMNIHIVE_TEST_POSTGRES_IMAGE: postgres:${{ matrix.postgres }}
          REQUIRED_TEST: ${{ matrix.test-case.test }}
          TEST_PACKAGE: ${{ matrix.test-case.package }}
          TEST_TAG: ${{ matrix.test-case.tag }}
        shell: bash
        run: |
          set -o pipefail
          go test -mod=readonly -tags="$TEST_TAG" -json "$TEST_PACKAGE" -run "^${REQUIRED_TEST}$" -count=1 | tee postgres-test.json
      - name: Require actual PostgreSQL test passes
        if: always()
        working-directory: backend
        env:
          REQUIRED_TEST: ${{ matrix.test-case.test }}
          REQUIRED_SUBTESTS: ${{ matrix.test-case.required-subtests }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          required_test = os.environ["REQUIRED_TEST"]
          required = {required_test} | {
              f"{required_test}/{subtest}"
              for subtest in os.environ["REQUIRED_SUBTESTS"].split(",")
              if subtest
          }
          events = [json.loads(line) for line in Path("postgres-test.json").read_text().splitlines()]
          passed = set()
          started = set()
          for event in events:
              name = event.get("Test", "")
              if name != required_test and not name.startswith(required_test + "/"):
                  continue
              action = event["Action"]
              if action in {"skip", "fail"}:
                  raise SystemExit(f"Required PostgreSQL test {action}: {name}")
              if action == "run":
                  started.add(name)
              if action == "pass":
                  passed.add(name)
          missing = (required | started) - (started & passed)
          if missing:
              raise SystemExit(f"Missing executed PASS events: {sorted(missing)}")
          print(f"Verified executed PASS events: {sorted(passed)}")
          PY

  required-round:
    name: Required round PG${{ matrix.services.postgres }}/Redis${{ matrix.services.redis }} / ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [usage-coverage, catalog, affinity]
        services:
          - postgres: 18
            redis: 8
          - postgres: 16
            redis: 7
          - postgres: 15
            redis: 7
    services:
      postgres:
        image: postgres:${{ matrix.services.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stats_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:${{ matrix.services.redis }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '^1.27.4'
          check-latest: true
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Create catalog test database
        if: matrix.gate == 'catalog'
        run: docker exec "${{ job.services.postgres.id }}" createdb -U postgres job_test
      - name: Run required round tests (no skips)
        env:
          # Job-local disposable services, never a shared database or Redis.
          USAGE_STATS_TEST_DSN: postgres://postgres:postgres@localhost:5432/stats_test?sslmode=disable
          UPSTREAM_JOB_TEST_DSN: postgres://postgres:postgres@localhost:5432/job_test?sslmode=disable
          CATALOG_SCOPE_TEST_DSN: postgres://postgres:postgres@localhost:5432/job_test?sslmode=disable
          AFFINITY_REDIS_TEST_ADDR: localhost:6379
        run: make test-required-${{ matrix.gate }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      # The full vitest suite includes the platform contract spec, which shells out to
      # `go test` (execFileSync in
      # frontend/src/components/account/__tests__/LatePlatformProtocolAlignment.spec.ts).
      # Without this the job depends on whatever Go the runner image happens to ship,
      # while backend/go.mod requires a specific version.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '^1.27.4'
          check-latest: true
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Warm Go modules for frontend contract tests
        working-directory: backend
        run: go mod download
      - name: Pre-warm Go test build cache for contract specs
        working-directory: backend
        run: go test -run '^$' ./internal/domain ./internal/service
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend static checks
        run: make test-frontend-check
      - name: Full frontend regression suite and coverage
        working-directory: frontend
        run: pnpm run test:coverage
      - name: Production frontend build
        working-directory: frontend
        run: pnpm run build

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=30m
          working-directory: backend

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '^1.27.4'
          check-latest: true
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # The six quality-gate stages are covered across CI without duplicating
      # multi-minute suites in one job:
      #   backend         -> `test` job (build, vet, strict unit + integration)
      #   frontend        -> `frontend` job (lint, typecheck, i18n, vitest, build)
      #   contracts       -> this job
      #   generated-drift -> this job
      #   independence    -> this job
      #   smoke           -> `smoke` job below
      - name: Stage inventory
        run: |
          set -eu
          expected="frontend backend contracts generated-drift independence smoke"
          actual="$(scripts/quality-gate.sh --list | tr '\n' ' ' | sed 's/ $//')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::quality-gate stage inventory drifted: expected '$expected', got '$actual'"
            exit 1
          fi
          echo "quality-gate stages: $actual"
      - name: Protocol contracts, generated drift and independence
        run: scripts/quality-gate.sh contracts generated-drift independence

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '^1.27.4'
          check-latest: true
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Strict gate self-test
        run: python3 scripts/test_go_test_strict.py --self-test
      # Golden E2E fixtures: no BASE_URL, provider key or database. They prove
      # that E2E failures fail instead of skipping and that the registration /
      # login / API-key client contract matches the gateway shape.
      - name: E2E golden fixtures (skip-is-fail)
        working-directory: backend
        env:
          GO_TEST_STRICT_PROFILE: e2e
        run: make test-e2e

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '^1.27.4'
          check-latest: true
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # Runs the sixth quality-gate stage in CI: private PostgreSQL/Redis,
      # embedded production binary, auto bootstrap and every contracts smoke
      # script. Catalog/restore script-level SKIPs still require fixtures; they
      # are reported, not silently treated as Go test skips.
      - name: Smoke stage
        run: scripts/quality-gate.sh smoke
