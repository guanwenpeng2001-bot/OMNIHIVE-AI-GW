name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  postgres:
    name: PostgreSQL / ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: TestUpstreamJobPostgres
            package: ./internal/repository
            tag: unit
            required-subtests: concurrent_submit_poll_settle_restart,failure_replay_expiry_and_unsupported,rollback_usage_balance_and_anchor_together,poll_backoff_and_crashed_claim_expiry,frozen_pricing_survives_database_reload
          - test: TestNewPlatformMigrations
            package: ./migrations
            tag: integration
            required-subtests: fresh=false,fresh=true
          # These use the existing repository Testcontainers harness (PG + Redis).
          - test: TestGroupConfigurationOutboxAtomicity
            package: ./internal/repository
            tag: integration
            required-subtests: create_failure_rolls_back_group_and_notification,update_failure_preserves_persisted_configuration
          - test: TestGroupConfigurationOutboxCallerTransaction
            package: ./internal/repository
            tag: integration
            required-subtests: commit=false,commit=true
          - test: TestQianwenRealtimeReceiptPostgres
            package: ./internal/repository
            tag: integration
            required-subtests: first_commit_restart_concurrent_duplicate_and_conflicts,concurrent_first_insert_charges_once,insert_failure_leaves_no_empty_receipt,billing_failure_keeps_receipt_for_restart
          - test: TestLegacyMonitorUpgradeChain
            package: ./internal/repository
            tag: integration
            required-subtests: fresh,237,239,240,243,244,248,253
          - test: TestLegacyMonitorAppliedChecksums
            package: ./internal/repository
            tag: integration
            required-subtests: applied_240_crlf_false,applied_240_crlf_true,applied_243_crlf_false,applied_243_crlf_true,applied_244_crlf_false,applied_244_crlf_true,applied_248_crlf_false,applied_248_crlf_true,applied_253_crlf_false,applied_253_crlf_true
          - test: TestLegacyMonitorChecksumDrift
            package: ./internal/repository
            tag: integration
            required-subtests: 240_channel_monitor_provider_capabilities.sql,243_channel_monitor_qianwen_commandcode.sql,244_channel_monitor_minimax_opencode.sql
          - test: TestLegacyMonitorUnknownAppliedChecksum
            package: ./internal/repository
            tag: integration
            required-subtests: 240_channel_monitor_provider_capabilities.sql,243_channel_monitor_qianwen_commandcode.sql,244_channel_monitor_minimax_opencode.sql
          - test: TestLegacyUpgradeDDLMeasurement
            package: ./internal/repository
            tag: integration
            required-subtests: ""
          - test: TestUsageSettlementReceiptPostgres
            package: ./internal/repository
            tag: unit
            required-subtests: same_identity_20,same_identity_32,log_insert_rolls_back_all_effects,balance_update_rolls_back_all_effects,commit_rolls_back_all_effects,derived_event_failure_rolls_back,concurrent_different_fingerprints_conflict,archived_different_fingerprint_conflicts,existing_canonical_log_conflict_rolls_back_claim,archived_identity_is_never_charged_again,free_and_unpriced_remain_distinct,pending_recovery_uses_frozen_input,committed_response_lost_query_original_identity,finance_worker_stopped_drop_sample_and_restart,finance_worker_stopped_drop_sample_and_restart/drop,finance_worker_stopped_drop_sample_and_restart/sample,finance_worker_stopped_drop_sample_and_restart/sync,finance_worker_stopped_drop_sample_and_restart/stopped,finance_persist_ack_lost_and_settlement_ack_lost,finance_rebuild_after_receipt_before_worker,finance_persistence_failure_is_visible_without_free_log,finance_legacy_dedup_repair_never_charges_again,finance_legacy_zero_requires_binding_and_original_evidence,finance_quota_provider_emits_once
          - test: TestAccountConfigurationPostgres
            package: ./internal/repository
            tag: unit
            required-subtests: stale_edit_preserves_usage_windows_and_managed_limits,discovery_and_key_rotation_merge_only_changed_fields,explicit_null_mapping_is_treated_as_empty,failed_outbox_rolls_back_before_cache_refresh
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d job_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Run required PostgreSQL test
        working-directory: backend
        env:
          UPSTREAM_JOB_TEST_DSN: postgres://postgres:postgres@localhost:5432/job_test?sslmode=disable
          NEW_PLATFORMS_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          REQUIRED_TEST: ${{ matrix.test }}
          TEST_PACKAGE: ${{ matrix.package }}
          TEST_TAG: ${{ matrix.tag }}
        shell: bash
        run: |
          set -o pipefail
          go test -mod=readonly -tags="$TEST_TAG" -json "$TEST_PACKAGE" -run "^${REQUIRED_TEST}$" -count=1 | tee postgres-test.json
      - name: Require actual PostgreSQL test passes
        if: always()
        working-directory: backend
        env:
          REQUIRED_TEST: ${{ matrix.test }}
          REQUIRED_SUBTESTS: ${{ matrix.required-subtests }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          required_test = os.environ["REQUIRED_TEST"]
          required = {required_test} | {
              f"{required_test}/{subtest}"
              for subtest in os.environ["REQUIRED_SUBTESTS"].split(",")
              if subtest
          }
          events = [json.loads(line) for line in Path("postgres-test.json").read_text().splitlines()]
          passed = set()
          started = set()
          for event in events:
              name = event.get("Test", "")
              if name != required_test and not name.startswith(required_test + "/"):
                  continue
              action = event["Action"]
              if action in {"skip", "fail"}:
                  raise SystemExit(f"Required PostgreSQL test {action}: {name}")
              if action == "run":
                  started.add(name)
              if action == "pass":
                  passed.add(name)
          missing = (required | started) - (started & passed)
          if missing:
              raise SystemExit(f"Missing executed PASS events: {sorted(missing)}")
          print(f"Verified executed PASS events: {sorted(passed)}")
          PY

  required-round:
    name: Required round / ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [usage-coverage, catalog, affinity]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stats_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Create catalog test database
        if: matrix.gate == 'catalog'
        run: docker exec "${{ job.services.postgres.id }}" createdb -U postgres job_test
      - name: Run required round tests (no skips)
        env:
          # Job-local disposable services, never a shared database or Redis.
          USAGE_STATS_TEST_DSN: postgres://postgres:postgres@localhost:5432/stats_test?sslmode=disable
          UPSTREAM_JOB_TEST_DSN: postgres://postgres:postgres@localhost:5432/job_test?sslmode=disable
          AFFINITY_REDIS_TEST_ADDR: localhost:6379
        run: make test-required-${{ matrix.gate }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      # The critical vitest list includes the platform contract spec, which shells out to
      # `go test` (execFileSync in frontend/src/constants/__tests__/platforms.spec.ts).
      # Without this the job depends on whatever Go the runner image happens to ship,
      # while backend/go.mod requires a specific version.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend
      - name: Full frontend regression suite
        working-directory: frontend
        run: pnpm run test:run

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # The fixed lint baseline must be available for the diff.
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m --new-from-rev=c51166151bbfda1e34b8d8b7ec77435a45648c24
          working-directory: backend
