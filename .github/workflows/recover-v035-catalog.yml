name: One-time v0.3.5 catalog recovery

on:
  push:
    branches:
      - fix/v0.3.5-unified-console-catalog
    paths:
      - .github/workflows/recover-v035-catalog.yml
      - scripts/recover-v035-catalog.py

permissions: {}

concurrency:
  group: omnihive-v035-catalog-recovery
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RECOVERY_BASE_SHA: "721fabea1d065e4036333925eb06161ee2035a11"
  RECOVERY_BRANCH: fix/v0.3.5-unified-console-catalog
  RECOVERY_HELPER_SHA256: b1e47596e8dd839df62e4a25d661bd25b4be3078ead22582b9f41dafaeacf4b1
  RECOVERY_EXPECTED_JSON: >-
    {"backend/resources/model-capabilities/catalog.json":"d1d0a7863c3ee941bd0ba6e3d2ec7320bbadc518f0af0c7bba979e89bba843cd",
    "backend/resources/model-capabilities/scripts/reviewed.json":"66359b1c389f70ae296ec8915946bb0ff0c384731e1e747a5b1566f1d75e60fd",
    "backend/resources/model-capabilities/scripts/preset-sources.json":"b27dc917f08806d5e58997931a3c6474ca5982910ecf8a76596c2698faf7efe4",
    "backend/internal/service/platform_model_presets.json":"da0303082c648147331fc2587bcc591cb2e009cf278ea7c887d2b308d5b06136"}
  PYTHONDONTWRITEBYTECODE: "1"
  TZ: UTC
  LC_ALL: C.UTF-8

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the approved recovery startup
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def git(*args):
              return subprocess.check_output(["git", *args]).decode().strip()

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          base = os.environ["RECOVERY_BASE_SHA"]
          head = os.environ["GITHUB_SHA"]
          branch = "refs/heads/" + os.environ["RECOVERY_BRANCH"]
          require(re.fullmatch(r"[0-9a-f]{40}", base) is not None, "replace the reviewed base SHA placeholder before starting")
          require(os.environ["GITHUB_EVENT_NAME"] == "push", "only the approved push event is accepted")
          require(os.environ["GITHUB_REPOSITORY"] == "guanwenpeng2001-bot/OMNIHIVE-AI-GW", "unexpected repository")
          require(event["repository"]["full_name"] == os.environ["GITHUB_REPOSITORY"], "event repository differs")
          require(os.environ["GITHUB_REF"] == branch and event["ref"] == branch, "unexpected recovery branch")
          require(not event.get("deleted") and not event.get("forced"), "deleted or forced pushes cannot start recovery")
          require(event["before"] == base and event["after"] == head, "recovery event does not follow the approved base")
          require(git("rev-parse", "HEAD") == head, "checkout differs from the triggering commit")
          require(git("rev-list", "--parents", "-n", "1", head).split() == [head, base], "startup must be a direct non-merge child of the approved base")
          allowed = {".github/workflows/recover-v035-catalog.yml", "scripts/recover-v035-catalog.py"}
          changed = set(git("diff", "--no-renames", "--name-only", base, head).splitlines())
          added = set(git("diff", "--no-renames", "--diff-filter=A", "--name-only", base, head).splitlines())
          require(changed == allowed and added == allowed, "startup may only add the reviewed workflow and helper")
          require(not git("status", "--porcelain", "--untracked-files=all"), "checkout is not clean")
          helper = Path("scripts/recover-v035-catalog.py")
          require(not helper.is_symlink() and hashlib.sha256(helper.read_bytes()).hexdigest() == os.environ["RECOVERY_HELPER_SHA256"], "recovery helper differs from the reviewed blob")
          for ref in ("94d8a70b39c46895cac3817f3b230fb5eabe2692", "e243ef275d0fec25ae1757a461ad2d9975238444"):
              subprocess.run(["git", "cat-file", "-e", ref + "^{commit}"], check=True)
          print("Approved startup verified:", head)
          PY
      - name: Reproduce only the four reviewed JSON files
        run: |
          set -euo pipefail
          python3 -B scripts/recover-v035-catalog.py --recover
      - name: Prepare and independently verify the artifact
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          expected = json.loads(os.environ["RECOVERY_EXPECTED_JSON"])
          changed = set(subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "HEAD"]).decode().splitlines())
          if changed != set(expected):
              raise SystemExit("generation changed files outside the exact four-file set")
          if subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"]).strip():
              raise SystemExit("generation created unexpected untracked files")
          root = Path.cwd().resolve()
          artifact = Path(os.environ["RUNNER_TEMP"]) / "v035-catalog-artifact"
          artifact.mkdir()
          for name, checksum in sorted(expected.items()):
              source = root / name
              if source.is_symlink() or not source.is_file() or not source.resolve().is_relative_to(root):
                  raise SystemExit("invalid generated file: " + name)
              if hashlib.sha256(source.read_bytes()).hexdigest() != checksum:
                  raise SystemExit("independent generated SHA256 mismatch: " + name)
              destination = artifact / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination)
          PY
          python3 -B scripts/recover-v035-catalog.py --verify-root "$RUNNER_TEMP/v035-catalog-artifact"
      - name: Preserve the verified four-file artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: v035-catalog-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v035-catalog-artifact/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Download only this run's verified artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: v035-catalog-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v035-catalog-artifact
      - name: Verify and copy the four files without regeneration
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import subprocess

          head = os.environ["GITHUB_SHA"]
          parents = subprocess.check_output(["git", "rev-list", "--parents", "-n", "1", "HEAD"]).decode().split()
          if parents != [head, os.environ["RECOVERY_BASE_SHA"]]:
              raise SystemExit("publisher checkout is not the approved startup commit")
          helper = Path("scripts/recover-v035-catalog.py")
          if helper.is_symlink() or hashlib.sha256(helper.read_bytes()).hexdigest() != os.environ["RECOVERY_HELPER_SHA256"]:
              raise SystemExit("publisher verification helper differs from the reviewed blob")
          if subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=all"]).strip():
              raise SystemExit("publisher checkout is not clean")
          PY
          python3 -B scripts/recover-v035-catalog.py --verify-root "$RUNNER_TEMP/v035-catalog-artifact"
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          root = Path.cwd().resolve()
          artifact = Path(os.environ["RUNNER_TEMP"]) / "v035-catalog-artifact"
          expected = json.loads(os.environ["RECOVERY_EXPECTED_JSON"])
          for name, checksum in sorted(expected.items()):
              source, destination = artifact / name, root / name
              tree_entry = subprocess.check_output(["git", "ls-tree", "HEAD", "--", name]).decode().split()
              if len(tree_entry) != 4 or tree_entry[0:2] != ["100644", "blob"] or tree_entry[3] != name:
                  raise SystemExit("target is not the expected tracked regular file: " + name)
              if source.is_symlink() or not source.is_file() or destination.is_symlink() or not destination.resolve().is_relative_to(root):
                  raise SystemExit("invalid artifact or target path: " + name)
              if hashlib.sha256(source.read_bytes()).hexdigest() != checksum:
                  raise SystemExit("independent artifact SHA256 mismatch: " + name)
              shutil.copyfile(source, destination)
          changed = set(subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "HEAD"]).decode().splitlines())
          if changed != set(expected):
              raise SystemExit("publisher changes differ from the exact four-file set")
          PY
      - name: Commit only the verified files and push with an exact head lease
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          expected = json.loads(os.environ["RECOVERY_EXPECTED_JSON"])
          head = os.environ["GITHUB_SHA"]
          if os.environ["GITHUB_REPOSITORY"] != "guanwenpeng2001-bot/OMNIHIVE-AI-GW" or os.environ["GITHUB_REF"] != "refs/heads/" + os.environ["RECOVERY_BRANCH"]:
              raise SystemExit("publisher repository or branch differs")
          if subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip() != head:
              raise SystemExit("publisher HEAD changed")
          if subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"]).strip():
              raise SystemExit("unexpected untracked publisher files")
          for name, checksum in sorted(expected.items()):
              file = Path(name)
              if file.is_symlink() or hashlib.sha256(file.read_bytes()).hexdigest() != checksum:
                  raise SystemExit("pre-commit SHA256 mismatch: " + name)
          subprocess.run(["git", "add", "--", *sorted(expected)], check=True)
          changes = subprocess.check_output(["git", "diff", "--cached", "--no-renames", "--name-status"]).decode().splitlines()
          if set(changes) != {"M\t" + name for name in expected}:
              raise SystemExit("staged changes differ from the exact four modified JSON files")
          subprocess.run(["git", "diff", "--exit-code"], check=True)
          for name, checksum in sorted(expected.items()):
              indexed = subprocess.check_output(["git", "show", ":" + name])
              if hashlib.sha256(indexed).hexdigest() != checksum:
                  raise SystemExit("index SHA256 mismatch: " + name)
          PY
          # The credential helper reads this step's token without storing it.
          # No repository generator or verifier runs while this token is in use.
          credential_helper='!f() { test "$1" = get || exit 0; printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f'
          origin="$(git remote get-url origin)"
          case "$origin" in
            https://github.com/guanwenpeng2001-bot/OMNIHIVE-AI-GW|https://github.com/guanwenpeng2001-bot/OMNIHIVE-AI-GW.git) ;;
            *) printf '%s\n' 'Unexpected push remote' >&2; exit 1 ;;
          esac
          remote_head="$(git -c credential.helper= -c "credential.helper=$credential_helper" ls-remote --exit-code origin "refs/heads/$RECOVERY_BRANCH" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "fix(catalog): restore the reviewed v0.3.5 catalog artifacts"
          new_head="$(git rev-parse HEAD)"
          test "$(git rev-list --parents -n 1 HEAD)" = "$new_head $GITHUB_SHA"
          # The exact lease is an atomic head check; HEAD is a direct child of C.
          # A moved branch fails. There is no retry, rebase, or bare force push.
          git -c credential.helper= -c "credential.helper=$credential_helper" push --porcelain --force-with-lease="refs/heads/$RECOVERY_BRANCH:$GITHUB_SHA" origin "HEAD:refs/heads/$RECOVERY_BRANCH"
          published_head="$(git -c credential.helper= -c "credential.helper=$credential_helper" ls-remote --exit-code origin "refs/heads/$RECOVERY_BRANCH" | cut -f1)"
          test "$published_head" = "$new_head"
          printf 'Recovered commit: %s\n' "$new_head"
          printf '%s\n' 'Root must inspect this commit, remove the one-time recovery files, and verify normal CI on the resulting head.'
