# Simplified release: x86_64 GHCR image and self-update assets.
version: 2

project_name: omnihive

# The global hooks run before GoReleaser checks that dist is empty.
before:
  hooks:
    - python3 scripts/release_compatibility.py --check
    - python3 scripts/release_compatibility.py --manifest {{ .Version }} {{ .Commit }} .cache/omnihive-release/omnihive-release-manifest.json

builds:
  - id: omnihive
    dir: backend
    main: ./cmd/server
    binary: omnihive
    flags:
      - -mod=readonly
      - -tags=embed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}
      - -X main.BuildType=release
  - id: omnihivectl
    dir: backend
    main: ./cmd/omnihivectl/refactor/standalone
    binary: omnihivectl
    flags:
      - -mod=readonly
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
  - id: omnihive-retire
    dir: backend
    main: ./cmd/omnihive-retire
    binary: omnihive-retire
    flags:
      - -mod=readonly
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

# The self-updater needs an archive and SHA-256 checksums even for simple releases.
archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - NOTICE
      - README*

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: .cache/omnihive-release/omnihive-release-manifest.json

changelog:
  disable: true

# GHCR amd64/arm64 镜像（单架构分片，随后由 manifest 合并）
dockers:
  - id: ghcr-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/omnihive-ai-gw:{{ .Version }}-amd64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    extra_files:
      - LICENSE
      - NOTICE
      - deploy/docker-entrypoint.sh
      - backend/resources
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .Commit }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}"

  - id: ghcr-arm64
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/omnihive-ai-gw:{{ .Version }}-arm64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    extra_files:
      - LICENSE
      - NOTICE
      - deploy/docker-entrypoint.sh
      - backend/resources
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .Commit }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}"

docker_manifests:
  - name_template: "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/omnihive-ai-gw:{{ .Version }}"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/omnihive-ai-gw:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/omnihive-ai-gw:{{ .Version }}-arm64"

  - name_template: "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/omnihive-ai-gw:latest"
    skip_push: auto
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/omnihive-ai-gw:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/omnihive-ai-gw:{{ .Version }}-arm64"

release:
  extra_files:
    - glob: .cache/omnihive-release/omnihive-release-manifest.json
  github:
    owner: "{{ .Env.GITHUB_REPO_OWNER }}"
    name: "{{ .Env.GITHUB_REPO_NAME }}"
  draft: false
  prerelease: auto
  replace_existing_artifacts: false
  name_template: "OmniHive AI Gateway v{{.Version}} (Simple)"
  header: |
    > OmniHive AI Gateway — self-hosted multi-protocol AI API gateway. Upgrade from the admin console (version badge → Update) or pull the matching Docker image.
    > ⚡ Simple Release: 包含 Linux amd64/arm64 自更新包与 GHCR 多架构镜像

    {{ .Env.TAG_MESSAGE }}

  footer: |
    ---

    ## 📥 Installation

    **Docker (amd64/arm64):**
    ```bash
    docker pull ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/omnihive-ai-gw:{{ .Version }}
    ```

    ## 📚 Documentation

    - [GitHub Repository](https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }})
